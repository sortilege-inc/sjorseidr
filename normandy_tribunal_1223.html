<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Normandy Tribunal — 1223</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=UnifrakturCook:wght@700&display=swap');

:root{
  --ink:#221a12;
  --ink-soft:#4a3c2c;
  --parch:#ede0c4;
  --parch-2:#e2d2ad;
  --parch-deep:#d8c39a;
  --gold:#9a6b1f;
  --gold-bright:#c69b3f;
  --rust:#8a3324;
  --rust-bright:#b54a32;
  --teal:#2c6b66;
  --teal-bright:#3f8f86;
  --player:#1d5fb0;
  --player-bright:#2f7fd6;
  --line:#6b5436;
  --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'EB Garamond',Georgia,serif;
  color:var(--ink);
  background:
    radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%);
  overflow:hidden;
}
/* parchment grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;
  opacity:.6;mix-blend-mode:multiply;
}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:18px;
  padding:10px 22px;
  border-bottom:2px solid var(--line);
  background:linear-gradient(180deg, rgba(237,224,196,.95), rgba(226,210,173,.92));
  box-shadow:0 4px 14px var(--shadow);
}
.crest{
  flex:none;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 70%, #6e4c14);
  color:#fff6df;font-family:'Cinzel',serif;font-weight:700;font-size:20px;
  box-shadow:inset 0 0 0 2px rgba(255,240,205,.5), 0 3px 8px var(--shadow);
}
.title h1{
  font-family:'Cinzel',serif;font-weight:700;letter-spacing:.06em;
  margin:0;font-size:clamp(18px,2.4vw,30px);color:var(--ink);
  text-shadow:0 1px 0 rgba(255,245,220,.6);
}
.title .sub{font-style:italic;color:var(--ink-soft);font-size:14px;letter-spacing:.04em}
.headspace{flex:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft)}
.legend .lg{display:flex;align-items:center;gap:6px}
.swatch{width:13px;height:13px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.s-liege{background:var(--rust)} .s-vassal{background:var(--teal)}
.s-indep{background:#7a6a3c} .s-player{background:var(--player)}

.btn{
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.05em;cursor:pointer;
  border:1.5px solid var(--gold);color:var(--ink);
  background:linear-gradient(180deg,#f3e8cd,#e3d2aa);
  padding:8px 13px;border-radius:6px;box-shadow:0 2px 4px var(--shadow);
  transition:transform .12s, box-shadow .12s, background .12s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 9px var(--shadow);background:linear-gradient(180deg,#f8eed4,#e9d9b4)}
.btn:active{transform:translateY(0)}

/* ---------- main split ---------- */
.main{flex:1;display:flex;min-height:0}
.mapwrap{position:relative;flex:1;min-width:0;overflow:hidden;cursor:grab;
  background:
    radial-gradient(140% 100% at 50% 0%, #e9dab9, #d3bd91);
  border-right:2px solid var(--line);
}
.mapwrap.grabbing{cursor:grabbing}
.viewport{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.viewport img{display:block;width:1098px;height:auto;user-select:none;-webkit-user-drag:none;
  filter:sepia(.22) contrast(1.02);}
/* markers */
.marker{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:5}
.pin{
  width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2px solid rgba(255,248,230,.85);
  box-shadow:0 2px 5px rgba(40,25,8,.55);
  transition:transform .15s, box-shadow .15s, width .15s, height .15s;
}
.pin::after{content:"";position:absolute;inset:4px;border-radius:50%;background:rgba(255,250,235,.55)}
.marker:hover .pin, .marker.active .pin{width:24px;height:24px;box-shadow:0 4px 11px rgba(40,25,8,.7)}
.marker.active .pin{outline:3px solid var(--gold-bright);outline-offset:3px}
.m-liege .pin{background:var(--rust-bright)}
.m-vassal .pin,.m-vassal-of-vassal .pin{background:var(--teal-bright)}
.m-independent .pin{background:#8c7a45}
.m-player .pin{background:var(--player-bright);width:22px;height:22px}
.m-player .pin::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2px solid var(--player-bright);opacity:.6;animation:pulse 2.2s infinite;transform:rotate(45deg)}
@keyframes pulse{0%{transform:rotate(45deg) scale(.8);opacity:.7}70%{transform:rotate(45deg) scale(1.7);opacity:0}100%{opacity:0}}
.mlabel{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);
  font-family:'Cinzel',serif;font-size:10.5px;font-weight:600;white-space:nowrap;
  color:var(--ink);background:rgba(244,235,213,.82);padding:1px 5px;border-radius:3px;
  border:1px solid rgba(120,90,40,.4);pointer-events:none;opacity:0;transition:opacity .15s;
  box-shadow:0 1px 3px var(--shadow);
}
.marker:hover .mlabel,.marker.active .mlabel,.labels-on .mlabel{opacity:1}
.rankbadge{
  position:absolute;right:-9px;top:-9px;width:17px;height:17px;border-radius:50%;
  background:var(--gold-bright);color:#3a2607;font-family:'Cinzel',serif;font-weight:700;
  font-size:9.5px;display:grid;place-items:center;border:1.5px solid #fff6df;
  box-shadow:0 1px 3px rgba(0,0,0,.4);z-index:6;
}

/* zoom controls */
.zoomctl{position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:20}
.zoomctl button{
  width:40px;height:40px;font-size:20px;font-family:'Cinzel',serif;cursor:pointer;
  border:1.5px solid var(--gold);border-radius:8px;color:var(--ink);
  background:linear-gradient(180deg,#f3e8cd,#e2d0a8);box-shadow:0 2px 5px var(--shadow);
  display:grid;place-items:center;line-height:1;transition:transform .1s,background .12s;
}
.zoomctl button:hover{background:#f8eed4;transform:translateY(-1px)}
.hint{position:absolute;right:14px;bottom:12px;font-size:11.5px;font-style:italic;
  color:var(--ink-soft);background:rgba(240,230,205,.7);padding:4px 9px;border-radius:5px;z-index:20}

/* ---------- side panel ---------- */
.panel{
  width:392px;flex:none;display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,#efe3c6,#e6d6b1);
  box-shadow:inset 3px 0 8px rgba(120,90,40,.18);
}
.panel.boards .pbody{padding-top:6px}
.ptabs{display:flex;border-bottom:2px solid var(--line)}
.ptab{flex:1;font-family:'Cinzel',serif;font-size:12px;letter-spacing:.04em;text-align:center;
  padding:11px 4px;cursor:pointer;color:var(--ink-soft);border-bottom:3px solid transparent;
  transition:color .12s,background .12s}
.ptab:hover{background:rgba(198,155,63,.12)}
.ptab.active{color:var(--ink);border-bottom-color:var(--gold);background:rgba(198,155,63,.16);font-weight:600}
.pbody{flex:1;overflow-y:auto;padding:18px 20px 28px}
.pbody::-webkit-scrollbar{width:9px}
.pbody::-webkit-scrollbar-thumb{background:var(--gold);border-radius:5px;border:2px solid var(--parch)}

/* detail card */
.empty{color:var(--ink-soft);font-style:italic;text-align:center;margin-top:60px;line-height:1.7;padding:0 14px}
.empty .big{font-family:'Cinzel',serif;font-size:42px;color:var(--gold);font-style:normal;display:block;margin-bottom:10px}
.dt-role{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.dt-name{font-family:'UnifrakturCook','Cinzel',serif;font-size:34px;line-height:1.05;margin:2px 0 4px;color:var(--ink)}
.dt-meta{font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-bottom:12px}
.dt-meta b{font-style:normal;color:var(--ink)}
.rule{height:0;border:none;border-top:1.5px solid var(--line);opacity:.5;margin:14px 0}
.dt-blurb{font-size:15px;line-height:1.55;margin:0 0 6px}
.dt-detail{font-size:13.6px;line-height:1.6;color:var(--ink-soft);margin:10px 0 0}

.section-h{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:20px 0 8px;display:flex;align-items:center;gap:10px}
.section-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}

.standcard{display:flex;gap:12px;align-items:stretch;margin-top:4px}
.bigrank{flex:none;width:74px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#f6ead0,#e3d2a9);border:1.5px solid var(--gold);box-shadow:0 2px 6px var(--shadow);padding:8px 4px}
.bigrank .n{font-family:'Cinzel',serif;font-weight:700;font-size:30px;line-height:1;color:var(--ink)}
.bigrank .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px}
.standmeta{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px}
.kv{display:flex;justify-content:space-between;font-size:13.5px;border-bottom:1px dotted rgba(107,84,54,.4);padding-bottom:3px}
.kv b{font-family:'Cinzel',serif}
.seat{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;
  background:var(--rust);color:#fbeede;padding:2px 9px;border-radius:20px;margin-top:2px}

.events-grid{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin-top:6px}
.ev-name{font-size:13px}
.ev-name .ev-desc{display:block;font-size:11px;font-style:italic;color:var(--ink-soft);line-height:1.3}
.ev-pts{font-family:'Cinzel',serif;font-weight:600;font-size:13px;text-align:right;white-space:nowrap}
.ev-pts.hot{color:var(--rust)}
.barwrap{grid-column:1/3;height:6px;background:rgba(120,90,40,.18);border-radius:4px;overflow:hidden;margin:-1px 0 5px}
.bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-bright));border-radius:4px}

.magi-list{margin-top:6px}
.magus{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dotted rgba(107,84,54,.4)}
.magus:last-child{border-bottom:none}
.sigil{flex:none;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:#fbeede;
  background:linear-gradient(150deg,var(--ink-soft),var(--ink));box-shadow:0 1px 3px var(--shadow)}
.magus.f .sigil{background:linear-gradient(150deg,#7a4a64,#52283c)}
.magus .mn{font-size:14.5px}
.magus .mh{font-size:12px;font-style:italic;color:var(--ink-soft)}

.relchip{display:inline-block;font-size:12.5px;padding:4px 10px;margin:3px 5px 0 0;border-radius:20px;cursor:pointer;
  background:rgba(44,107,102,.14);border:1px solid rgba(44,107,102,.5);color:var(--teal);transition:background .12s}
.relchip:hover{background:rgba(44,107,102,.28)}
.relchip.liege{background:rgba(138,51,36,.12);border-color:rgba(138,51,36,.5);color:var(--rust)}
.relchip.liege:hover{background:rgba(138,51,36,.26)}

/* leaderboard */
.lb-intro{font-size:13px;font-style:italic;color:var(--ink-soft);line-height:1.5;margin:0 0 14px}
.lbrow{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:8px;cursor:pointer;
  transition:background .12s;border:1px solid transparent}
.lbrow:hover{background:rgba(198,155,63,.16)}
.lbrow.player{background:rgba(29,95,176,.12);border-color:rgba(29,95,176,.4)}
.lbrow.player:hover{background:rgba(29,95,176,.2)}
.lb-rk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:'Cinzel',serif;font-weight:700;font-size:14px;
  background:linear-gradient(150deg,#f0e2c2,#ddca9f);border:1.5px solid var(--gold);color:var(--ink)}
.lb-intro + .lbrow .lb-rk{background:linear-gradient(150deg,#f1d77e,#d4a93a);border-color:#a87c1e}
.boardmode{display:flex;gap:4px;margin:0 0 12px;border:1.5px solid var(--gold);border-radius:8px;padding:3px;background:rgba(244,235,213,.55);box-shadow:inset 0 1px 2px rgba(120,90,40,.18)}
.bm{flex:1;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.05em;cursor:pointer;
  border:none;background:transparent;color:var(--ink-soft);padding:7px 8px;border-radius:5px;
  transition:background .12s,color .12s,box-shadow .12s}
.bm:hover{color:var(--ink)}
.bm.on{background:linear-gradient(180deg,#f3e8cd,#e2d0a8);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb-bonus{font-size:10.5px;font-style:italic;color:var(--rust);margin-top:1px}
.lb-mid{flex:1;min-width:0}
.lb-nm{font-family:'Cinzel',serif;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-seat{font-size:11px;font-style:italic;color:var(--rust)}
.lb-right{flex:none;text-align:right}
.lb-tot{font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--ink)}
.lb-paw{font-size:11px;color:var(--ink-soft)}

@media (max-width:860px){
  .main{flex-direction:column}
  .panel{width:100%;height:46%;border-top:2px solid var(--line)}
  .mapwrap{border-right:none}
  .legend{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="crest">N</div>
    <div class="title">
      <h1>The Normandy Tribunal</h1>
      <div class="sub">Anno Domini 1223 &middot; The Hermetic Tourney at Montverte</div>
    </div>
    <div class="headspace"></div>
    <div class="legend">
      <span class="lg"><span class="swatch s-liege"></span>Liege</span>
      <span class="lg"><span class="swatch s-vassal"></span>Vassal</span>

      <span class="lg"><span class="swatch s-player"></span>Your covenant</span>
    </div>
    <button class="btn" id="labelToggle">Labels: Off</button>
  </header>

const C = DATA.covenants;
const roleLabel = {liege:'Great Liege Covenant',vassal:'Vassal Covenant','vassal-of-vassal':'Vassal-of-Vassal',independent:'Independent Covenant',player:'Player Covenant'};
const maxEvent = {Certamen:26,Dimicatio:23,Hastiludium:20,Joust:20,Melee:6,'Norman Conquest':12};

/* ---------- tournament normalization ---------- */
// Norman Conquest was cancelled — zero points across the board
Object.values(C).forEach(c=>{
  if(c.events && 'Norman Conquest' in c.events){
    const nc=c.events['Norman Conquest']||0;
    c.events['Norman Conquest']=0;
    if(c.standing) c.standing.total=Math.max(0,(c.standing.total||0)-nc);
  }
});
DATA.eventMeta['Norman Conquest']="Montverte's Host's Choice — CANCELLED (no points awarded).";

// Outstanding semifinals: each contender could still win their event outright
const OUTSTANDING={
  Dimicatio:   {contenders:['Sjórseiðr','Nidi','Oleron'],            max:23},
  Hastiludium: {contenders:['Sjórseiðr','Lapis Crudus','Bellum Iocari'], max:20},
  Joust:       {contenders:['Sjórseiðr','Montverte','Semita Errabunda'], max:20}
};
function potentialBonus(name){
  const c=C[name]; if(!c) return 0;
  let extra=0;
  Object.entries(OUTSTANDING).forEach(([ev,info])=>{
    if(info.contenders.includes(name)){
      const cur=(c.events&&c.events[ev])||0;
      extra+=Math.max(0,info.max-cur);
    }
  });
  return extra;
}
function buildLeaderboard(mode){
  const items=Object.values(C).filter(c=>c.standing).map(c=>{
    const bonus=potentialBonus(c.name);
    return {
      name:c.name,
      base:c.standing.total,
      bonus:bonus,
      total: mode==='potential' ? c.standing.total+bonus : c.standing.total,
      pawns:c.standing.pawns,
      seat:c.standing.seat||null
    };
  });
  items.sort((a,b)=>b.total-a.total || (b.pawns||0)-(a.pawns||0) || a.name.localeCompare(b.name));
  let lastTotal=null,lastRank=0;
  items.forEach((it,i)=>{
    if(it.total!==lastTotal){lastRank=i+1;lastTotal=it.total;}
    it.rank=lastRank;
  });
  return items;
}

/* ---------- map pan/zoom ---------- */
const wrap=document.getElementById('mapwrap'), vp=document.getElementById('viewport'), img=document.getElementById('mapimg');
let scale=1, tx=0, ty=0, baseW=1098, baseH=0;
function applyT(){vp.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;}
function clamp(){
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  const cw=baseW*scale, ch=baseH*scale;
  if(cw<=ww) tx=(ww-cw)/2; else tx=Math.min(0,Math.max(ww-cw,tx));
  if(ch<=wh) ty=(wh-ch)/2; else ty=Math.min(0,Math.max(wh-ch,ty));
}
function fit(){
  const ww=wrap.clientWidth, wh=wrap.clientHeight;
  const s=Math.min(ww/baseW, wh/baseH);
  scale=s; tx=(ww-baseW*scale)/2; ty=(wh-baseH*scale)/2; applyT();
}
function zoomAt(cx,cy,factor){
  const ns=Math.min(6,Math.max(0.4,scale*factor));
  const r=ns/scale;
  tx=cx-(cx-tx)*r; ty=cy-(cy-ty)*r; scale=ns; clamp(); applyT();
}
img.addEventListener('load',()=>{baseH=baseW*(img.naturalHeight/img.naturalWidth); buildMarkers(); fit();});
if(img.complete && img.naturalWidth){baseH=baseW*(img.naturalHeight/img.naturalWidth); buildMarkers(); fit();}

wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.18:1/1.18);},{passive:false});
let drag=false,sx,sy,moved=0;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.marker'))return;drag=true;moved=0;sx=e.clientX;sy=e.clientY;wrap.classList.add('grabbing');wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointermove',e=>{if(!drag)return;tx+=e.clientX-sx;ty+=e.clientY-sy;moved+=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy);sx=e.clientX;sy=e.clientY;clamp();applyT();});
wrap.addEventListener('pointerup',e=>{drag=false;wrap.classList.remove('grabbing');});
document.getElementById('zin').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,1/1.3);
document.getElementById('zreset').onclick=()=>{fit();};
window.addEventListener('resize',()=>{clamp();applyT();});

/* ---------- markers ---------- */
let activeName=null;
function buildMarkers(){
  const host=document.getElementById('markers'); host.innerHTML='';
  Object.values(C).forEach(c=>{
    if(!c.xy) return;
    const [px,py]=c.xy;
    const m=document.createElement('div');
    m.className='marker m-'+c.role; m.dataset.name=c.name;
    m.style.left=(px/100*baseW)+'px'; m.style.top=(py/100*baseH)+'px';
    m.innerHTML=`<div class="pin"></div><div class="mlabel">${c.name}</div>`;
    m.addEventListener('click',ev=>{ev.stopPropagation();select(c.name);});
    host.appendChild(m);
  });
}
function focusMarker(name){
  const c=C[name]; if(!c||!c.xy)return;
  const [px,py]=c.xy;
  if(scale<1.4) scale=1.7;
  const wx=px/100*baseW*scale, wy=py/100*baseH*scale;
  tx=wrap.clientWidth/2-wx; ty=wrap.clientHeight*0.46-wy; clamp(); applyT();
}

/* ---------- panel ---------- */
const pbody=document.getElementById('pbody'), panel=document.getElementById('panel');
let tab='detail';
document.querySelectorAll('.ptab').forEach(t=>t.onclick=()=>{
  tab=t.dataset.tab;
  document.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('active',x===t));
  render();
});
function select(name){
  activeName=name;
  document.querySelectorAll('.marker').forEach(m=>m.classList.toggle('active',m.dataset.name===name));
  tab='detail';
  document.querySelectorAll('.ptab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='detail'));
  render(); focusMarker(name);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function initials(n){const p=n.replace(/[^A-Za-zÀ-ÿ ]/g,'').split(' ').filter(Boolean);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}

function render(){
  panel.classList.toggle('boards',tab==='board');
  if(tab==='board'){renderBoard();return;}
  if(!activeName){
    pbody.innerHTML=`<div class="empty"><span class="big">&#10086;</span>
      Choose a covenant on the map to read its dossier — lineage, members, and how it fares in the 1223 Hermetic Tourney.
      <br><br>Switch to <b>Tourney Standings</b> for the live tally.</div>`;
    return;
  }
  const c=C[activeName];
  let h='';
  h+=`<div class="dt-role">${roleLabel[c.role]||'Covenant'}</div>`;
  h+=`<div class="dt-name">${esc(c.name)}</div>`;
  let meta=[];
  if(c.region) meta.push(`<b>${esc(c.region)}</b>`);
  if(c.founded && c.founded!=='—') meta.push(`founded ${esc(c.founded)}`);
  h+=`<div class="dt-meta">${meta.join(' &middot; ')}</div>`;
  h+=`<p class="dt-blurb">${esc(c.blurb)}</p>`;
  if(c.detail) h+=`<p class="dt-detail">${esc(c.detail)}</p>`;

  // lineage relations
  let rels='';
  if(c.liege && C[c.liege]) rels+=`<span class="relchip liege" data-go="${esc(c.liege)}">&#9650; Liege: ${esc(c.liege)}</span>`;
  if(c.vassals) c.vassals.forEach(v=>{ if(C[v]) rels+=`<span class="relchip" data-go="${esc(v)}">&#9651; ${esc(v)}</span>`;});
  if(rels){h+=`<div class="section-h">Lineage</div><div>${rels}</div>`;}

  // standing
  if(c.standing){
    const s=c.standing;
    h+=`<div class="section-h">Tourney Standing</div>`;
    h+=`<div class="standcard"><div class="bigrank"><div class="n">${s.rank}</div><div class="l">of 24</div></div>
      <div class="standmeta">
        <div class="kv"><span>Total points</span><b>${s.total}</b></div>
        <div class="kv"><span>Prize pawns</span><b>${s.pawns!=null?s.pawns:'—'}</b></div>
        ${s.seat?`<div><span class="seat">${esc(s.seat)}</span></div>`:''}
      </div></div>`;
  }

  // events
  if(c.events){
    h+=`<div class="section-h">Event Results</div><div class="events-grid">`;
    DATA.eventList.forEach(ev=>{
      const pts=c.events[ev]||0; const hot=pts>2;
      const pct=Math.min(100, Math.round(pts/(maxEvent[ev]||1)*100));
      h+=`<div class="ev-name">${ev}<span class="ev-desc">${esc(DATA.eventMeta[ev])}</span></div>
          <div class="ev-pts ${hot?'hot':''}">${pts} pt${pts===1?'':'s'}</div>
          <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div>`;
    });
    h+=`</div>`;
  }

  // magi
  if(c.magi){
    h+=`<div class="section-h">Magi in Attendance</div><div class="magi-list">`;
    c.magi.forEach(m=>{
      const [nm,house,sex]=m;
      h+=`<div class="magus ${sex==='f'?'f':''}"><div class="sigil">${initials(nm)}</div>
        <div><div class="mn">${esc(nm)}</div><div class="mh">${esc(house)}${sex==='f'?' &middot; she':''}</div></div></div>`;
    });
    h+=`</div>`;
  }
  pbody.innerHTML=h;
  pbody.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>select(el.dataset.go));
  pbody.scrollTop=0;
}

let boardMode='current';
function renderBoard(){
  const isPot = boardMode==='potential';
  const lb = buildLeaderboard(boardMode);
  let h=`<div class="boardmode">
    <button class="bm ${!isPot?'on':''}" data-mode="current">Current Points</button>
    <button class="bm ${isPot?'on':''}" data-mode="potential">Potential Points</button>
  </div>`;
  if(isPot){
    h+=`<p class="lb-intro">Ceiling for each covenant if it won every match still outstanding. Three semifinals remain — <b>Dimicatio</b> (Sjórseiðr · Nidi · Oleron), <b>Hastiludium</b> (Sjórseiðr · Lapis Crudus · Bellum Iocari), <b>Joust</b> (Sjórseiðr · Montverte · Semita Errabunda). The Norman Conquest was cancelled.</p>`;
  } else {
    h+=`<p class="lb-intro">Live tally of the 1223 Hermetic Tourney, hosted by Montverte. The Norman Conquest was cancelled; three semifinals remain. Click any team to find it on the map.</p>`;
  }
  lb.forEach(l=>{
    const isP = l.name==='Sjórseiðr';
    const right = isPot
      ? `<div class="lb-tot">${l.total}</div>${l.bonus>0?`<div class="lb-bonus">+${l.bonus} possible</div>`:''}`
      : `<div class="lb-tot">${l.total}</div>${l.pawns!=null?`<div class="lb-paw">${l.pawns} pawns</div>`:''}`;
    h+=`<div class="lbrow ${isP?'player':''}" data-go="${esc(l.name)}">
      <div class="lb-rk">${l.rank}</div>
      <div class="lb-mid"><div class="lb-nm">${esc(l.name)}</div>${!isPot&&l.seat?`<div class="lb-seat">${esc(l.seat)}</div>`:''}</div>
      <div class="lb-right">${right}</div>
    </div>`;
  });
  pbody.innerHTML=h;
  pbody.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>select(el.dataset.go));
  pbody.querySelectorAll('.bm').forEach(b=>b.onclick=ev=>{ev.stopPropagation();boardMode=b.dataset.mode;renderBoard();});
  pbody.scrollTop=0;
}

/* labels toggle */
let labelsOn=false;
document.getElementById('labelToggle').onclick=function(){
  labelsOn=!labelsOn;
  document.getElementById('markers').classList.toggle('labels-on',labelsOn);
  this.textContent='Labels: '+(labelsOn?'On':'Off');
};

render();
</script>
