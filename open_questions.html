<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Questions for the Storyteller</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=UnifrakturCook:wght@700&display=swap');

:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 20px 80px}
a{color:var(--teal-bright)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14.5px;margin:0}
.status{font-family:'Cinzel',serif;font-size:11.5px;color:var(--ink-soft);text-align:right;white-space:nowrap}

/* type tabs */
.typetabs{display:flex;gap:4px;margin-bottom:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.typetab{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.03em;padding:9px 16px;cursor:pointer;
  color:var(--ink-soft);border-bottom:3px solid transparent;transition:color .12s,border-color .12s;
  display:flex;align-items:center;gap:7px}
.typetab:hover{color:var(--ink)}
.typetab.active{color:var(--rust-bright);border-color:var(--rust-bright);font-weight:600}
.typetab .n{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-soft)}
.type-desc{font-style:italic;color:var(--ink-soft);font-size:13.5px;margin:10px 0 18px;
  padding:10px 14px;background:rgba(120,90,40,.08);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}

.filterbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;padding:8px 10px;
  background:rgba(120,90,40,.08);border:1px solid rgba(120,90,40,.18);border-radius:8px}
.filterbar .label{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-right:2px}
.fbtn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.04em;cursor:pointer;
  border:1px solid rgba(120,90,40,.3);background:rgba(244,235,213,.6);color:var(--ink-soft);
  padding:4px 10px;border-radius:14px;transition:all .12s}
.fbtn:hover{background:rgba(244,235,213,.95);color:var(--ink)}
.fbtn.on{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#fff6df;border-color:#7a5318;font-weight:600}
.spacer{flex:1}
.count{font-size:12.5px;color:var(--ink-soft);font-style:italic}

.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);
  border:1.5px solid rgba(120,90,40,.45);border-left-width:5px;border-radius:10px;padding:14px 18px 15px;
  box-shadow:0 2px 6px var(--shadow);transition:border-color .12s}
.qcard:hover{border-color:var(--gold)}
.qcard.type-question{border-left-color:var(--rust-bright)}
.qcard.type-thread{border-left-color:var(--teal)}
.qcard.type-consequence{border-left-color:var(--purple)}
.qcard.resolved{opacity:.65}
.qcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.qtags{display:flex;gap:6px;flex-wrap:wrap}
.qtag{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 8px;border-radius:9px;white-space:nowrap}
.qtag.type-question{background:rgba(181,74,50,.14);color:var(--rust-bright);border:1px solid rgba(181,74,50,.35)}
.qtag.type-thread{background:rgba(44,107,102,.16);color:var(--teal);border:1px solid rgba(44,107,102,.35)}
.qtag.type-consequence{background:rgba(91,58,138,.16);color:var(--purple);border:1px solid rgba(91,58,138,.4)}
.qtag.cat{background:rgba(120,90,40,.15);color:var(--ink-soft);border:1px solid rgba(120,90,40,.25)}
.qquestion{font-weight:600;font-size:16.5px;line-height:1.35;margin:0 0 6px}
.qcontext{font-size:14px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px}
.qmeta{font-size:12px;color:var(--ink-soft);font-style:italic}
.qmeta b{font-style:normal;color:var(--ink)}
.qanswer-toggle{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.qanswer-toggle label{font-family:'Cinzel',serif;font-size:11px;color:var(--ink-soft);cursor:pointer;user-select:none}
.qanswer-box{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(120,90,40,.35)}
.qanswer-box textarea{width:100%;min-height:52px;font-family:'EB Garamond',serif;font-size:14px;
  padding:6px 9px;border:1px solid rgba(120,90,40,.4);border-radius:6px;background:rgba(244,235,213,.7);
  resize:vertical}
.qanswer-box textarea::placeholder{color:rgba(74,60,44,.5);font-style:italic}

.btn{font-family:'Cinzel',serif;font-weight:600;font-size:12.5px;letter-spacing:.04em;cursor:pointer;
  border:1px solid #7a5318;border-radius:7px;padding:7px 14px;color:#fff6df;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));box-shadow:0 2px 4px var(--shadow)}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:rgba(244,235,213,.7);color:var(--ink-soft);border-color:rgba(120,90,40,.35)}

.empty{text-align:center;color:var(--ink-soft);font-style:italic;padding:40px}
footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--ink-soft);opacity:.75}

/* GM reference tab */
.reftabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.reftab{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.03em;cursor:pointer;
  border:1px solid rgba(120,90,40,.35);background:rgba(244,235,213,.55);color:var(--ink-soft);
  padding:6px 14px;border-radius:14px;transition:all .12s}
.reftab:hover{background:rgba(244,235,213,.9)}
.reftab.on{background:linear-gradient(180deg,var(--teal-bright),var(--teal));color:#fff;border-color:var(--teal)}

.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.roster-card{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);border:1.5px solid rgba(120,90,40,.4);
  border-radius:10px;padding:12px 15px}
.roster-name{font-family:'Cinzel',serif;font-weight:600;font-size:14.5px;color:var(--ink)}
.roster-title{font-style:italic;color:var(--ink-soft);font-size:12px;margin:1px 0 6px}
.roster-note{font-size:13px;line-height:1.5;color:var(--ink-soft)}
.roster-links{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.roster-link{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.03em;padding:2px 8px;border-radius:9px;
  background:rgba(44,107,102,.14);color:var(--teal);border:1px solid rgba(44,107,102,.35);cursor:pointer}

.fae-poem{font-style:italic;color:var(--ink-soft);line-height:1.7;font-size:14px;white-space:pre-line;
  background:rgba(244,235,213,.45);border-left:3px solid var(--purple);border-radius:0 8px 8px 0;
  padding:14px 18px;margin-bottom:24px;columns:2;column-gap:32px}
@media (max-width:720px){.fae-poem{columns:1}}
.fae-zone{margin-bottom:20px}
.fae-zone-title{font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:var(--purple);margin-bottom:2px}
.fae-zone-desc{font-style:italic;color:var(--ink-soft);font-size:12.5px;margin:0 0 10px}
.fae-entity{margin-bottom:8px;padding-left:14px;border-left:2px solid rgba(91,58,138,.3)}
.fae-entity-name{font-weight:600;color:var(--ink);font-size:13.5px}
.fae-entity-desc{font-size:13px;color:var(--ink-soft);line-height:1.5}

.riddle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.riddle-card{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);border:1.5px solid rgba(120,90,40,.4);
  border-radius:10px;padding:14px 16px}
.riddle-art{font-family:'Cinzel',serif;font-weight:600;font-size:14px;color:var(--rust-bright)}
.riddle-label{font-style:italic;color:var(--ink-soft);font-size:12px;margin:0 0 8px}
.riddle-q{font-style:italic;font-size:13.5px;color:var(--ink);margin:0 0 8px;line-height:1.45}
.riddle-ans{font-size:12.5px;line-height:1.5;margin:0 0 4px}
.riddle-ans b{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--ink-soft);display:block;margin-bottom:1px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="crumb"><a href="index.html">Sjórseiðr</a> · Covenant Archive</div>
      <h1>Open Questions for the Storyteller</h1>
      <p class="subtitle">Questions needing a ruling, threads nobody's picked back up, and consequences still waiting to land.</p>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>

  <div class="typetabs" id="typetabs"></div>
  <div class="type-desc" id="typeDesc"></div>
  <div class="filterbar" id="filterbar"></div>
  <div class="qlist" id="qlist"></div>

  <footer>
    <button class="btn ghost" id="saveBtn">⬇ Save JSON</button>
    Changes autosave to this browser only — use Save to keep a copy.
  </footer>
</div>

<script>
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS_KEY = 'sjorseidr_open_questions_v2';
const TYPE_ORDER = ['Question','Thread','Consequence'];
const TYPE_ICON = {Question:'❓', Thread:'🧵', Consequence:'⚖️'};
let STATE = null;
let activeType = 'all';
let filter = {category:'all', status:'all'};
let activeRefTab = 'roster';

async function load(){
  try{
    const r = await fetch('./open_questions.json', {cache:'no-store'});
    STATE = await r.json();
    const cached = localStorage.getItem(LS_KEY);
    if(cached){
      try{
        const c = JSON.parse(cached);
        const byId = {}; (c.items||[]).forEach(q=>byId[q.id]=q);
        STATE.items.forEach(q=>{
          if(byId[q.id]){ q.status = byId[q.id].status; q.resolution = byId[q.id].resolution; }
        });
      }catch(_){}
    }
    $('#status').textContent = `${STATE.items.length} items loaded`;
    render();
  }catch(e){
    $('#qlist').innerHTML = `<div class="empty">Could not load open_questions.json — open this page via a local server, not file://.<br>${esc(e.message)}</div>`;
    $('#status').textContent = 'Load failed';
  }
}

function autosave(){
  localStorage.setItem(LS_KEY, JSON.stringify(STATE));
}

function typeClass(t){ return 'type-' + (t||'').toLowerCase(); }

function categories(){
  const pool = activeType==='all' ? STATE.items : STATE.items.filter(i=>i.type===activeType);
  return [...new Set(pool.map(q=>q.category))].sort();
}

function renderTypeTabs(){
  const counts = {}; TYPE_ORDER.forEach(t=>counts[t]=STATE.items.filter(i=>i.type===t).length);
  const allTab = `<div class="typetab ${activeType==='all'?'active':''}" data-type="all">All <span class="n">(${STATE.items.length})</span></div>`;
  const tabs = TYPE_ORDER.map(t=>
    `<div class="typetab ${activeType===t?'active':''}" data-type="${t}">${TYPE_ICON[t]} ${t}s <span class="n">(${counts[t]})</span></div>`).join('');
  const refCount = (STATE.gmReference?.brugesRoster.entries.length||0)
    + (STATE.gmReference?.seaFae.zones.reduce((a,z)=>a+z.entities.length,0)||0)
    + (STATE.gmReference?.criamonRiddles.entries.length||0);
  const refTab = STATE.gmReference
    ? `<div class="typetab ${activeType==='reference'?'active':''}" data-type="reference">📚 GM Reference <span class="n">(${refCount})</span></div>` : '';
  $('#typetabs').innerHTML = allTab + tabs + refTab;
  $$('.typetab').forEach(el=>el.onclick=()=>{activeType=el.dataset.type; filter.category='all'; render();});

  const descs = {
    all: 'Everything the table has flagged, mixed together.',
    Question: STATE.meta.types.Question,
    Thread: STATE.meta.types.Thread,
    Consequence: STATE.meta.types.Consequence,
    reference: 'Prepared but unused GM material — a home-port NPC roster, a sea-fae bestiary, and a Criamon riddle bank. Reference, not resolution-tracked.',
  };
  $('#typeDesc').textContent = descs[activeType];
}

function renderFilterbar(){
  const cats = ['all', ...categories()];
  const catBtns = cats.map(c=>`<button class="fbtn ${filter.category===c?'on':''}" data-cat="${esc(c)}">${c==='all'?'All Categories':esc(c)}</button>`).join('');
  const statuses = ['all','Open','Resolved'];
  const statusBtns = statuses.map(s=>`<button class="fbtn ${filter.status===s?'on':''}" data-status="${esc(s)}">${s==='all'?'All Status':esc(s)}</button>`).join('');
  const pool = activeType==='all' ? STATE.items : STATE.items.filter(i=>i.type===activeType);
  const openCount = pool.filter(q=>q.status!=='Resolved').length;
  $('#filterbar').innerHTML = `
    <span class="label">Category:</span> ${catBtns}
    <span class="label" style="margin-left:8px">Status:</span> ${statusBtns}
    <span class="spacer"></span>
    <span class="count">${openCount} still open · ${pool.length} total</span>
  `;
  $$('#filterbar .fbtn[data-cat]').forEach(b=>b.onclick=()=>{filter.category=b.dataset.cat;render();});
  $$('#filterbar .fbtn[data-status]').forEach(b=>b.onclick=()=>{filter.status=b.dataset.status;render();});
}

function qCard(q){
  const resolved = q.status === 'Resolved';
  const tc = typeClass(q.type);
  const resolveLabel = q.type === 'Question' ? 'Answered' : (q.type === 'Thread' ? 'Picked up' : 'Resolved');
  return `<div class="qcard ${tc} ${resolved?'resolved':''}" data-id="${esc(q.id)}">
    <div class="qcard-top">
      <div class="qtags">
        <span class="qtag ${tc}">${TYPE_ICON[q.type]} ${esc(q.type)}</span>
        <span class="qtag cat">${esc(q.category)}</span>
      </div>
      <div class="qanswer-toggle">
        <input type="checkbox" id="chk-${esc(q.id)}" ${resolved?'checked':''}>
        <label for="chk-${esc(q.id)}">${resolveLabel}</label>
      </div>
    </div>
    <p class="qquestion">${esc(q.title)}</p>
    <p class="qcontext">${esc(q.context)}</p>
    <div class="qmeta">Raised in <b>${esc(q.raised_in)}</b> — <i>${esc(q.raised_event)}</i></div>
    <div class="qanswer-box" style="${resolved?'':'display:none'}">
      <textarea placeholder="Resolution / GM ruling…">${esc(q.resolution||'')}</textarea>
    </div>
  </div>`;
}

function rosterCard(e){
  const links = (e.linksTo||[]).map(id=>`<span class="roster-link" data-jump="${esc(id)}">→ ${esc(id)}</span>`).join('');
  return `<div class="roster-card">
    <div class="roster-name">${esc(e.name)}</div>
    <div class="roster-title">${esc(e.title)}</div>
    <p class="roster-note">${esc(e.note)}</p>
    ${links ? `<div class="roster-links">${links}</div>` : ''}
  </div>`;
}

function renderReference(){
  $('#filterbar').innerHTML = '';
  const ref = STATE.gmReference;
  if(!ref){ $('#qlist').innerHTML = `<div class="empty">No GM reference data loaded.</div>`; return; }

  const tabs = [
    ['roster', `🎭 Bruges Roster (${ref.brugesRoster.entries.length})`],
    ['seaFae', `🌊 Sea Fae Bestiary`],
    ['riddles', `🌀 Criamon Riddles (${ref.criamonRiddles.entries.length})`],
  ];
  const tabsHtml = tabs.map(([k,label])=>`<div class="reftab ${activeRefTab===k?'on':''}" data-ref="${k}">${label}</div>`).join('');

  let body = '';
  if(activeRefTab === 'roster'){
    body = `<p class="type-desc" style="margin-top:0">${esc(ref.brugesRoster.note)}</p>
      <div class="roster-grid">${ref.brugesRoster.entries.map(rosterCard).join('')}</div>`;
  } else if(activeRefTab === 'seaFae'){
    const poem = ref.seaFae.poem;
    body = `<p class="type-desc" style="margin-top:0">${esc(ref.seaFae.note)}</p>
      <div class="fae-poem"><em>— ${esc(poem.title)} —</em>\n\n${esc(poem.stanzas.join('\n\n'))}</div>
      ${ref.seaFae.zones.map(z=>`
        <div class="fae-zone">
          <div class="fae-zone-title">${esc(z.name)}</div>
          <p class="fae-zone-desc">${esc(z.description)}</p>
          ${z.entities.map(en=>`<div class="fae-entity"><span class="fae-entity-name">${esc(en.name)}</span> — <span class="fae-entity-desc">${esc(en.description)}</span></div>`).join('')}
        </div>
      `).join('')}`;
  } else if(activeRefTab === 'riddles'){
    body = `<p class="type-desc" style="margin-top:0">${esc(ref.criamonRiddles.note)}</p>
      <div class="riddle-grid">${ref.criamonRiddles.entries.map(r=>`
        <div class="riddle-card">
          <div class="riddle-art">${esc(r.art)} <span style="color:var(--ink-soft);font-weight:400">(${esc(r.code)})</span></div>
          <p class="riddle-label">${esc(r.label)}</p>
          <p class="riddle-q">“${esc(r.riddle)}”</p>
          <p class="riddle-ans"><b>Shallow</b>${esc(r.shallow)}</p>
          <p class="riddle-ans"><b>Deep</b>${esc(r.deep)}</p>
        </div>
      `).join('')}</div>`;
  }

  $('#qlist').innerHTML = `<div class="reftabs">${tabsHtml}</div>${body}`;
  $$('.reftab').forEach(el=>el.onclick=()=>{activeRefTab=el.dataset.ref; render();});
  $$('.roster-link').forEach(el=>el.onclick=()=>{
    const id = el.dataset.jump;
    const q = STATE.items.find(x=>x.id===id);
    if(!q) return;
    activeType = q.type; filter.category='all'; filter.status='all';
    render();
    requestAnimationFrame(()=>document.querySelector(`.qcard[data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}));
  });
}

function render(){
  renderTypeTabs();
  if(activeType === 'reference'){ renderReference(); return; }
  renderFilterbar();
  let list = STATE.items.filter(q=>{
    if(activeType!=='all' && q.type!==activeType) return false;
    if(filter.category!=='all' && q.category!==filter.category) return false;
    if(filter.status!=='all' && (q.status||'Open')!==filter.status) return false;
    return true;
  });
  $('#qlist').innerHTML = list.length
    ? list.map(qCard).join('')
    : `<div class="empty">Nothing matches this filter.</div>`;

  $$('.qcard').forEach(card=>{
    const id = card.dataset.id;
    const q = STATE.items.find(x=>x.id===id);
    const chk = card.querySelector('input[type=checkbox]');
    const box = card.querySelector('.qanswer-box');
    const ta = card.querySelector('textarea');
    chk.onchange = ()=>{
      q.status = chk.checked ? 'Resolved' : 'Open';
      box.style.display = chk.checked ? '' : 'none';
      card.classList.toggle('resolved', chk.checked);
      autosave();
    };
    ta.oninput = ()=>{ q.resolution = ta.value; autosave(); };
  });
}

$('#saveBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'open_questions.json'; a.click();
  URL.revokeObjectURL(url);
};

load();
</script>
</body>
</html>
