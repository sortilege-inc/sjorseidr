<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjórseiðr — Reference</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');

:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 20px 80px}
a{color:var(--teal-bright)}

header{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14.5px;margin:0}

.section{margin:28px 0}
.section-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--rust-bright);border-bottom:1px solid rgba(120,90,40,.35);margin:0 0 8px;padding-bottom:5px}
.section-sub{font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink-soft);margin:20px 0 8px}

.note-flag{font-size:13px;font-style:italic;color:var(--ink-soft);margin:0 0 16px;
  padding:9px 13px;background:rgba(120,90,40,.08);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}

.tablewrap{overflow-x:auto;border:1px solid rgba(120,90,40,.35);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;background:rgba(244,235,213,.55);font-variant-numeric:tabular-nums}
th{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);
  text-align:center;padding:8px 10px;border-bottom:2px solid rgba(120,90,40,.35);white-space:nowrap}
th.corner{text-align:left;background:rgba(120,90,40,.08)}
td{padding:7px 10px;border-bottom:1px solid rgba(120,90,40,.2);text-align:center;white-space:nowrap}
td.rowhead{font-family:'Cinzel',serif;font-size:11px;text-align:left;color:var(--ink-soft);
  background:rgba(120,90,40,.06);white-space:nowrap}
td.diag{color:var(--ink-soft);opacity:.5}
tr:last-child td{border-bottom:none}

footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--ink-soft);opacity:.75}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="index.html">Sjórseiðr</a> · Covenant Archive</div>
    <h1>Reference</h1>
    <p class="subtitle">Miscellaneous GM reference tables that don't belong on any single page.</p>
  </header>

  <div id="content"></div>

  <footer>Sourced from the campaign's Notion workspace.</footer>
</div>

<script>
const $ = s=>document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  try{
    const r = await fetch('./reference.json', {cache:'no-store'});
    const d = await r.json();
    render(d);
  }catch(e){
    $('#content').innerHTML = `<div class="note-flag">Could not load reference.json — open via a local server, not file://.<br>${esc(e.message)}</div>`;
  }
}

function matrixTable(locations, matrix){
  const head = `<tr><th class="corner">From \\ To</th>${locations.map(l=>`<th>${esc(l)}</th>`).join('')}</tr>`;
  const rows = locations.map((loc, i) => `<tr>
    <td class="rowhead">${esc(loc)}</td>
    ${matrix[i].map((v, j) => `<td class="${i===j?'diag':''}">${v}</td>`).join('')}
  </tr>`).join('');
  return `<div class="tablewrap"><table>${head}${rows}</table></div>`;
}

function render(d){
  const tt = d.travelTimes || {};
  $('#content').innerHTML = `
    <div class="section">
      <div class="section-title">North Sea &amp; Baltic Travel Times</div>
      <p class="note-flag">${esc(tt.note || '')} Figures are in ${esc(tt.unit || 'days')} of sailing.</p>

      <div class="section-sub">North Sea &amp; Channel</div>
      ${matrixTable(tt.northSea.locations, tt.northSea.matrix)}

      <div class="section-sub">Baltic</div>
      ${matrixTable(tt.baltic.locations, tt.baltic.matrix)}
    </div>
  `;
}

load();
</script>
</body>
</html>
