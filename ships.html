<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjórseiðr — Fleet &amp; Crew</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=UnifrakturCook:wght@700&display=swap');

:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:32px 20px 80px;
  transition:margin-right .2s ease}
.wrap.sidebar-open{margin-right:min(320px,90vw)}
.wrap.sidebar-open.sidebar-wide{margin-right:min(600px,94vw)}
a{color:var(--teal-bright)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14.5px;margin:0}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.03em;padding:9px 16px;cursor:pointer;
  color:var(--ink-soft);border-bottom:3px solid transparent;transition:color .12s,border-color .12s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--rust-bright);border-color:var(--rust-bright);font-weight:600}

.snap-note{font-style:italic;color:var(--ink-soft);font-size:14px;margin:0 0 18px;
  padding:10px 14px;background:rgba(120,90,40,.08);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}

.ship-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.ship-card{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);
  border:1.5px solid rgba(120,90,40,.45);border-radius:10px;padding:14px 16px 15px;
  box-shadow:0 2px 6px var(--shadow)}
.ship-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ship-name{font-family:'Cinzel',serif;font-weight:600;font-size:16.5px;color:var(--ink)}
.ship-owner{font-style:italic;color:var(--ink-soft);font-size:12.5px;margin:0 0 8px}
.ship-status{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 8px;border-radius:9px;white-space:nowrap;flex:none}
.ship-status.active{background:rgba(62,107,53,.16);color:var(--green);border:1px solid rgba(62,107,53,.4)}
.ship-status.lost,.ship-status.missing,.ship-status.fate-unknown{background:rgba(138,51,36,.14);color:var(--rust);border:1px solid rgba(138,51,36,.4)}
.ship-status.uncertain,.ship-status.unclear{background:rgba(154,107,31,.16);color:var(--gold);border:1px solid rgba(154,107,31,.4)}
.ship-status.reassigned{background:rgba(44,107,102,.16);color:var(--teal);border:1px solid rgba(44,107,102,.35)}
.ship-status.no-longer-part-of-the-covenant{background:rgba(74,60,44,.14);color:var(--ink-soft);border:1px solid rgba(74,60,44,.3)}
.ship-desc{font-size:13.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 10px}
.ship-captain{font-style:italic;color:var(--ink-soft);font-size:12px;margin:-6px 0 8px}
.ship-note{font-size:12.5px;line-height:1.45;color:var(--ink-soft);font-style:italic;margin:0 0 10px}
.crew-label{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:6px}
.crew-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:'EB Garamond',serif;font-size:13px;cursor:pointer;
  background:rgba(244,235,213,.7);border:1px solid rgba(120,90,40,.4);border-radius:14px;
  padding:3px 11px;color:var(--ink);transition:all .12s}
.chip:hover{background:var(--gold-bright);color:#fff6df;border-color:#7a5318}
.crew-empty{font-size:12.5px;font-style:italic;color:var(--ink-soft)}

.ref-list{display:flex;flex-direction:column;gap:12px}

/* sidebar */
#sidebar{position:fixed;top:0;right:0;width:min(320px,90vw);height:100vh;z-index:50;
  background:linear-gradient(180deg,var(--parch),var(--parch-deep));
  border-left:2px solid var(--line);box-shadow:-8px 0 24px var(--shadow);
  transform:translateX(100%);transition:transform .2s ease,width .2s ease;
  overflow-y:auto;padding:20px}
#sidebar.open{transform:translateX(0)}
#sidebar.wide{width:min(600px,94vw)}
#sidebarClose{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;
  cursor:pointer;color:var(--ink-soft);line-height:1;z-index:2}
#sidebarClose:hover{color:var(--rust)}
.sb-name{font-family:'Cinzel',serif;font-weight:600;font-size:20px;color:var(--rust-bright);margin:26px 0 2px}
.sb-role{font-style:italic;color:var(--ink-soft);font-size:14px;margin:0 0 2px}
.sb-affil{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
.sb-note{font-size:14.5px;line-height:1.55;margin:0 0 18px}
.sb-stub{border:1.5px dashed rgba(120,90,40,.5);border-radius:8px;padding:14px;
  text-align:center;color:var(--ink-soft);font-style:italic;font-size:13px}
#overlay{position:fixed;inset:0;background:rgba(30,20,10,.25);z-index:40;display:none}
#overlay.open{display:block}

/* magus sheet */
.sheet-header{display:flex;gap:14px;align-items:flex-start;margin:8px 0 14px}
.sheet-portrait{width:76px;height:76px;border-radius:8px;object-fit:cover;flex:none;
  border:1.5px solid rgba(120,90,40,.5);box-shadow:0 2px 6px var(--shadow)}
.sheet-portrait.placeholder{display:flex;align-items:center;justify-content:center;
  background:rgba(120,90,40,.12);font-size:26px;color:var(--ink-soft)}
.sheet-name{font-family:'Cinzel',serif;font-weight:600;font-size:19px;color:var(--rust-bright);margin:0 0 2px}
.sheet-sub{font-style:italic;color:var(--ink-soft);font-size:12.5px;line-height:1.4;margin:0}
.sheet-meta{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
.meta-chip{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
  padding:2px 8px;border-radius:9px;background:rgba(120,90,40,.1);color:var(--ink-soft);
  border:1px solid rgba(120,90,40,.3);white-space:nowrap}
.sheet-source{font-size:11px;font-style:italic;color:var(--ink-soft);opacity:.75;margin:2px 0 16px}

.sheet-section-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1px solid rgba(120,90,40,.35);margin:18px 0 8px;padding-bottom:3px}

.char-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 6px}
.char-stat{text-align:center;background:rgba(244,235,213,.55);border:1px solid rgba(120,90,40,.3);
  border-radius:6px;padding:5px 2px}
.char-stat .cs-label{display:block;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:.04em;color:var(--ink-soft)}
.char-stat .cs-val{display:block;font-size:16px;font-weight:600;color:var(--ink)}

.arts-row-label{font-size:10.5px;color:var(--ink-soft);font-style:italic;margin:8px 0 4px}
.arts-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.art-cell{text-align:center;background:rgba(244,235,213,.55);border:1px solid rgba(120,90,40,.3);
  border-radius:6px;padding:4px 2px}
.art-cell .a-label{display:block;font-size:10px;color:var(--ink-soft)}
.art-cell .a-val{display:block;font-size:14.5px;font-weight:600;color:var(--teal)}
.art-cell.technique .a-val{color:var(--rust)}

.vf-list{display:flex;flex-direction:column;gap:6px}
.vf-item{font-size:12.5px;line-height:1.45;padding:6px 9px;border-radius:6px;background:rgba(244,235,213,.5);
  border-left:3px solid var(--line)}
.vf-item.virtue{border-left-color:var(--green)}
.vf-item.flaw{border-left-color:var(--rust)}
.vf-item .vf-name{font-weight:600;color:var(--ink)}
.vf-item .vf-impact{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);
  font-style:normal;margin-left:5px}
.vf-item .vf-desc{display:block;color:var(--ink-soft);margin-top:2px}

.ability-row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;
  border-bottom:1px dotted rgba(120,90,40,.25)}
.ability-row .ab-name{color:var(--ink)}
.ability-row .ab-spec{color:var(--ink-soft);font-style:italic;font-size:11.5px}
.ability-row .ab-score{font-weight:600;color:var(--teal);flex:none}

.spell-item{margin-bottom:9px;padding:7px 9px;background:rgba(244,235,213,.5);border-radius:6px;
  border:1px solid rgba(120,90,40,.25)}
.spell-item .sp-name{font-weight:600;font-size:13px;color:var(--ink)}
.spell-item .sp-meta{font-size:11px;color:var(--ink-soft);margin:1px 0 3px}
.spell-item .sp-desc{font-size:12px;color:var(--ink-soft);line-height:1.4}

.trait-chips,.rep-chips{display:flex;flex-wrap:wrap;gap:5px}
.trait-chip{font-size:11.5px;padding:2px 9px;border-radius:11px;background:rgba(91,58,138,.12);
  color:var(--purple);border:1px solid rgba(91,58,138,.3)}

.wound-warn{font-size:12.5px;padding:7px 10px;border-radius:6px;background:rgba(138,51,36,.12);
  border:1px solid rgba(138,51,36,.35);color:var(--rust);margin-bottom:4px}

.sheet-collapsible summary{cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid rgba(120,90,40,.35);
  margin:18px 0 8px;padding-bottom:3px;list-style:none}
.sheet-collapsible summary::-webkit-details-marker{display:none}
.sheet-collapsible summary::before{content:'▸ ';color:var(--gold)}
.sheet-collapsible[open] summary::before{content:'▾ '}
.sheet-empty{font-size:12px;font-style:italic;color:var(--ink-soft)}

footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--ink-soft);opacity:.75}
</style>
</head>
<body>
<div id="overlay"></div>
<div id="sidebar">
  <button id="sidebarClose">✕</button>
  <div id="sidebarContent"></div>
</div>

<div class="wrap" id="wrap">
  <header>
    <div>
      <div class="crumb"><a href="index.html">Sjórseiðr</a> · Covenant Archive</div>
      <h1>Fleet &amp; Crew</h1>
      <p class="subtitle">Who's aboard which ship, by story period. Click a name for a quick character card.</p>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>Full character sheets (pulled from Foundry) are wired up for the six magi. Everyone else still gets a quick-note card until fleshed out.</footer>
</div>

<script>
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA = null;
let MAGI = null; // name -> full sheet, keyed by exact Foundry name
let activeTab = null; // snapshot id, or 'all-ships'

// ships.json spells some names slightly differently than the Foundry actor name
// (e.g. a single-L typo). Map those known variants -> the Foundry name here.
const MAGI_ALIASES = {
  'Wilhelm Stienauer': 'Willhelm Stienauer',
};

function findMagus(name){
  if(!MAGI) return null;
  if(MAGI[name]) return MAGI[name];
  const alias = MAGI_ALIASES[name];
  if(alias && MAGI[alias]) return MAGI[alias];
  return null;
}

async function load(){
  try{
    const [shipsRes, magiRes] = await Promise.all([
      fetch('./ships.json', {cache:'no-store'}),
      fetch('./magi.json', {cache:'no-store'}).catch(()=>null),
    ]);
    DATA = await shipsRes.json();
    if(magiRes && magiRes.ok){
      const magiJson = await magiRes.json();
      MAGI = magiJson.magi || {};
    }
    activeTab = (DATA.snapshots[0]||{}).id || 'all-ships';
    render();
  }catch(e){
    $('#content').innerHTML = `<div class="snap-note">Could not load ships.json — open via a local server, not file://.<br>${esc(e.message)}</div>`;
  }
}

function statusClass(status){
  return (status||'').toLowerCase().replace(/[^a-z]+/g,'-').replace(/(^-|-$)/g,'');
}

function shipById(id){ return DATA.ships.find(s=>s.id===id); }

function renderTabs(){
  const snapTabs = DATA.snapshots.map(s=>
    `<div class="tab ${activeTab===s.id?'active':''}" data-tab="${esc(s.id)}">${esc(s.label)}</div>`).join('');
  $('#tabs').innerHTML = snapTabs +
    `<div class="tab ${activeTab==='all-ships'?'active':''}" data-tab="all-ships">All Ships (reference)</div>`;
  $$('.tab').forEach(t=>t.onclick=()=>{activeTab=t.dataset.tab;render();});
}

function crewChips(names, emptyText){
  if(!names || !names.length) return `<div class="crew-empty">— ${esc(emptyText||'no crew listed')} —</div>`;
  return `<div class="crew-list">${names.map(n=>`<button class="chip" data-name="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
}

function shipHeadHtml(ship){
  const displayName = ship.aka ? `${esc(ship.name)} <span style="font-weight:400;font-style:italic;color:var(--ink-soft);font-size:13px">(aka ${esc(ship.aka)})</span>` : esc(ship.name);
  return `<div class="ship-head">
      <div>
        <div class="ship-name">${displayName}</div>
        <div class="ship-owner">${esc(ship.owner)}</div>
      </div>
      <span class="ship-status ${statusClass(ship.status)}">${esc(ship.status)}</span>
    </div>
    ${ship.captain ? `<p class="ship-captain">Captained by ${esc(ship.captain)}</p>` : ''}`;
}

function renderSnapshot(snap){
  const cards = snap.assignments.map(a=>{
    const ship = shipById(a.ship);
    if(!ship) return '';
    return `<div class="ship-card">
      ${shipHeadHtml(ship)}
      <div class="crew-label">Aboard this leg</div>
      ${crewChips(a.crew, 'no crew listed for this leg')}
      ${a.note ? `<p class="ship-note" style="margin-top:10px">${esc(a.note)}</p>` : ''}
    </div>`;
  }).join('');
  $('#content').innerHTML = `
    <p class="snap-note">${esc(snap.note||'')}</p>
    <div class="ship-grid">${cards}</div>
  `;
}

function renderAllShips(){
  const cards = DATA.ships.map(ship=>`<div class="ship-card">
      ${shipHeadHtml(ship)}
      <p class="ship-desc">${esc(ship.description)}</p>
      <div class="crew-label">Standing crew</div>
      ${crewChips(ship.standing_crew, 'no standing crew recorded')}
      ${ship.former_crew && ship.former_crew.length ? `<div class="crew-label" style="margin-top:8px">Formerly</div>${crewChips(ship.former_crew, '')}` : ''}
    </div>`).join('');
  $('#content').innerHTML = `
    <p class="snap-note">Full fleet reference, independent of any single time period — including ships lost, retired, or of uncertain status.</p>
    <div class="ship-grid ref-list">${cards}</div>
  `;
}

function render(){
  renderTabs();
  if(activeTab === 'all-ships') renderAllShips();
  else{
    const snap = DATA.snapshots.find(s=>s.id===activeTab);
    if(snap) renderSnapshot(snap); else renderAllShips();
  }
  $$('.chip').forEach(c=>c.onclick=()=>openSidebar(c.dataset.name));
}

const CHAR_LABELS = {int:'Int',per:'Per',str:'Str',sta:'Sta',pre:'Pre',com:'Com',dex:'Dex',qik:'Qik'};
const CHAR_ORDER = ['int','per','str','sta','pre','com','dex','qik'];
const TECH_ORDER = ['cr','in','mu','pe','re'];
const FORM_ORDER = ['an','aq','au','co','he','ig','im','me','te','vi'];

function signed(n){ n = n||0; return n>0 ? `+${n}` : `${n}`; }

function charGridHtml(chars){
  return `<div class="char-grid">${CHAR_ORDER.map(k=>`
    <div class="char-stat"><span class="cs-label">${CHAR_LABELS[k]}</span><span class="cs-val">${signed(chars[k])}</span></div>
  `).join('')}</div>`;
}

function artsGridHtml(arts){
  const row = (codes, cls) => `<div class="arts-grid">${codes.map(code=>{
    const a = arts[code];
    return `<div class="art-cell ${cls}"><span class="a-label">${a?a.label:code}</span><span class="a-val">${a?a.score:0}</span></div>`;
  }).join('')}</div>`;
  return `
    <div class="arts-row-label">Techniques</div>
    ${row(TECH_ORDER,'technique')}
    <div class="arts-row-label">Forms</div>
    ${row(FORM_ORDER,'form')}
  `;
}

function vfListHtml(list, cls){
  if(!list || !list.length) return `<div class="sheet-empty">— none recorded —</div>`;
  return `<div class="vf-list">${list.map(v=>`
    <div class="vf-item ${cls}">
      <span class="vf-name">${esc(v.name)}</span>${v.impact?`<span class="vf-impact">${esc(v.impact)}</span>`:''}
      ${v.description?`<span class="vf-desc">${esc(v.description)}</span>`:''}
    </div>
  `).join('')}</div>`;
}

function abilitiesHtml(list){
  if(!list || !list.length) return `<div class="sheet-empty">— none recorded —</div>`;
  return list.map(a=>`
    <div class="ability-row">
      <span><span class="ab-name">${esc(a.name)}</span>${a.speciality?` <span class="ab-spec">(${esc(a.speciality)})</span>`:''}</span>
      <span class="ab-score">${a.score}</span>
    </div>
  `).join('');
}

const RDT = s => (s||'').replace(/^\w/, c=>c.toUpperCase());

function spellsHtml(list){
  if(!list || !list.length) return `<div class="sheet-empty">— none recorded —</div>`;
  return list.map(sp=>`
    <div class="spell-item">
      <div class="sp-name">${esc(sp.name)} <span style="font-weight:400;color:var(--ink-soft);font-size:11.5px">(lvl ${sp.level})</span></div>
      <div class="sp-meta">${esc(sp.technique)}${sp.form?'/'+esc(sp.form):''} · ${RDT(sp.range)}/${RDT(sp.duration)}/${RDT(sp.target)}${sp.ritual?' · Ritual':''}</div>
      ${sp.description?`<div class="sp-desc">${esc(sp.description)}</div>`:''}
    </div>
  `).join('');
}

function magusSheetHtml(m){
  const portrait = m.portrait
    ? `<img class="sheet-portrait" src="${esc(m.portrait)}" alt="${esc(m.name)}">`
    : `<div class="sheet-portrait placeholder">🜛</div>`;
  const sub = [m.house?`House ${m.house}`:'', m.parens?`parens ${m.parens}`:''].filter(Boolean).join(' · ');
  const metaChips = [
    m.age!=null?`Age ${m.age}`:'',
    m.apparentAge!=null && m.apparentAge!==m.age?`(apparent ${m.apparentAge})`:'',
    m.confidence?`Confidence ${m.confidence.score}`:'',
    m.size!=null?`Size ${signed(m.size)}`:'',
    m.decrepitude?`Decrepitude ${m.decrepitude}`:'',
    m.warping?`Warping ${m.warping}`:'',
  ].filter(Boolean).map(t=>`<span class="meta-chip">${esc(t)}</span>`).join('');

  const wounds = (m.activeWounds && m.activeWounds.length)
    ? m.activeWounds.map(w=>`<div class="wound-warn">⚕ ${esc(w.gravity)} wound${w.description?' — '+esc(w.description):''}</div>`).join('')
    : '';

  const extras = [];
  if(m.sigil) extras.push(`<div><em>Sigil:</em> ${esc(m.sigil)}</div>`);
  if(m.sanctum) extras.push(`<div><em>Sanctum:</em> ${esc(m.sanctum)}</div>`);
  if(m.familiar) extras.push(`<div><em>Familiar:</em> ${esc(m.familiar)}</div>`);

  return `
    <div class="sheet-header">
      ${portrait}
      <div>
        <div class="sheet-name">${esc(m.name)}</div>
        <p class="sheet-sub">${esc(sub)}</p>
      </div>
    </div>
    <div class="sheet-meta">${metaChips}</div>
    ${wounds}
    ${extras.length?`<p class="sb-note" style="font-size:12.5px;margin:8px 0">${extras.join('<br>')}</p>`:''}

    <div class="sheet-section-title">Characteristics</div>
    ${charGridHtml(m.characteristics||{})}

    <div class="sheet-section-title">Arts</div>
    ${artsGridHtml(m.arts||{})}

    ${m.personalityTraits && m.personalityTraits.length ? `
    <div class="sheet-section-title">Personality</div>
    <div class="trait-chips">${m.personalityTraits.map(t=>`<span class="trait-chip">${esc(t)}</span>`).join('')}</div>
    ` : ''}

    <details class="sheet-collapsible" open>
      <summary>Virtues (${(m.virtues||[]).length})</summary>
      ${vfListHtml(m.virtues,'virtue')}
    </details>
    <details class="sheet-collapsible">
      <summary>Flaws (${(m.flaws||[]).length})</summary>
      ${vfListHtml(m.flaws,'flaw')}
    </details>
    <details class="sheet-collapsible">
      <summary>Abilities (${(m.abilities||[]).length})</summary>
      ${abilitiesHtml(m.abilities)}
    </details>
    <details class="sheet-collapsible">
      <summary>Spells (${(m.spells||[]).length})</summary>
      ${spellsHtml(m.spells)}
    </details>
    ${m.reputations && m.reputations.length ? `
    <details class="sheet-collapsible">
      <summary>Reputations (${m.reputations.length})</summary>
      <div class="vf-list">${m.reputations.map(r=>`<div class="vf-item"><span class="vf-name">${esc(r.name)}</span>${r.description?`<span class="vf-desc">${esc(r.description)}</span>`:''}</div>`).join('')}</div>
    </details>
    ` : ''}

    <p class="sheet-source">Pulled from the live Foundry sheet — treat as a snapshot, not a live view. Some scores may still reflect character-creation defaults rather than in-play advancement.</p>
  `;
}

function openSidebar(name){
  const magus = findMagus(name);
  if(magus){
    $('#sidebarContent').innerHTML = magusSheetHtml(magus);
    $('#sidebar').classList.add('wide');
    $('#wrap').classList.add('sidebar-wide');
  } else {
    const c = (DATA.characters||{})[name] || {};
    $('#sidebarContent').innerHTML = `
      <div class="sb-name">${esc(name)}</div>
      <p class="sb-role">${esc(c.role||'Role unrecorded')}</p>
      <p class="sb-affil">${esc(c.affiliation||'')}</p>
      <p class="sb-note">${esc(c.note||'')}</p>
      <div class="sb-stub">📜 Full character sheet — coming soon</div>
    `;
    $('#sidebar').classList.remove('wide');
    $('#wrap').classList.remove('sidebar-wide');
  }
  $('#sidebar').classList.add('open');
  $('#overlay').classList.add('open');
  $('#wrap').classList.add('sidebar-open');
}
function closeSidebar(){
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('open');
  $('#wrap').classList.remove('sidebar-open');
}
$('#sidebarClose').onclick = closeSidebar;
$('#overlay').onclick = closeSidebar;

load();
</script>
</body>
</html>
