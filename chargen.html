<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjórseiðr — Character Creator</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;min-height:100vh}
a{color:var(--teal-bright)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 90px}
header{border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(20px,3.4vw,27px);color:var(--rust-bright);margin:6px 0 3px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14px;margin:0}
.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.rail{position:static!important}}
.rail{position:sticky;top:14px;align-self:start}
.steps{list-style:none;margin:0 0 14px;padding:0}
.steps li{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.02em;padding:7px 10px;border-radius:7px;
  cursor:pointer;color:var(--ink-soft);border:1px solid transparent;display:flex;gap:8px;align-items:center;margin-bottom:2px}
.steps li:hover{background:rgba(120,90,40,.08)}
.steps li.active{background:rgba(154,107,31,.14);border-color:rgba(154,107,31,.4);color:var(--ink)}
.steps li.done .st-num{background:var(--green);color:#fff;border-color:var(--green)}
.steps li.invalid .st-num{background:var(--rust);color:#fff;border-color:var(--rust)}
.st-num{flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:11px;background:var(--parch)}
.mode-box{background:rgba(44,107,102,.08);border:1px solid rgba(44,107,102,.3);border-radius:9px;padding:8px 10px;margin-bottom:10px;text-align:center}
.mode-lbl{display:block;font-family:'Cinzel',serif;font-size:12px;color:var(--teal);letter-spacing:.03em;margin-bottom:5px}
.mode-sw{font-family:'EB Garamond',serif;font-size:11.5px;color:var(--ink-soft);background:transparent;border:1px solid rgba(120,90,40,.4);border-radius:6px;padding:3px 8px;cursor:pointer}
.mode-sw:hover{background:rgba(120,90,40,.1)}
.budget{background:rgba(244,235,213,.7);border:1px solid rgba(120,90,40,.35);border-radius:9px;padding:10px 12px;font-size:12.5px}
.budget h4{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--rust-bright);margin:0 0 7px}
.budget .brow{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.budget .brow.bad{color:var(--rust);font-weight:600}
.budget .brow.ok{color:var(--green)}
.panel{background:rgba(245,238,220,.55);border:1px solid rgba(120,90,40,.35);border-radius:11px;padding:18px 20px;min-height:320px}
.step-title{font-family:'Cinzel',serif;font-size:16px;color:var(--rust-bright);margin:0 0 4px}
.step-help{font-size:14px;color:var(--ink-soft);margin:0 0 14px;line-height:1.5}
label.fld{display:block;font-size:12px;font-family:'Cinzel',serif;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin:12px 0 3px}
input[type=text],input[type=number],select,textarea{width:100%;font-family:'EB Garamond',serif;font-size:14.5px;
  padding:7px 9px;border:1px solid rgba(120,90,40,.4);border-radius:6px;background:rgba(255,252,244,.7);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
.typecards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
@media(max-width:560px){.typecards{grid-template-columns:1fr}}
.tc{border:1px solid rgba(120,90,40,.4);border-radius:9px;padding:12px;cursor:pointer;background:rgba(255,252,244,.5)}
.tc.sel{border-color:var(--gold);background:rgba(198,155,63,.14);box-shadow:0 0 0 1px var(--gold) inset}
.tc h4{font-family:'Cinzel',serif;margin:0 0 4px;color:var(--rust)}
.tc p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:720px){.pick-grid{grid-template-columns:1fr}}
.pick-col h4{font-family:'Cinzel',serif;font-size:13px;color:var(--rust-bright);margin:0 0 6px;display:flex;justify-content:space-between}
.searchbar{display:flex;gap:6px;margin-bottom:6px}
.searchbar select{flex:none;width:auto}
.list{max-height:320px;overflow:auto;border:1px solid rgba(120,90,40,.3);border-radius:8px;background:rgba(255,252,244,.5)}
.opt{padding:6px 9px;border-bottom:1px solid rgba(120,90,40,.14);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.opt:hover{background:rgba(198,155,63,.12)}
.opt .sz{flex:none;font-size:10.5px;font-family:'Cinzel',serif;color:var(--ink-soft);text-transform:uppercase}
.opt .sz.major{color:var(--rust)}
.chosen{margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(244,235,213,.9);border:1px solid rgba(120,90,40,.4);
  border-radius:20px;padding:3px 6px 3px 11px;margin:0 5px 5px 0;font-size:12.5px}
.chip.virtue{border-left:4px solid var(--green)}
.chip.flaw{border-left:4px solid var(--rust)}
.chip .x{cursor:pointer;border:none;background:rgba(138,51,36,.15);color:var(--rust);border-radius:50%;width:17px;height:17px;line-height:1;font-size:12px}
.chip .det{font-size:11px;color:var(--ink-soft)}
.detail-in{border:1px dashed rgba(120,90,40,.5);border-radius:5px;font-size:11.5px;padding:1px 4px;width:110px;background:transparent}
select.detail-sel{width:auto;font-size:11.5px;padding:1px 4px;border:1px dashed rgba(120,90,40,.5);border-radius:5px;background:rgba(255,252,244,.6)}
.alloc-pool{font-size:12.5px;font-family:'Cinzel',serif;color:var(--ink-soft);margin:6px 0}
.alloc-pool.bad{color:var(--rust);font-weight:600}
.desc-pop{font-size:12px;color:var(--ink-soft);line-height:1.45;margin:4px 0 0;padding:7px 10px;background:rgba(244,235,213,.55);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.char-cell{border:1px solid rgba(120,90,40,.35);border-radius:9px;padding:10px;background:rgba(255,252,244,.5);text-align:center}
.char-cell .cn{font-family:'Cinzel',serif;font-size:12px;color:var(--rust);letter-spacing:.02em}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 2px}
.stepper button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--parch);cursor:pointer;font-size:16px;color:var(--ink)}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .val{font-size:20px;font-weight:600;min-width:26px}
.char-cell .cost{font-size:11px;color:var(--ink-soft)}
.arts-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media(max-width:720px){.arts-wrap{grid-template-columns:1fr}}
.art-row,.abil-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(120,90,40,.14);font-size:13px}
.art-row .an,.abil-row .an{flex:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.art-row input[type=number],.abil-row input[type=number]{width:64px;text-align:center}
.lvlstep{display:inline-flex;align-items:center;gap:4px;flex:none}
.lvlstep button{width:20px;height:20px;border-radius:4px;border:1px solid var(--line);background:var(--parch);cursor:pointer;font-size:13px;line-height:1;color:var(--ink);padding:0}
.lvlstep button:disabled{opacity:.3;cursor:not-allowed}
.lvlstep .lvlval{min-width:16px;text-align:center;font-weight:600;font-size:14px}
.freevf{margin-top:10px}
.freevf .fv-opt{display:inline-block;font-family:'EB Garamond',serif;font-size:12.5px;padding:5px 11px;margin:0 6px 6px 0;border:1px solid rgba(120,90,40,.45);border-radius:18px;background:rgba(255,252,244,.6);cursor:pointer}
.freevf .fv-opt.sel{border-color:var(--gold);background:rgba(198,155,63,.18);box-shadow:0 0 0 1px var(--gold) inset}
.mini{font-size:11px;color:var(--ink-soft)}
.btn{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.03em;padding:8px 16px;border-radius:7px;border:1px solid var(--line);
  background:var(--gold);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.rust{background:var(--rust)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.navbtns{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.warn{background:rgba(138,51,36,.08);border:1px solid rgba(138,51,36,.3);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--rust)}
.good{background:rgba(62,107,53,.08);border:1px solid rgba(62,107,53,.3);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;color:var(--green)}
.rules-note{position:relative;margin:12px 0;padding:12px 14px;background:rgba(245,238,220,.75);border:1px solid rgba(120,90,40,.4);border-radius:8px;font-size:13px;line-height:1.5}
.rules-note::before{content:"Rules — verbatim";position:absolute;top:-9px;left:12px;font-family:'Cinzel',serif;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);background:var(--parch);padding:0 7px;border:1px solid rgba(120,90,40,.35);border-radius:10px}
.export-area{width:100%;min-height:220px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-style:italic}
.count-pill{font-size:11px;color:var(--ink-soft);font-weight:400}
footer{text-align:center;margin-top:34px;font-size:12px;color:var(--ink-soft);opacity:.85;border-top:1px solid rgba(120,90,40,.3);padding-top:14px}
</style>

<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="index.html">Sjórseiðr</a> · Character Creator</div>
    <h1>Ars Magica Character Creator</h1>
    <p class="subtitle">Guided creation for the Sjórseiðr covenant — rules &amp; text drawn live from the armdef 0.5 corpus.</p>
  </header>
  <div id="app"><div class="loading"><span style="font-size:26px">🜛</span><br>Loading the corpus…</div></div>
  <footer>
    Corpus-driven character creation · data from <code>chargen.json</code> (armdef 0.5) · character advancement rules are RAW.
    <span id="metaVer"></span>
  </footer>
</div>
<script>
/* Sjórseiðr character creator — no-build, corpus-driven. Rules text is verbatim
   from chargen.json / chargen-spells.json (sliced from the resolved armdef corpus
   by scripts/build_chargen.py). XP is tracked per RAW creation phase. */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mdRules(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>').replace(/\n\s*\n/g,'<br><br>').replace(/\n/g,' ');}
const norm = s => (s==null?'':String(s)).toLowerCase();
const LS_KEY = 'sjorseidr_chargen_v2';

let DATA=null, SPELLS=null, C=null, step=0, FMAP=null, advisory=false;

function blankChar(){
  return {
    name:'', type:'magus', concept:'', born:1198, age:25, apparentAge:null, size:0,
    house:null, parens:'', sigil:'', templateName:'',
    realm:'', might:0, season:'',                        // realm modifier: '' | 'magic' | 'faerie'
    magic:{ qualities:[], inferiorities:[], powers:[], beingName:'', loadedPowers:[] },
    faerie:{ powers:[], wizardry:[], blood:[], cognizance:'', beingName:'', loadedPowers:[], pretenses:[], avgAge:21 },
    young:{ enabled:false, xp:[], beingName:'', apprenticeYears:15 },
    characteristics:{int:0,per:0,str:0,sta:0,pre:0,com:0,dex:0,qik:0},
    virtues:[], flaws:[],
    childhood:{ nativeLang:'', spread:[] },
    template:{ name:'', abilities:[] },
    training:{ packageName:'', duration:'', grants:[] },
    later:{ years:15, alloc:[] },
    apprentice:{ arts:{}, abilities:[] },
    laterYears:{ years:0, arts:{}, abilities:[], spellLevels:0 },
    specs:{},
    spells:[],
    personalityTraits:[], reputations:[], confidence:{score:1,points:3}, equipment:'', biography:''
  };
}

const charCost = n => (Math.abs(n)*(Math.abs(n)+1))/2 * (n<0?-1:1);
/* Points beyond ±3 are granted free by Great/Poor Characteristic (the Minor
   V/F already pays for them), so the 7-point buy pool only counts up to ±3. */
const charPoolCost = n => charCost(Math.max(-3, Math.min(3, n)));
const xpForScore = s => 5*(s*(s+1))/2;
const scoreFromXp = xp => { let s=0; while(xpForScore(s+1)<=xp) s++; return s; };
const vfPoints = vf => (vf.size==='Major'?3:vf.size==='Free'?0:1);
const isMagus = () => C.type==='magus';
const NATIVE='Native Language';

function charBudget(){ return 7 + 3*C.virtues.filter(v=>/^Improved Characteristics$/i.test(v.name)).length; }
function charCap(key){
  if(advisory) return {max:10, min:-10};
  const cname=(DATA.characteristics.find(c=>c.key===key)||{}).name;
  const greats=C.virtues.filter(v=>/Great .*Characteristic/i.test(v.name) && v.detail===cname).length;
  const poors =C.flaws.filter(f=>/Poor .*Characteristic/i.test(f.name) && f.detail===cname).length;
  return {max:3+greats, min:-(3+poors)};
}
const AGG='␟';
/* Every ability instance across all phases (not aggregated). Native Language is a
   synthetic instance driven by C.childhood.nativeLang (its "parameter" is the language). */
function abilInstances(){
  const out=[];
  if(C.childhood.nativeLang) out.push({name:NATIVE,param:C.childhood.nativeLang,spec:C.specs[NATIVE]||'',xp:75,native:true});
  [C.template.abilities, C.childhood.spread, C.training.grants, C.later.alloc, C.apprentice.abilities, C.laterYears.abilities, C.faerie.pretenses, C.young.xp]
    .forEach(arr=>(arr||[]).forEach(a=>out.push({name:a.name,param:a.param||'',spec:a.spec||'',xp:+a.xp||0})));
  return out;
}
/* Aggregate by (name,param) — the same name with a different parameter is a distinct
   ability for score/export; the same name+param across phases accumulates XP. */
function abilityTotals(){
  const map=new Map();
  for(const a of abilInstances()){ const k=a.name+AGG+a.param;
    if(map.has(k)){ const e=map.get(k); e.xp+=a.xp; if(!e.spec&&a.spec)e.spec=a.spec; }
    else map.set(k,{name:a.name,param:a.param,spec:a.spec,xp:a.xp}); }
  return [...map.values()];
}
function abilityXp(name,param=''){ let t=0; for(const a of abilInstances()) if(a.name===name&&(a.param||'')===param) t+=a.xp; return t; }
function artTotals(){ const t={}; [C.apprentice.arts, C.laterYears.arts].forEach(o=>{for(const k in o)t[k]=(t[k]||0)+(+o[k]||0);}); return t; }
const sumObj = o => Object.values(o).reduce((a,x)=>a+(+x||0),0);
const abilSum = arr => (arr||[]).reduce((a,x)=>a+(+x.xp||0),0);
function laterRate(){ return C.flaws.some(f=>/^Poor$/i.test(f.name))?10 : C.virtues.some(v=>/^Wealthy$/i.test(v.name))?20 : 15; }
const isYoung = () => !!C.young.enabled;
/* Apprentices: age-based Characteristic/Size penalty (Aging Chart), and the
   young-character ability-XP pool (15/yr after age 5; Wealthy 20, Poor 10). */
function agingFor(age){
  const chart=(DATA.apprentices&&DATA.apprentices.agingChart)||[];
  const row=chart.find(r=>age>=r.ageMin && age<=r.ageMax);
  return row?{charMod:+row.charMod||0, sizeMod:+row.sizeMod||0, label:row.age}:{charMod:0,sizeMod:0,label:''};
}
function youthXpBudget(){ return laterRate()*Math.max(0,(+C.age||0)-5); }
const isYoungApprentice = () => isYoung() && isMagus();
/* Apprenticeship XP by years completed (Apprentices Ch2): 19 XP/yr (Abilities+Arts)
   for the first 12 years, then 6 XP + 40 spell levels/yr for the final 3. */
function apprenticeshipXpFor(years){
  const y=Math.max(0,Math.min(15,+years||0));
  return { abilityArts: Math.min(y,12)*19 + Math.max(0,y-12)*6, spells: Math.max(0,y-12)*40 };
}
function apprBudget(){ return isYoungApprentice()?apprenticeshipXpFor(C.young.apprenticeYears).abilityArts:240; }
function spellBudget(){ return (isYoungApprentice()?apprenticeshipXpFor(C.young.apprenticeYears).spells:120)+(+C.laterYears.spellLevels||0); }
function artKey(name){ const a=[...DATA.arts.techniques,...DATA.arts.forms].find(x=>x.name===name); return a?a.key:null; }

/* Which parameter control (if any) a Virtue/Flaw needs. The corpus carries no
   explicit flag, so we key off the name: legacy fixed-name families (Puissant
   Ability, Great Characteristic, Deficient Technique…) plus GENERIC placeholder
   tokens in parentheses — "(Ability)", "(Form)", "(Realm)", "(Type)"… — while
   deliberately NOT matching fixed variants like "(Bardic)", "(positive)",
   "(Dove)" whose parens name a specific instance, not an open parameter. */
const VF_PLACEHOLDERS='Ability|Art|Form|Technique|Realm|Characteristic|Beings?|Land|Type|Subject|Sin|Faculty|Commodity|Terrain|Substance|Source of Damage|Role|Area|Language|Speciali\\w*';
function detailType(name){
  if(/^Deficient Technique$/i.test(name)) return 'technique';
  if(/^Deficient Form$/i.test(name)) return 'form';
  if(/\bArt\b/.test(name) && /Puissant|Affinity|Deficient|Method/i.test(name)) return 'art';
  if(/\bAbility\b/.test(name) && /Puissant|Affinity/i.test(name)) return 'ability';
  if(/\bCharacteristics?\b/.test(name) && /Great|Poor|Mythic|Tragic/i.test(name)) return 'characteristic';
  const re=new RegExp('\\((?:'+VF_PLACEHOLDERS+')\\)','gi');
  const generic=name.match(re)||[];
  if(generic.length>1) return 'text';                 // dual-parameter (e.g. "… (Realm) … (Ability)")
  if(generic.length===1){ const t=generic[0].slice(1,-1);
    if(/^Ability$/i.test(t)) return 'ability';
    if(/^Art$/i.test(t)) return 'art';
    if(/^Form$/i.test(t)) return 'form';
    if(/^Technique$/i.test(t)) return 'technique';
    if(/^Realm$/i.test(t)) return 'realm';
    if(/^Characteristic$/i.test(t)) return 'characteristic';
    return 'text';
  }
  return null;
}
function detailOptions(type){
  if(type==='ability') return DATA.abilities.map(a=>a.name);
  if(type==='technique') return DATA.arts.techniques.map(a=>a.name);
  if(type==='form') return DATA.arts.forms.map(a=>a.name);
  if(type==='art') return [...DATA.arts.techniques,...DATA.arts.forms].map(a=>a.name);
  if(type==='characteristic') return DATA.characteristics.map(c=>c.name);
  if(type==='realm') return ['Magic','Faerie','Divine','Infernal'];
  return null;
}
/* Parameterized ABILITY (arm5e `option:true`: Area Lore, Craft, Profession,
   Living/Dead Language, Organization Lore, Law, Theology…). FMAP is authoritative;
   a name-pattern fallback covers the case where the Foundry map failed to load. */
function isParamAbility(name){
  if(FMAP && FMAP.abilities && FMAP.abilities[name]) return !!FMAP.abilities[name].option;
  return /\((Area|Type|Living Language|Dead Language|Organization|Mystery Cult|Speciali)/i.test(name)
    || /:\s/.test(name)
    || /^(Area Lore|Craft|Profession|Organization Lore|Living Language|Dead Language|Civil and Canon Law|Common Law|Islamic Law|Rabbinic Law|Judaic Lore)$/i.test(name);
}

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({C,step,advisory})); }catch(e){} }
function loadSaved(){ try{ const r=JSON.parse(localStorage.getItem(LS_KEY)); if(r&&r.C&&r.C.childhood){C=migrateChar(r.C);step=r.step||0;advisory=!!r.advisory;} }catch(e){} }
/* Backward-compat: earlier builds keyed abilities by NAME in `{name:xp}` maps with a
   parallel C.specs map. The v2 model stores each phase bucket as an array of instance
   objects {name,param,spec,xp} so a parameterized ability can appear multiple times
   with distinct parameters. Convert on load; leaves already-migrated data untouched. */
function migrateChar(c){
  const specs=c.specs||{};
  const toArr=(bucket)=>{
    if(Array.isArray(bucket)) return bucket.map(a=>({name:a.name,param:a.param||'',spec:a.spec||'',xp:+a.xp||0}));
    if(bucket && typeof bucket==='object') return Object.entries(bucket).map(([name,xp])=>({name,param:'',spec:specs[name]||'',xp:+xp||0}));
    return [];
  };
  c.childhood=c.childhood||{nativeLang:'',spread:[]}; c.childhood.spread=toArr(c.childhood.spread);
  c.later=c.later||{years:15,alloc:[]}; c.later.alloc=toArr(c.later.alloc);
  c.apprentice=c.apprentice||{arts:{},abilities:[]}; c.apprentice.abilities=toArr(c.apprentice.abilities); c.apprentice.arts=c.apprentice.arts||{};
  c.laterYears=c.laterYears||{years:0,arts:{},abilities:[],spellLevels:0}; c.laterYears.abilities=toArr(c.laterYears.abilities); c.laterYears.arts=c.laterYears.arts||{};
  c.training=c.training||{packageName:'',duration:'',grants:[]}; c.training.grants=toArr(c.training.grants).map(g=>({...g,auto:true}));
  c.template=c.template||{name:'',abilities:[]}; c.template.abilities=toArr(c.template.abilities);
  if(c.size==null) c.size=0;
  if(c.realm==null) c.realm='';
  if(c.might==null) c.might=0;
  if(c.season==null) c.season='';
  c.magic=c.magic||{qualities:[],inferiorities:[],powers:[],beingName:'',loadedPowers:[]};
  ['qualities','inferiorities','powers','loadedPowers'].forEach(k=>{ if(!Array.isArray(c.magic[k])) c.magic[k]=[]; });
  if(c.magic.beingName==null) c.magic.beingName='';
  c.faerie=c.faerie||{powers:[],wizardry:[],blood:[],cognizance:'',beingName:'',loadedPowers:[],pretenses:[],avgAge:21};
  ['powers','wizardry','blood','loadedPowers','pretenses'].forEach(k=>{ if(!Array.isArray(c.faerie[k])) c.faerie[k]=[]; });
  if(c.faerie.beingName==null) c.faerie.beingName='';
  if(c.faerie.avgAge==null) c.faerie.avgAge=21;
  c.young=c.young||{enabled:false,xp:[],beingName:'',apprenticeYears:15};
  if(!Array.isArray(c.young.xp)) c.young.xp=[];
  if(c.young.beingName==null) c.young.beingName='';
  if(c.young.apprenticeYears==null) c.young.apprenticeYears=15;
  return c;
}

const STEPS=[
  {id:'type',   title:'Concept & Type',  render:renderType,   valid:vType},
  {id:'house',  title:'House',           render:renderHouse,  valid:vHouse,  magiOnly:true},
  {id:'vf',     title:'Virtues & Flaws', render:renderVF,     valid:vVF},
  {id:'chars',  title:'Characteristics', render:renderChars,  valid:vChars},
  {id:'realm',  title:'Might & Powers',  render:renderRealm,  valid:vRealm, realmOnly:true},
  {id:'youth',  title:'Youth (Age & XP)', render:renderYouth, valid:vYouth, youngOnly:true},
  {id:'child',  title:'Early Childhood', render:renderChild,  valid:vChild},
  {id:'training',title:'Training Package',render:renderTraining,valid:()=>({ok:true,msgs:[]})},
  {id:'later',  title:'Later Life (optional)', render:renderLater,  valid:vLater},
  {id:'appr',   title:'Apprenticeship',  render:renderAppr,   valid:vAppr,   magiOnly:true},
  {id:'lyears', title:'Later Years',     render:renderLYears, valid:vLYears, magiOnly:true},
  {id:'spells', title:'Spells',          render:renderSpells, valid:vSpells, magiOnly:true},
  {id:'finish', title:'Personality & Details', render:renderFinish, valid:()=>({ok:true,msgs:[]})},
  {id:'review', title:'Review & Export', render:renderReview, valid:()=>({ok:true,msgs:[]})},
];
/* Faeries buy Pretenses (in the realm step) instead of the mundane childhood/later
   ability phases, so those steps are hidden for a Faerie-realm character. */
const visibleSteps = () => STEPS.filter(s=>{
  if(s.magiOnly && !isMagus()) return false;
  if(s.id==='training' && isMagus()) return false;   // training packages are for grogs/companions only
  if(s.realmOnly && !C.realm) return false;
  if(s.youngOnly && !(isYoung() && !isMagus())) return false;          // Youth step: young non-magi only
  if(C.realm==='faerie' && ['child','training','later'].includes(s.id)) return false;
  if(isYoung() && !isMagus() && ['child','training','later'].includes(s.id)) return false;  // youth replaces these
  if(isYoung() && isMagus() && ['training','later','lyears'].includes(s.id)) return false;   // apprentice mid-training
  return true;
});

function vType(){ return {ok:!!C.name.trim(), msgs: C.name.trim()?[]:[{level:'warn',text:'Give the character a name.'}]}; }
function vHouse(){ if(!isMagus()) return {ok:true,msgs:[]};
  if(!C.house) return {ok:false,msgs:[{level:'warn',text:'A magus must choose a House.'}]};
  const h=DATA.houses.find(x=>x.name===C.house)||{};
  if((h.freeVirtueMode||'Fixed')==='Choice' && !C.virtues.some(v=>v.houseFree))
    return {ok:false,msgs:[{level:'warn',text:'Choose '+C.house+"'s free House Virtue."}]};
  return {ok:true,msgs:[{level:'ok',text:'House '+C.house+' chosen.'}]}; }
function vfBudget(){
  const flawPts=C.flaws.reduce((a,f)=>a+vfPoints(f),0);
  const virPts=C.virtues.filter(v=>v.size!=='Free').reduce((a,v)=>a+vfPoints(v),0);
  return {flawPts,virPts,
    majV:C.virtues.filter(v=>v.size==='Major').length, majF:C.flaws.filter(f=>f.size==='Major').length,
    social:[...C.virtues,...C.flaws].filter(x=>/social status/i.test(x.category||'')).length};
}
function vVF(){
  const b=vfBudget(); const m=[]; let ok=true;
  if(C.type==='grog'){
    const minF=C.flaws.filter(f=>f.size==='Minor').length, minV=C.virtues.filter(v=>v.size==='Minor').length;
    if(b.majF||b.majV){m.push({level:'warn',text:'Grogs may not take Major Virtues or Flaws.'});ok=false;}
    if(minF>3){m.push({level:'warn',text:'Grogs may take at most 3 Minor Flaws.'});ok=false;}
    if(minV>minF){m.push({level:'warn',text:"A grog's Virtues may not exceed its Flaws in number."});ok=false;}
  }else{
    if(b.flawPts>10){m.push({level:'warn',text:`Flaws total ${b.flawPts} points — the maximum is 10.`});ok=false;}
    if(b.virPts>b.flawPts){m.push({level:'warn',text:`Virtue points (${b.virPts}) may not exceed Flaw points (${b.flawPts}).`});ok=false;}
    if(b.majV>3){m.push({level:'warn',text:'At most 3 Major Virtues.'});ok=false;}
    if(b.majF>3){m.push({level:'warn',text:'At most 3 Major Flaws.'});ok=false;}
  }
  if(isYoung() && b.virPts!==b.flawPts){m.push({level:'warn',text:`Young characters: Virtue points (${b.virPts}) must equal Flaw points (${b.flawPts}).`});ok=false;}
  if(isMagus() && !isYoung() && !C.virtues.some(v=>v.name==='The Gift')){m.push({level:'warn',text:'A magus must have The Gift (added with your House).'});ok=false;}
  if(b.social!==1){m.push({level:'warn',text:`Every character needs exactly one Social Status (currently ${b.social}).`});ok=false;}
  const needParam=[...C.virtues,...C.flaws].filter(x=>detailType(x.name)&&!x.detail);
  if(needParam.length){m.push({level:'warn',text:`Specify a choice for: ${needParam.map(x=>x.name).join(', ')}.`});ok=false;}
  if(ok) m.push({level:'ok',text:'Virtue/Flaw balance is legal.'});
  return {ok,msgs:m};
}
function vChars(){
  const spent=Object.values(C.characteristics).reduce((a,n)=>a+charPoolCost(n),0);
  const bud=charBudget(); const m=[{level:spent>bud?'warn':'ok',text:`Characteristic points spent: ${spent} / ${bud}.`}];
  let ok=spent<=bud;
  for(const c of DATA.characteristics){const cap=charCap(c.key),v=C.characteristics[c.key]||0;
    if(v>cap.max||v<cap.min){m.push({level:'warn',text:`${c.name} is outside its ${cap.min}…+${cap.max} range.`});ok=false;}}
  return {ok,msgs:m};
}
function vChild(){
  const spent=abilSum(C.childhood.spread); const m=[];
  if(!C.childhood.nativeLang) m.push({level:'warn',text:'Choose a Native Language (75 XP → score 5).'});
  m.push({level:spent>45?'warn':'ok',text:`Childhood spread: ${spent} / 45 XP.`});
  return {ok:spent<=45 && !!C.childhood.nativeLang, msgs:m};
}
function vLater(){
  const pool=laterRate()*(+C.later.years||0), spent=abilSum(C.later.alloc);
  return {ok:spent<=pool, msgs:[{level:spent>pool?'warn':'ok',text:`Later-life XP: ${spent} / ${pool} (${laterRate()}×${C.later.years} yrs).`}]};
}
function vAppr(){ if(!isMagus()) return {ok:true,msgs:[]};
  const spent=sumObj(C.apprentice.arts)+abilSum(C.apprentice.abilities);
  const bud=apprBudget(); return {ok:spent<=bud, msgs:[{level:spent>bud?'warn':'ok',text:`Apprenticeship XP (Arts + Abilities): ${spent} / ${bud}.`}]}; }
function vLYears(){ if(!isMagus()) return {ok:true,msgs:[]};
  const pool=30*(+C.laterYears.years||0), spent=sumObj(C.laterYears.arts)+abilSum(C.laterYears.abilities)+(+C.laterYears.spellLevels||0);
  return {ok:spent<=pool, msgs:[{level:spent>pool?'warn':'ok',text:`Later-years points: ${spent} / ${pool} (30×${C.laterYears.years} yrs).`}]}; }
function spellCap(sp){
  const mt=abilityXp('Magic Theory'), at=artTotals();
  return scoreFromXp(at[artKey(sp.technique)]||0)+scoreFromXp(at[artKey(sp.form)]||0)+(C.characteristics.int||0)+scoreFromXp(mt)+3;
}
function vSpells(){ if(!isMagus()) return {ok:true,msgs:[]};
  const lvls=C.spells.reduce((a,s)=>a+(+s.level||0),0), budget=spellBudget();
  const over=C.spells.filter(s=>+s.level>spellCap(s)); const m=[{level:lvls>budget?'warn':'ok',text:`Spell levels: ${lvls} / ${budget}.`}];
  let ok=lvls<=budget;
  if(over.length){m.push({level:'warn',text:`${over.length} spell(s) exceed the Te+Fo+Int+Magic Theory+3 cap.`});ok=false;}
  return {ok,msgs:m};
}

function render(){
  const vis=visibleSteps(); if(step>=vis.length) step=vis.length-1;
  const cur=vis[step];
  const rail=vis.map((s,i)=>{const v=s.valid();const cls=i===step?'active':(i<step?(v.ok?'done':'invalid'):'');
    return `<li class="${cls}" data-i="${i}"><span class="st-num">${i+1}</span>${esc(s.title)}</li>`;}).join('');
  $('#app').innerHTML=`<div class="layout">
     <div class="rail"><ul class="steps">${rail}</ul>
       <div class="mode-box" title="Strict enforces RAW limits (characteristic caps); Advisory lets you exceed them — warnings become informational.">
         <span class="mode-lbl">${advisory?'✎ Advisory':'⚖ Strict RAW'}</span>
         <button class="mode-sw" id="modeSw">${advisory?'switch to Strict':'switch to Advisory'}</button>
       </div>
       <div class="budget" id="budgetBox"></div></div>
     <div><div class="panel"><div class="step-title">${esc(cur.title)}</div><div id="stepBody"></div><div id="stepMsgs"></div></div>
       <div class="navbtns"><button class="btn ghost" id="prevBtn" ${step===0?'disabled':''}>← Back</button>
         <div><button class="btn ghost" id="resetBtn">Reset</button>
         <button class="btn" id="nextBtn" ${step===vis.length-1?'disabled':''}>Next →</button></div></div></div></div>`;
  cur.render($('#stepBody')); renderMsgs(cur); renderBudget();
  $('#metaVer').textContent = DATA.meta?` · ${DATA.meta.edition} ${DATA.meta.spec_version}`:'';
  document.querySelectorAll('.steps li').forEach(li=>li.onclick=()=>{step=+li.dataset.i;save();render();});
  $('#prevBtn').onclick=()=>{if(step>0){step--;save();render();}};
  $('#nextBtn').onclick=()=>{if(step<visibleSteps().length-1){step++;save();render();}};
  $('#resetBtn').onclick=()=>{if(confirm('Discard this character and start over?')){C=blankChar();step=0;save();render();}};
  $('#modeSw').onclick=()=>{advisory=!advisory;save();render();};
  save();
}
function renderMsgs(cur){ const v=cur.valid();
  $('#stepMsgs').innerHTML=(v.msgs||[]).map(m=>`<div class="${m.level==='warn'?'warn':'good'}">${esc(m.text)}</div>`).join(''); }
function renderBudget(){
  const b=vfBudget(), cs=Object.values(C.characteristics).reduce((a,n)=>a+charPoolCost(n),0), bud=charBudget();
  const rows=[['Type',C.type]];
  if(isMagus()&&C.house) rows.push(['House',C.house]);
  rows.push(['Flaw pts',`${b.flawPts}${C.type!=='grog'?' / 10':''}`,b.flawPts>10]);
  rows.push(['Virtue pts',`${b.virPts}${C.type!=='grog'?' / '+b.flawPts:''}`,b.virPts>b.flawPts]);
  rows.push(['Social Status',b.social,b.social!==1]);
  rows.push(['Char pts',`${cs} / ${bud}`,cs>bud]);
  rows.push(['Childhood',`${abilSum(C.childhood.spread)} / 45`,abilSum(C.childhood.spread)>45]);
  if(C.training.grants.length) rows.push(['Training',`+${abilSum(C.training.grants)} XP · ${C.training.packageName}`]);
  if(C.realm==='magic'){ const mb=magicBudget(); rows.push(['Magic Might',`${+C.might||0}`]); rows.push(['Quality pts',`${mb.qpts} / ${mb.budget}`,mb.qpts>mb.budget]); }
  if(C.realm==='faerie'){ rows.push(['Faerie Might',`${+C.might||0}`]); const ps=abilSum(C.faerie.pretenses),pb=faeriePretenseBudget(); rows.push(['Pretense pts',`${ps} / ${pb}`,ps>pb]); }
  if(isYoung()){ const a=agingFor(+C.age||0); rows.push(['Age',`${+C.age||0} (${a.label})`]); rows.push(['Aging',`Ch ${a.charMod}, Sz ${a.sizeMod}`]);
    if(isMagus()){ rows.push(['Appr. years',`${C.young.apprenticeYears} / 15`]); }
    else { const s=abilSum(C.young.xp), yb=youthXpBudget(); rows.push(['Youth XP',`${s} / ${yb}`,s>yb]); } }
  rows.push(['Later life',`${abilSum(C.later.alloc)} / ${laterRate()*(+C.later.years||0)}`,abilSum(C.later.alloc)>laterRate()*(+C.later.years||0)]);
  if(isMagus()){
    const _ab=apprBudget(); rows.push(['Apprentice',`${sumObj(C.apprentice.arts)+abilSum(C.apprentice.abilities)} / ${_ab}`,(sumObj(C.apprentice.arts)+abilSum(C.apprentice.abilities))>_ab]);
    const lvls=C.spells.reduce((a,s)=>a+(+s.level||0),0), sb=spellBudget();
    rows.push(['Spell lvls',`${lvls} / ${sb}`,lvls>sb]);
  }
  $('#budgetBox').innerHTML=`<h4>Budget</h4>`+rows.map(r=>`<div class="brow ${r[2]?'bad':''}"><span>${esc(r[0])}</span><span>${esc(r[1])}</span></div>`).join('');
}

/* --- Full character templates (optional; loads a complete build) ----------- */
let tplFilter={q:''};
function vfDefLookup(side,name){ return (side==='virtue'?DATA.virtues:DATA.flaws).find(x=>x.name===name); }
function tplVF(list, side){
  return (list||[]).map(v=>{ const def=vfDefLookup(side,v.name)||{};
    return {name:v.name, size:v.size||def.size||'Minor', category:def.category||'General', detail:v.detail||null, auto:false}; });
}
function clearTemplate(){ C.templateName=''; C.template={name:'',abilities:[]}; }
/* Load a whole character from a book template into C, then the caller jumps to
   Personality. Template Abilities carry SCORE → convert to XP. Native Language is
   left to the Early-Childhood step (its fixed 75 XP is handled there). */
function loadTemplate(name){
  const t=(DATA.characterTemplates||[]).find(x=>x.name===name); if(!t) return;
  C.type=t.type;
  const ch={int:0,per:0,str:0,sta:0,pre:0,com:0,dex:0,qik:0};
  for(const k in (t.characteristics||{})) ch[k]=t.characteristics[k];
  C.characteristics=ch;
  if(t.age!=null)C.age=t.age; if(t.apparentAge!=null)C.apparentAge=t.apparentAge; if(t.size!=null)C.size=t.size;
  C.virtues=tplVF(t.virtues,'virtue'); C.flaws=tplVF(t.flaws,'flaw');
  if(t.freeVirtue){ const fv=t.freeVirtue, def=vfDefLookup('virtue',fv.name)||{};
    C.virtues.push({name:fv.name,size:'Free',category:def.category||'Special',detail:fv.detail||null,auto:true,free:true}); }
  // fresh mechanical build: reset the phase buckets, load template abilities into the dedicated bucket
  C.childhood={nativeLang:C.childhood.nativeLang||'',spread:[]};
  C.later={years:C.later.years||15,alloc:[]}; C.apprentice={arts:{},abilities:[]};
  C.laterYears={years:0,arts:{},abilities:[],spellLevels:0}; C.training={packageName:'',duration:'',grants:[]};
  C.template={name:t.name, abilities:(t.abilities||[]).filter(a=>!/^Native Language$/i.test(a.name))
    .map(a=>({name:a.name,param:'',spec:a.specialty||'',xp:xpForScore(a.score||0)}))};
  C.templateName=t.name;
  C.personalityTraits=(t.personalityTraits||[]).map(p=>({name:p.name,score:+p.score||0}));
  C.equipment=(t.equipment||[]).join(', ');
  if(t.type==='magus'){
    if(t.house)C.house=t.house; if(t.sigil)C.sigil=t.sigil;
    if(t.confidenceScore!=null)C.confidence={score:t.confidenceScore,points:t.confidencePoints||0};
    for(const an in (t.arts||{})){ const k=artKey(an); if(k)C.apprentice.arts[k]=xpForScore(t.arts[an]); }
    C.spells=(t.spells||[]).map(s=>({name:`${s.technique} ${s.form} ${s.level}`.trim(),technique:s.technique,form:s.form,level:+s.level||0,range:'',duration:'',target:'',ritual:false,description:''}));
  } else { C.house=null; C.spells=[]; }
  save();
}

/* Load a defined being (Creature statblock) into C — the realm loader. Powers are
   the being's own (kept verbatim in faerie.loadedPowers); abilities → the loaded bucket. */
let beingFilter='';
function loadCreature(name){
  const c=(DATA.creatures||[]).find(x=>x.name===name); if(!c) return;
  const ch={int:0,per:0,str:0,sta:0,pre:0,com:0,dex:0,qik:0};
  for(const k in (c.characteristics||{})) ch[k]=c.characteristics[k];
  C.characteristics=ch;
  if(c.might!=null)C.might=c.might; if(c.size!=null)C.size=c.size;
  C.virtues=[]; C.flaws=[];
  (c.virtuesFlaws||[]).forEach(nm=>{ const base=String(nm).replace(/\s*\([^)]*\)\s*$/,'').trim();
    const detail=(String(nm).match(/\(([^)]*)\)\s*$/)||[])[1]||null;
    const vd=DATA.virtues.find(v=>v.name===base), fd=DATA.flaws.find(f=>f.name===base);
    if(vd) C.virtues.push({name:vd.name,size:vd.size||'Minor',category:vd.category||'General',detail,auto:false});
    else if(fd) C.flaws.push({name:fd.name,size:fd.size||'Minor',category:fd.category||'General',detail,auto:false});
    else C.virtues.push({name:String(nm),size:'Free',category:'Special',detail:null,auto:false}); });
  // A loaded faerie's abilities ARE its Pretenses — put them in the Pretense
  // bucket so they register in the pool and are editable in the Pretense allocator.
  C.template={name:'',abilities:[]};
  C.faerie.pretenses=(c.abilities||[]).filter(a=>!/^Native Language$/i.test(a.name))
    .map(a=>({name:a.name,param:'',spec:a.specialty||'',xp:xpForScore(a.score||0)}));
  C.childhood={nativeLang:C.childhood.nativeLang||'',spread:[]}; C.later={years:C.later.years||15,alloc:[]};
  C.apprentice={arts:{},abilities:[]}; C.laterYears={years:0,arts:{},abilities:[],spellLevels:0}; C.training={packageName:'',duration:'',grants:[]};
  C.personalityTraits=(c.personalityTraits||[]).map(t=>({name:t.name,score:+t.score||0}));
  if(c.description||c.appearance) C.biography=[c.appearance,c.description].filter(Boolean).join('\n\n');
  C.faerie.beingName=c.name;
  C.faerie.loadedPowers=(c.powers||[]).map(pw=>({name:pw.name,cost:pw.cost||'',initiative:pw.initiative||'',form:pw.form||'',text:pw.text||''}));
  save();
}
function loadMagicBeing(name){

  C.template={name:c.name, abilities:(c.abilities||[]).filter(a=>!/^Native Language$/i.test(a.name))
    .map(a=>({name:a.name,param:'',spec:a.specialty||'',xp:xpForScore(a.score||0)}))};
  C.childhood={nativeLang:C.childhood.nativeLang||'',spread:[]}; C.later={years:C.later.years||15,alloc:[]};
  C.apprentice={arts:{},abilities:[]}; C.laterYears={years:0,arts:{},abilities:[],spellLevels:0}; C.training={packageName:'',duration:'',grants:[]};
  C.personalityTraits=(c.personalityTraits||[]).map(t=>({name:t.name,score:+t.score||0}));

function renderType(el){

/* Mode-aware free-Virtue UI. Fixed → shown (auto-added); Choice → pick one;
   Open → a qualifying Minor Virtue the player adds; Package → an example tradition. */
function freeVirtueUI(h){
  const mode=h.freeVirtueMode||'Fixed', opts=h.freeVirtueOptions||[];
  const lbl=o=>esc(o.name)+(o.detail?` (${esc(o.detail)})`:'');
  if(mode==='Choice'){
    const chosen=C.virtues.find(v=>v.houseFree);
    return `<div class="freevf"><p class="mini">This House grants a <strong>choice</strong> of free Virtue — pick one:</p>
      ${opts.map((o,i)=>{const sel=chosen&&chosen.name===o.name&&(chosen.detail||null)===(o.detail||null);
        return `<span class="fv-opt ${sel?'sel':''}" data-fvpick="${i}">${lbl(o)}</span>`;}).join('')}</div>`;
  }
  if(mode==='Open')
    return `<div class="freevf"><p class="mini"><strong>Free House Virtue:</strong> ${esc(h.benefit||'')}<br>Choose a qualifying Minor Virtue and add it in the <em>Virtues &amp; Flaws</em> step.</p></div>`;
  if(mode==='Package')
    return `<div class="freevf"><p class="mini">This House grants a <strong>tradition package</strong> that varies by tradition (a free Minor Hermetic Virtue, a free Major non-Hermetic Virtue, and a compulsory Major Hermetic Flaw). Example: ${opts.map(lbl).join(', ')}. Add your tradition's Virtues &amp; Flaws in the <em>Virtues &amp; Flaws</em> step.</p></div>`;
  return `<p class="mini">Free House Virtue: <strong>${opts.length?lbl(opts[0]):esc(freeVirtueLabel(h.freeVirtue))}</strong></p>`;
}
function freeVirtueLabel(fv){ if(!fv) return '—'; return String(fv).replace(/[\[\]^"]/g,'').replace(/\(/,' (').trim(); }
/* The House free Virtue is marked `houseFree` so it can be swapped when a Choice
   is (re)made without disturbing The Gift / Hermetic Magus (also auto). */
function addHouseFree(o){
  if(C.virtues.some(v=>v.name===o.name && (v.detail||null)===(o.detail||null))) return;
  const def=DATA.virtues.find(v=>v.name===o.name)||{name:o.name,size:'Free',category:'Special'};
  C.virtues.push({name:def.name,size:'Free',category:def.category||'Special',detail:o.detail||null,auto:true,free:true,houseFree:true});
}
function setHouse(name){
  const h=DATA.houses.find(x=>x.name===name); if(!h) return;
  C.virtues=C.virtues.filter(v=>!v.auto);
  C.house=name;
  ensureVirtue({name:'The Gift',auto:true});
  ensureVirtue({name:'Hermetic Magus',auto:true});
  const mode=h.freeVirtueMode||'Fixed', opts=h.freeVirtueOptions||[];
  if(mode==='Fixed' && opts[0]) addHouseFree(opts[0]);
  // Choice/Open/Package: the player resolves the free Virtue (no silent first-pick).
  save();
}
function chooseFreeVirtue(idx){
  const h=DATA.houses.find(x=>x.name===C.house); if(!h) return;
  C.virtues=C.virtues.filter(v=>!v.houseFree);
  const o=(h.freeVirtueOptions||[])[idx];
  if(o) addHouseFree(o);
  save(); render();
}
function ensureVirtue(o){
  if(C.virtues.some(v=>v.name===o.name)) return;
  const def=DATA.virtues.find(v=>v.name===o.name)||{name:o.name,size:o.free?'Free':'Minor',category:'Special'};
  C.virtues.push({name:def.name,size:o.free?'Free':def.size,category:def.category,detail:o.detail||null,auto:!!o.auto});
}

function vfCol(side){
  const src=side==='virtue'?DATA.virtues:DATA.flaws;

  return `<div class="pick-col" data-side="${side}"><h4>Add ${side==='virtue'?'Virtue':'Flaw'} <span class="count-pill">${src.length}</span></h4>
    <div class="searchbar"><input type="text" class="vfq" data-side="${side}" placeholder="search…" value="${esc(f.q)}">
      <select class="vfcat" data-side="${side}"><option value="">all categories</option>${cats.map(c=>`<option ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="list">${items.map(x=>`<div class="opt" data-add="${side}" data-name="${esc(x.name)}"><span>${esc(x.name)}</span><span class="sz ${x.size==='Major'?'major':''}">${esc(x.size||'')}</span></div>`).join('')||'<div class="opt mini">no matches</div>'}</div></div>`;
}
function chipList(side){
  const arr=side==='virtue'?C.virtues:C.flaws;
  if(!arr.length) return '<span class="mini">— none —</span>';
  return arr.map((x,i)=>{
    const dt=detailType(x.name); let detailUI='';
    if(dt==='text') detailUI=`<input class="detail-in" data-detail="${side}:${i}" placeholder="specify…" value="${esc(x.detail||'')}">`;
    else if(dt){const opts=detailOptions(dt);detailUI=`<select class="detail-sel" data-detail="${side}:${i}"><option value="">— choose —</option>${opts.map(o=>`<option ${x.detail===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;}
    else if(x.detail) detailUI=`<span class="det">(${esc(x.detail)})</span>`;
    return `<span class="chip ${side}"><span data-desc="${side}:${i}" style="cursor:help">${esc(x.name)}</span>${x.size==='Free'?' <span class="det">(free)</span>':''}
      ${detailUI}${x.auto?'':`<button class="x" data-rm="${side}:${i}">×</button>`}</span>`;
  }).join('');
}
function wireVF(el){
  el.querySelectorAll('.vfq').forEach(inp=>inp.oninput=()=>{vfFilter[inp.dataset.side].q=inp.value;refreshVFcol(inp.dataset.side);});
  el.querySelectorAll('.vfcat').forEach(sel=>sel.onchange=()=>{vfFilter[sel.dataset.side].cat=sel.value;refreshVFcol(sel.dataset.side);});
  el.querySelectorAll('[data-add]').forEach(o=>o.onclick=()=>addVF(o.dataset.add,o.dataset.name));
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const[s,i]=b.dataset.rm.split(':');(s==='virtue'?C.virtues:C.flaws).splice(+i,1);save();render();});
  el.querySelectorAll('[data-detail]').forEach(inp=>{const h=()=>{const[s,i]=inp.dataset.detail.split(':');(s==='virtue'?C.virtues:C.flaws)[+i].detail=inp.value||null;save();renderMsgs(STEPS.find(x=>x.id==='vf'));};inp.oninput=h;inp.onchange=h;});
  el.querySelectorAll('[data-desc]').forEach(sp=>sp.onclick=()=>{const[s,i]=sp.dataset.desc.split(':');showVFDesc(s,+i);});
}
function refreshVFcol(side){const col=document.querySelector(`.pick-col[data-side="${side}"]`);if(!col)return;
  const tmp=document.createElement('div');tmp.innerHTML=vfCol(side);col.replaceWith(tmp.firstElementChild);wireVF($('#stepBody'));}
function addVF(side,name){
  const src=side==='virtue'?DATA.virtues:DATA.flaws, def=src.find(x=>x.name===name); if(!def) return;
  const arr=side==='virtue'?C.virtues:C.flaws;
  const sz=def.size==='Free'?'Free':(def.size&&String(def.size).startsWith('[')?'Minor':def.size);
  arr.push({name:def.name,size:sz,category:def.category,detail:null});
  save(); render();
}
function showVFDesc(side,i){const x=(side==='virtue'?C.virtues:C.flaws)[i];
  let def=(side==='virtue'?DATA.virtues:DATA.flaws).find(d=>d.name===x.name);
  // Some House free "Virtues" are corpus Abilities (e.g. Faerie Magic) — fall back
  // to the Abilities table so their description resolves instead of showing "—".
  if(!def || !def.text){ const ab=(DATA.abilities||[]).find(a=>a.name===x.name); if(ab && ab.text) def={...(def||{}),text:ab.text}; }
  def=def||{};
  $('#vfDesc').innerHTML=`<div class="rules-note"><strong>${esc(x.name)}</strong> <span class="mini">(${esc(x.size)}, ${esc(x.category||'')})</span><br>${mdRules(def.text||'—')}</div>`;}

/* --- Realm modifier: Might + Powers (Magic / Faerie) ----------------------- */
let realmFilter={qualities:'',inferiorities:'',powers:'',fpowers:'',wizardry:'',blood:''};
const magPts = m => m==='Major'?3:m==='Free'?0:1;
const toolkitMag = (list,name) => { const x=(list||[]).find(y=>y.name===name); return x?x.magnitude:null; };
function magicBudget(){
  const T=DATA.realmToolkits.magic;
  const q=C.magic.qualities.reduce((a,c)=>a+magPts(toolkitMag(T.qualities,c.name))*(c.count||1),0);
  const i=C.magic.inferiorities.reduce((a,c)=>a+magPts(toolkitMag(T.inferiorities,c.name))*(c.count||1),0);
  return {qpts:q, ipts:i, budget:(+C.might||0)+i};
}
function faeriePretenseBudget(){
  const fc=DATA.realmToolkits.faerie.creation||{};
  const age=+C.faerie.avgAge||fc.defaultMagusAge||21;
  return (fc.pretensePointsPerYear||15)*(age-(fc.pretenseReferenceAge||5))+(fc.pretensePointsBase||120);
}
function vRealm(){
  if(!C.realm) return {ok:true,msgs:[]};
  if(C.realm==='faerie'){
    const m=[]; const sp=abilSum(C.faerie.pretenses), bud=faeriePretenseBudget();
    if(!C.might) m.push({level:'warn',text:'Set a Faerie Might score.'});
    m.push({level:sp>bud?'warn':'ok',text:`Pretense points: ${sp} / ${bud} (Pretenses replace Abilities).`});
    return {ok:!!C.might && sp<=bud, msgs:m};
  }
  const b=magicBudget(); const m=[];
  if(!C.might) m.push({level:'warn',text:'Set a Magic Might score.'});
  m.push({level:b.qpts>b.budget?'warn':'ok',text:`Magic Quality points: ${b.qpts} / ${b.budget} (Might ${+C.might||0} + ${b.ipts} from Inferiorities).`});
  return {ok:(!!C.might)&&b.qpts<=b.budget, msgs:m};
}
function realmBadge(x,badgeKey){ if(!badgeKey) return ''; const v=x[badgeKey]; if(v==null||v==='') return '';
  return badgeKey==='mightCostValue'?`${v} pt`:String(v); }
function realmListItems(key,src,badgeKey){
  const q=realmFilter[key]||'';
  const items=src.filter(x=>!q||norm(x.name).includes(norm(q))).slice(0,300);
  return items.map(x=>{const bd=realmBadge(x,badgeKey);
    return `<div class="opt" data-radd="${key}" data-name="${esc(x.name)}"><span>${esc(x.name)}</span>${bd?`<span class="sz ${bd==='Major'?'major':''}">${esc(bd)}</span>`:''}</div>`;}).join('')||'<div class="opt mini">no matches</div>';
}
function realmPickerHtml(key,label,src,chosen,badgeKey){

function loadYoungCharacter(name){
  const c=((DATA.apprentices&&DATA.apprentices.youngCharacters)||[]).find(x=>x.name===name); if(!c) return;
  C.young.enabled=true;
  if(/^Grog/i.test(c.name)) C.type='grog';
  else if(/^Companion/i.test(c.name)) C.type='companion';
  else { C.type='magus'; const hm=c.name.match(/House (\w+)/); C.house=hm?('House '+hm[1]):(c.house||null); }
  if(c.age!=null)C.age=c.age; if(c.size!=null)C.size=c.size;
  const ch={int:0,per:0,str:0,sta:0,pre:0,com:0,dex:0,qik:0};
  for(const k in (c.characteristics||{})) ch[k]=c.characteristics[k];
  C.characteristics=ch;
  C.virtues=[]; C.flaws=[];
  (c.virtuesFlaws||[]).forEach(vf=>{ const base=String(vf.name), detail=vf.param||null;
    const cv=(DATA.apprentices.childVirtues||[]).find(v=>v.name===base), cf=(DATA.apprentices.childFlaws||[]).find(f=>f.name===base);
    const vd=DATA.virtues.find(v=>v.name===base), fd=DATA.flaws.find(f=>f.name===base);
    if(cv) C.virtues.push({name:cv.name,size:cv.size||'Minor',category:cv.category||'Child',detail,child:true});
    else if(cf) C.flaws.push({name:cf.name,size:cf.size||'Minor',category:cf.category||'Child',detail,child:true});
    else if(vd) C.virtues.push({name:vd.name,size:vd.size||'Minor',category:vd.category||'General',detail,auto:false});
    else if(fd) C.flaws.push({name:fd.name,size:fd.size||'Minor',category:fd.category||'General',detail,auto:false});
    else C.virtues.push({name:base,size:'Free',category:'Special',detail,auto:false}); });
  const abilInsts=(c.abilities||[]).filter(a=>!/^Native Language$/i.test(a.name)).map(a=>({name:a.name,param:'',spec:a.specialty||'',xp:xpForScore(a.score||0)}));
  C.childhood={nativeLang:C.childhood.nativeLang||'',spread:[]}; C.later={years:15,alloc:[]}; C.template={name:'',abilities:[]}; C.training={packageName:'',duration:'',grants:[]};
  C.laterYears={years:0,arts:{},abilities:[],spellLevels:0}; C.spells=[];
  if(C.type==='magus'){ C.apprentice={arts:{},abilities:abilInsts}; C.young.xp=[];
    const loadedXP=abilInsts.reduce((a,x)=>a+(+x.xp||0),0); let yrs=0; while(yrs<15 && apprenticeshipXpFor(yrs).abilityArts<loadedXP) yrs++; C.young.apprenticeYears=yrs; }
  else { C.apprentice={arts:{},abilities:[]}; C.young.xp=abilInsts; }
  C.personalityTraits=(c.personalityTraits||[]).map(t=>({name:t.name,score:+t.score||0}));
  if(c.description||c.appearance) C.biography=[c.appearance,c.description].filter(Boolean).join('\n\n');
  C.equipment=c.equipment||C.equipment||'';
  C.young.beingName=c.name;
  save();
}

function abilCats(a){ let t=a&&a.abilityType; if(!t) return [];

/* One allocated ability instance = one editable row. Parameterized abilities
   (arm5e `option:true`, e.g. Area Lore / Craft / Profession) expose a parameter

function abilAllocRow(arrId, a, i){

function abilAllocRows(arr, arrId){

/* Wire the editable rows of ONE allocation bucket (arrId), scoped so several
   buckets can share a step. Typing XP updates in place (keeps focus); the ±
   level steppers snap XP to that level's exact total (score 2 → 15 XP) — a level
   bump and an XP edit stay in sync — then re-render. */
function wireAllocRows(el, arr, arrId, rerender){
  const inst=ref=>arr[+ref.split(':')[1]], done=rerender||function(){};
  const bump=(ref,d)=>{const a=inst(ref); a.xp=xpForScore(Math.max(0,scoreFromXp(a.xp)+d)); save(); renderBudget(); done();};
  el.querySelectorAll(`[data-alx^="${arrId}:"]`).forEach(inp=>inp.oninput=()=>{const a=inst(inp.dataset.alx); a.xp=+inp.value||0;
    const lv=inp.closest('.abil-row').querySelector('.lvlval'); if(lv) lv.textContent=scoreFromXp(a.xp);
    save();renderBudget();updatePoolLine();renderMsgs(visibleSteps()[step]);});
  el.querySelectorAll(`[data-alinc^="${arrId}:"]`).forEach(b=>b.onclick=()=>bump(b.dataset.alinc,1));
  el.querySelectorAll(`[data-aldec^="${arrId}:"]`).forEach(b=>b.onclick=()=>bump(b.dataset.aldec,-1));
  el.querySelectorAll(`[data-alparam^="${arrId}:"]`).forEach(inp=>inp.oninput=()=>{inst(inp.dataset.alparam).param=inp.value;save();renderBudget();renderMsgs(visibleSteps()[step]);});
  el.querySelectorAll(`[data-alspec^="${arrId}:"]`).forEach(inp=>inp.oninput=()=>{inst(inp.dataset.alspec).spec=inp.value;save();});
  el.querySelectorAll(`[data-alrm^="${arrId}:"]`).forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.alrm.split(':')[1],1);save();done();});
}

let trainFilter={q:'',cat:''};
/* A grant label may name a parameterized ability inline, e.g. "Craft: Type A" or
   "Profession: Animal Trainer" -> split into base ability + parameter. "Native
   Language" is the fixed 75-XP handled by the Early-Childhood step, so it's skipped. */
function resolveGrant(label){
  if(/^Native Language$/i.test(label)) return null;
  const m=label.match(/^(.*?):\s+(.*)$/);
  if(m){ const base=m[1].trim(), param=m[2].trim();
    if(DATA.abilities.some(a=>a.name===base)||isParamAbility(base)) return {name:base,param,spec:'',xp:0,auto:true}; }
  return {name:label,param:'',spec:'',xp:0,auto:true};
}
function applyTraining(pkgName, durLabel){
  const pkg=(DATA.trainingPackages||[]).find(p=>p.name===pkgName); if(!pkg) return;
  const dur=pkg.durations.find(d=>d.label===durLabel)||pkg.durations[0]; if(!dur) return;
  const grants=[];
  dur.grants.forEach(g=>{ const r=resolveGrant(g.ability); if(!r) return; r.xp=+g.xp||0; grants.push(r); });
  C.training={packageName:pkg.name, duration:dur.label, grants}; save();
}

/* ArM5 level scaling: each magnitude adds +1 below level 5, +5 thereafter. */
function raiseLevel(base,mags){ let l=+base||0; for(let i=0;i<mags;i++){ l = l<5 ? l+1 : l+5; } return l; }
function pmag(kind,label){ const r=(DATA.spellParams[kind]||[]).find(x=>x.label===label); return r?r.magnitude:0; }
function designMags(){ return pmag('ranges',design.range)+pmag('durations',design.duration)+pmag('targets',design.target)+(+design.size||0)+(+design.complexity||0); }

  const base=g? (g.level==='General'?(+design.base||1):g.level):(+design.base||1); return raiseLevel(base, designMags()); }

function updateDesignLevel(){ const el=$('#stepBody'); const line=el.querySelector('.alloc-pool'); const btn=$('#dAdd');
  const lvl=designLevel(); if(line){const lvls=C.spells.reduce((a,s)=>a+(+s.level||0),0),budget=spellBudget();

function addDesignedSpell(){

/* ---- Foundry (arm5e) Actor export ---------------------------------------
   Translates the character into an arm5e Foundry VTT Actor, using foundry-map.json
   (arm5e system codes: ability keys, House codes, spell R/D/T short codes). */
async function ensureFmap(){ if(FMAP) return;
  FMAP = await (await fetch('./foundry-map.json',{cache:'no-store'})).json(); }
let _fidCounter = 0;
function fid(){ // 16-char Foundry-style id (deterministic per build, unique)
  const cs='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let base=(C.name||'x')+'|'+(_fidCounter++)+'|'; let h=0, out='';
  for(let i=0;i<base.length;i++){ h=(h*31+base.charCodeAt(i))>>>0; }
  for(let i=0;i<16;i++){ h=(h*1103515245+12345)>>>0; out+=cs[h%62]; }
  return out;
}
const kebab = s => (s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
function abilDesc(name){ const a=DATA.abilities.find(x=>x.name===name); return a&&a.text?`<p>${esc(a.text)}</p>`:''; }
function itemStats(){ return {compendiumSource:null,duplicateSource:null,coreVersion:"13.351",systemId:"arm5e",systemVersion:"3.0.1.14",createdTime:null,modifiedTime:null,lastModifiedBy:null,exportSource:null}; }
function foundryAbilityItem(name, spec, xp, param){
  const fm=FMAP.abilities[name]||{};       // key stays the base arm5e key; the parameter goes in `option`
  const opt=param?kebab(param):"";
  return { name:name+(param?` (${param})`:''), type:"ability", img:"", effects:[], flags:{}, folder:null, sort:0, ownership:{default:0}, _id:fid(), _stats:itemStats(),
    system:{ description:abilDesc(name), source:"ArM5Def", page:0, defaultChaAb:fm.defaultChaAb||"int",
      speciality:spec||"", xp:+xp||0, key:fm.key||"", option:opt, realm:"mundane", indexKey:kebab(name)+(opt?'_'+opt:''),
      optionLinked:false, accelerated:false, credits:"" } };
}
function foundryVFItem(v, isFlaw){
  const src=isFlaw?DATA.flaws:DATA.virtues; const def=src.find(x=>x.name===v.name)||{};
  return { name:v.name+(v.detail?` (${v.detail})`:''), type:isFlaw?"flaw":"virtue", img:"", effects:[], flags:{}, folder:null, sort:0, ownership:{default:0}, _id:fid(), _stats:itemStats(),
    system:{ description:def.text?`<p>${esc(def.text)}</p>`:"", source:"ArM5Def", page:0,
      type:FMAP.vfType[def.category]||"general", impact:{value:FMAP.vfImpact[v.size]||"minor"},
      indexKey:kebab(v.name), hidden:false, tainted:false, credits:"" } };
}
function foundrySpellItem(s){
  const te=FMAP.techniques[s.technique]||"", fo=FMAP.forms[s.form]||"";
  const treq={cr:false,in:false,mu:false,pe:false,re:false}, freq={an:false,aq:false,au:false,co:false,he:false,ig:false,im:false,me:false,te:false,vi:false};
  return { name:s.name, type:"spell", img:te&&fo?`systems/arm5e/assets/magic/${fo}.png`:"", effects:[], flags:{}, folder:null, sort:0, ownership:{default:0}, _id:fid(), _stats:itemStats(),
    system:{ technique:{value:te}, form:{value:fo}, baseLevel:+s.level||0, level:+s.level||0,
      range:{value:FMAP.ranges[s.range]||"personal"}, duration:{value:FMAP.durations[s.duration]||"moment"},
      target:{value:FMAP.targets[s.target]||"ind"}, ritual:!!s.ritual, general:false, complexity:0,
      "technique-req":treq, "form-req":freq, description:s.description?esc(s.description):"", source:"ArM5Def", page:0,
      indexKey:kebab(s.name), xp:0, bonus:0, applyFocus:false, masteryAbilities:"", credits:"" } };
}
function buildFoundryActor(){
  const items=[];
  // abilities (native language + all phase instances, aggregated by name+parameter)
  for(const t of abilityTotals()){
    const spec = t.name===NATIVE ? C.childhood.nativeLang : (t.spec||"");
    items.push(foundryAbilityItem(t.name, spec, t.xp, t.param));
  }
  C.virtues.forEach(v=>items.push(foundryVFItem(v,false)));
  C.flaws.forEach(f=>items.push(foundryVFItem(f,true)));
  C.spells.forEach(s=>items.push(foundrySpellItem(s)));
  const personalities={};
  (C.personalityTraits||[]).filter(t=>t.name).forEach((t,i)=>{ personalities[i]={name:t.name,score:+t.score||0};
    items.push({ name:t.name, type:"personalityTrait", img:"", effects:[], flags:{}, folder:null, sort:0, ownership:{default:0}, _id:fid(), _stats:itemStats(),
      system:{ xp:xpForScore(Math.abs(+t.score||0)), description:"", source:"custom", page:0, credits:"" } }); });
  const chars={}; for(const c of DATA.characteristics){ chars[c.key]={value:C.characteristics[c.key]||0, aging:0}; }
  const arts={techniques:{},forms:{}};
  DATA.arts.techniques.forEach(a=>arts.techniques[a.key]={label:a.name, xp:artTotals()[a.key]||0});
  DATA.arts.forms.forEach(a=>arts.forms[a.key]={label:a.name, xp:artTotals()[a.key]||0});
  const houseCode = isMagus() ? (FMAP.houses[C.house]||"gen") : "n-a";
  return {
    name:C.name||"Unnamed", type:"player",
    img:"", effects:[], folder:null, flags:{arm5e:{}}, ownership:{default:0},
    _stats:{...itemStats(), exportSource:{worldId:"sjorseidr",systemId:"arm5e",systemVersion:"3.0.1.14"}},
    prototypeToken:{ name:C.name||"Unnamed", displayName:0, actorLink:false, width:1, height:1, disposition:0, flags:{} },
    system:{
      charType:{value:C.type, label:"Char. Type"},
      house:{value:houseCode, label:"House"},
      parens:{label:"Parens", dtype:"String", value:C.parens||""},
      sigil:{label:"Wizard's Sigil", dtype:"String", value:C.sigil||""},
      age:{value:C.age}, apparent:{dtype:"Number", value:C.apparentAge||C.age},
      description:{ born:{value:C.born}, apprentice:{value:0}, birthname:{value:""}, birthplace:{value:""} },
      con:{label:"Confidence ", score:C.confidence.score, points:C.confidence.points},
      covenant:{value:"Sjórseiðr", actorId:null},
      biography:C.biography?`<p>${esc(C.biography)}</p>`:"", secrets:"", source:"ArM5Def",
      characteristics:chars, arts, personalities,
      states:{creationMode:true, pendingCrisis:false, confidencePrompt:false, pendingDamage:false},
      creationMode:true,
      decrepitude:{points:0, effects:"", finalScore:0}, warping:{points:0, effects:"", finalScore:0},
      realms:{magic:{aligned:false,susceptible:false},faeric:{aligned:false,susceptible:false},divine:{aligned:false,susceptible:false},infernal:{aligned:false,susceptible:false}},
      features:{magicSystem:false, powers:false},
      magicSystem:{name:"",adjective:"",practitioner:"",effects:"",laboratory:"",realm:"mundane"}
    },
    items
  };
}
/* ---- titterpig-dsl .actor export ----------------------------------------
   Emits the character as a structured DEF inside an EXTENSION document, in the
   same shape the armdef corpus uses for named characters (Characteristics DEF,
   Virtues/Flaws LIST with parameters, ABILITIES/PERSONALITY_TRAITS blocks, and —
   for magi — Hermetic Arts + SPELLS_KNOWN). This is the export path for realm
   (Magic/Faerie) characters that have no Foundry mapping, and is offered for all. */
function dslHash(seed){
  const cs='abcdefghijklmnopqrstuvwxyz0123456789';
  let h=0; for(let i=0;i<seed.length;i++) h=(h*31+seed.charCodeAt(i))>>>0;
  let out=''; for(let i=0;i<24;i++){ h=(h*1103515245+12345)>>>0; out+=cs[h%36]; }
  return 't'+out;
}
function buildActorFile(){
  const baseType = isMagus()?'Magus':(C.type==='companion'?'Companion':'Grog');
  const name = (C.name||'Unnamed Character').replace(/"/g,'');
  const hash = dslHash(name+'|'+baseType);
  const q = s => '"'+String(s==null?'':s).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/\r?\n/g,'\\n')+'"';
  const T = n => '    '.repeat(n);
  const vfList = arr => '['+arr.map(v=>'^"'+v.name+'"'+(v.detail?`("${String(v.detail).replace(/"/g,'')}")`:'')).join(', ')+']';
  const L=[];
  L.push(`EXTENSION "Sjorseidr_Chargen_${hash.slice(0,12)}" {`);
  L.push(`${T(1)}NAME "Sjórseiðr character: ${name}"`);
  L.push(`${T(1)}VERSION "0.5.0"`);
  L.push(`${T(1)}SPEC_VERSION "0.5"`);
  L.push(`${T(1)}DEPENDS_ON "ARMDef_Core_Base"`);
  L.push('');
  L.push(`${T(1)}#${hash} ^"${name}" DEF {`);
  L.push(`${T(2)}EXTENDS ^"${baseType}"`);
  L.push(`${T(2)}PROPERTIES {`);
  L.push(`${T(3)}^"Characteristics" DEF {`);
  DATA.characteristics.forEach(c=>L.push(`${T(4)}^"${c.name}" INTEGER ${C.characteristics[c.key]||0}`));
  L.push(`${T(3)}}`);
  L.push(`${T(3)}^"Size" INTEGER ${+C.size||0}`);
  L.push(`${T(3)}^"Age" INTEGER ${+C.age||0}`);
  const mightRealm = C.realm==='magic'?'Magic':C.realm==='faerie'?'Faerie':'';
  if(mightRealm) L.push(`${T(3)}^"Might" INTEGER ${+C.might||0} NOTE "${mightRealm} Might"`);
  if(isYoung()){ const a=agingFor(+C.age||0); L.push(`${T(3)}^"Characteristic Modifier" INTEGER ${a.charMod} NOTE "Aging Chart, age ${+C.age||0} — applies to every Characteristic; Size ${a.sizeMod}"`); }
  if(isMagus()&&C.house) L.push(`${T(3)}^"House" STRING "${C.house}"`);
  L.push(`${T(3)}^"Virtues" LIST ${vfList(C.virtues)}`);
  L.push(`${T(3)}^"Flaws" LIST ${vfList(C.flaws)}`);
  if(C.equipment) L.push(`${T(3)}^"Equipment" STRING ${q(C.equipment)}`);
  const crefs = arr => '['+arr.map(x=>'^"'+x.name+'"').join(', ')+']';
  if(C.realm==='magic'){
    if(C.season) L.push(`${T(3)}^"Season" STRING "${C.season}"`);
    if(C.magic.qualities.length) L.push(`${T(3)}^"Magic Qualities" LIST ${crefs(C.magic.qualities)}`);
    if(C.magic.inferiorities.length) L.push(`${T(3)}^"Magic Inferiorities" LIST ${crefs(C.magic.inferiorities)}`);
    if(C.magic.powers.length) L.push(`${T(3)}^"Powers" LIST ${crefs(C.magic.powers)}`);
  } else if(C.realm==='faerie'){
    if(C.faerie.cognizance) L.push(`${T(3)}^"Cognizance" STRING "${C.faerie.cognizance}"`);
    if(C.faerie.blood.length) L.push(`${T(3)}^"Faerie Blood" LIST ${crefs(C.faerie.blood)}`);
    if(C.faerie.wizardry.length) L.push(`${T(3)}^"Faerie Wizardry" LIST ${crefs(C.faerie.wizardry)}`);
    if(C.faerie.powers.length) L.push(`${T(3)}^"Powers" LIST ${crefs(C.faerie.powers)}`);
  }
  L.push(`${T(3)}^"Source" STRING "Sjórseiðr character creator"`);
  if(isMagus()){
    const at=artTotals();
    L.push(`${T(3)}^"Hermetic Arts" DEF {`);
    [...DATA.arts.techniques,...DATA.arts.forms].forEach(a=>L.push(`${T(4)}^"${a.name}" INTEGER ${scoreFromXp(at[a.key]||0)}`));
    L.push(`${T(3)}}`);
  }
  L.push(`${T(2)}}`);
  const pts=(C.personalityTraits||[]).filter(t=>t.name);
  if(pts.length){ L.push(`${T(2)}PERSONALITY_TRAITS {`);
    pts.forEach(t=>L.push(`${T(3)}"${t.name.replace(/"/g,'')}" ${(+t.score>=0?'+':'')}${+t.score||0}`)); L.push(`${T(2)}}`); }
  const abils=abilityTotals();
  if(abils.length){ L.push(`${T(2)}ABILITIES {`);
    abils.forEach(t=>{ const nm=(t.name+(t.param?` (${t.param})`:'')).replace(/"/g,''); const spec=t.name===NATIVE?C.childhood.nativeLang:(t.spec||'');
      L.push(`${T(3)}"${nm}" SCORE ${scoreFromXp(t.xp)}${spec?` SPECIALTY "${String(spec).replace(/"/g,'')}"`:''}`); });
    L.push(`${T(2)}}`); }
  if(isMagus()&&C.spells.length){ L.push(`${T(2)}SPELLS_KNOWN {`);
    C.spells.forEach(s=>L.push(`${T(3)}"${(s.name||'').replace(/"/g,'')}" TECHNIQUE "${s.technique||''}" FORM "${s.form||''}" LEVEL ${+s.level||0}`));
    L.push(`${T(2)}}`); }
  const loadedPowers = C.realm==='magic'?C.magic.loadedPowers : C.realm==='faerie'?C.faerie.loadedPowers : [];
  if(loadedPowers.length){ L.push(`${T(2)}POWERS {`);
    loadedPowers.forEach(pw=>{ L.push(`${T(3)}^"${(pw.name||'').replace(/"/g,'')}" DEF {`);
      L.push(`${T(4)}PROPERTIES {`);
      if(pw.cost) L.push(`${T(5)}^"Cost" STRING ${q(pw.cost)}`);
      if(pw.initiative) L.push(`${T(5)}^"Initiative" STRING ${q(pw.initiative)}`);
      if(pw.form) L.push(`${T(5)}^"Form" STRING ${q(pw.form)}`);
      L.push(`${T(4)}}`);
      if(pw.text) L.push(`${T(4)}DESCRIPTION ${q(pw.text)}`);
      L.push(`${T(3)}}`); });
    L.push(`${T(2)}}`); }
  if(C.biography) L.push(`${T(2)}DESCRIPTION ${q(C.biography)}`);
  L.push(`${T(1)}}`);
  L.push('}');
  return L.join('\n')+'\n';
}
function exportObject(){
  const at=artTotals(), artsObj={};
  [...DATA.arts.techniques,...DATA.arts.forms].forEach(a=>{const xp=at[a.key]||0;artsObj[a.key]={label:a.name,score:scoreFromXp(xp),xp};});
  const abil=abilityTotals().map(t=>({name:t.name,param:t.param||'',speciality:t.name===NATIVE?C.childhood.nativeLang:(t.spec||''),xp:t.xp,score:scoreFromXp(t.xp)}));
  return {
    key:(C.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,''),
    name:C.name, house:isMagus()?C.house:'', parens:C.parens||'', sigil:C.sigil||'',
    born:C.born, age:C.age, apparentAge:C.apparentAge||C.age, charType:C.type,
    realm:C.realm||'', might:C.realm?(+C.might||0):null, mightRealm:C.realm==='magic'?'Magic':C.realm==='faerie'?'Faerie':'',
    realmTraits:C.realm==='magic'?{season:C.season||'',being:C.magic.beingName||'',qualities:C.magic.qualities.map(x=>x.count>1?x.name+' (x'+x.count+')':x.name),inferiorities:C.magic.inferiorities.map(x=>x.count>1?x.name+' (x'+x.count+')':x.name),powers:C.magic.powers.map(x=>x.name),loadedPowers:C.magic.loadedPowers.map(p=>p.name)}
      :C.realm==='faerie'?{cognizance:C.faerie.cognizance||'',being:C.faerie.beingName||'',powers:C.faerie.powers.map(x=>x.name),wizardry:C.faerie.wizardry.map(x=>x.name),blood:C.faerie.blood.map(x=>x.name),loadedPowers:C.faerie.loadedPowers.map(p=>p.name)}:null,
    young:isYoung()?(()=>{const a=agingFor(+C.age||0),eff={};for(const c of DATA.characteristics)eff[c.key]=(C.characteristics[c.key]||0)+a.charMod;return {age:+C.age||0, agingLabel:a.label, characteristicModifier:a.charMod, sizeModifier:a.sizeMod, effectiveCharacteristics:eff, effectiveSize:(+C.size||0)+a.sizeMod, example:C.young.beingName||'', childVirtuesFlaws:[...C.virtues,...C.flaws].filter(x=>x.child).map(x=>x.name)};})():null,
    characteristics:{...C.characteristics}, size:+C.size||0,
    confidence:{label:'Confidence',score:C.confidence.score,points:C.confidence.points}, decrepitude:0, warping:0,
    arts:artsObj,
    virtues:C.virtues.map(v=>({name:v.name,impact:(v.size||'').toLowerCase(),description:vfText('virtue',v.name),detail:v.detail||null})),
    flaws:C.flaws.map(v=>({name:v.name,impact:(v.size||'').toLowerCase(),description:vfText('flaw',v.name),detail:v.detail||null})),
    abilities:abil,
    spells:C.spells.map(s=>({name:s.name,technique:s.technique,form:s.form,level:+s.level||0,range:s.range,duration:s.duration,target:s.target,ritual:!!s.ritual,description:s.description})),
    personalityTraits:C.personalityTraits.filter(t=>t.name), reputations:C.reputations||[],
    sanctum:'', familiar:null, activeWounds:[], biography:C.biography||'',
    chargen:{createdWith:'sjorseidr chargen', edition:DATA.meta.edition, spec:DATA.meta.spec_version, concept:C.concept, type:C.type,
      template:C.templateName||C.template.name||null,
      phases:{template:C.template, childhood:C.childhood, training:C.training, later:C.later, apprentice:C.apprentice, laterYears:C.laterYears}}
  };
}
function vfText(side,name){const d=(side==='virtue'?DATA.virtues:DATA.flaws).find(x=>x.name===name);return d?d.text:'';}

async function boot(){
  try{ DATA=await (await fetch('./chargen.json',{cache:'no-store'})).json(); }
  catch(e){ $('#app').innerHTML=`<div class="warn">Could not load chargen.json — serve over http (not file://).<br>${esc(e.message)}</div>`; return; }
  try{ await ensureFmap(); }catch(e){ /* parameterized-ability detection falls back to name patterns */ }
  loadSaved();
  if(!C) C=blankChar();
  render();
}
boot();
</script>
<script src="nav.js"></script>
