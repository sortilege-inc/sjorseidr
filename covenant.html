<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjórseiðr — Covenant Sheet</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=UnifrakturCook:wght@700&display=swap');

:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply;
}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:32px 20px 80px}
a{color:var(--teal-bright)}

header{border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:22px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14.5px;margin:0}

.section{margin:26px 0}
.section-title{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--rust-bright);border-bottom:1px solid rgba(120,90,40,.35);margin:0 0 12px;padding-bottom:5px}

.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.meta-tile{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);border:1.5px solid rgba(120,90,40,.4);
  border-radius:8px;padding:10px 14px}
.meta-tile .mt-label{display:block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:3px}
.meta-tile .mt-val{display:block;font-size:16px;color:var(--ink)}

.note-flag{font-size:13px;font-style:italic;color:var(--ink-soft);margin:0 0 14px;
  padding:9px 13px;background:rgba(120,90,40,.08);border-left:3px solid var(--gold);border-radius:0 6px 6px 0}

.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fin-tile{text-align:center;background:rgba(244,235,213,.6);border:1px solid rgba(120,90,40,.35);
  border-radius:8px;padding:10px 6px}
.fin-tile .ft-label{display:block;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft)}
.fin-tile .ft-val{display:block;font-size:18px;font-weight:600;color:var(--ink);margin-top:2px}

.expense-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.expense-chip{font-size:12.5px;padding:4px 11px;border-radius:14px;background:rgba(44,107,102,.1);
  color:var(--teal);border:1px solid rgba(44,107,102,.3)}
.expense-chip .exp-note{font-style:italic;opacity:.85;margin-left:4px}

.vf-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:640px){.vf-grid{grid-template-columns:1fr}}
.vf-col-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 8px}
.vf-list{display:flex;flex-direction:column;gap:7px}
.vf-item{font-size:13px;line-height:1.5;padding:8px 11px;border-radius:6px;background:rgba(244,235,213,.55);
  border-left:3px solid var(--line)}
.vf-item.virtue{border-left-color:var(--green)}
.vf-item.flaw{border-left-color:var(--rust)}
.vf-item .vf-name{font-weight:600;color:var(--ink)}
.vf-item .vf-impact{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);
  font-style:normal;margin-left:5px}
.vf-item .vf-desc{display:block;color:var(--ink-soft);margin-top:2px}

footer{text-align:center;margin-top:44px;font-size:12.5px;color:var(--ink-soft);opacity:.75}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div class="crumb"><a href="index.html">Sjórseiðr</a> · Covenant Archive</div>
    <h1 id="covName">Covenant Sheet</h1>
    <p class="subtitle">Founding, standing, and character of the covenant itself — separate from any one ship or magus.</p>
  </header>

  <div id="content"></div>

  <footer>Meta/summary only — library, vis sources, and the full inhabitant census live in <a href="normandy_tribunal_reference.html">Vis Sources &amp; Library</a> and <a href="ships.html">Fleet &amp; Crew</a>.</footer>
</div>

<script>
const $ = s=>document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap = s => (s||'').replace(/^\w/, c=>c.toUpperCase());

async function load(){
  try{
    const r = await fetch('./covenant.json', {cache:'no-store'});
    const d = await r.json();
    render(d);
  }catch(e){
    $('#content').innerHTML = `<div class="note-flag">Could not load covenant.json — open via a local server, not file://.<br>${esc(e.message)}</div>`;
  }
}

function metaTile(label, val){
  return `<div class="meta-tile"><span class="mt-label">${esc(label)}</span><span class="mt-val">${esc(val)}</span></div>`;
}

function finTile(label, val){
  return `<div class="fin-tile"><span class="ft-label">${esc(label)}</span><span class="ft-val">${val}</span></div>`;
}

function vfListHtml(list, cls){
  if(!list || !list.length) return `<div class="vf-list"><span style="font-size:12px;font-style:italic;color:var(--ink-soft)">— none recorded —</span></div>`;
  return `<div class="vf-list">${list.map(v=>`
    <div class="vf-item ${cls}">
      <span class="vf-name">${esc(v.name)}</span>${v.impact?`<span class="vf-impact">${esc(v.impact)}</span>`:''}
      ${v.description?`<span class="vf-desc">${esc(v.description)}</span>`:''}
    </div>
  `).join('')}</div>`;
}

function render(d){
  $('#covName').textContent = d.name || 'Covenant Sheet';

  const foundedAgo = d.foundationYear ? `(founded ${d.foundationYear})` : '';
  const aegisNote = (!d.aegis || (d.aegis.level===0 && d.aegis.penetration===0)) && !d.regioLevels
    ? `<p class="note-flag">Aegis level, penetration, and regio levels are all recorded as 0 in Foundry — this may just mean they haven't been configured on the sheet yet, rather than a narrative fact. Worth a GM check.</p>` : '';

  const loyalty = d.loyalty || {};
  const lp = loyalty.points || {};
  const lm = loyalty.modifiers || {};

  const fin = d.finances || {};
  const exp = d.yearlyExpenses || {};
  const expChips = Object.entries(exp)
    .filter(([,v])=>v && v.amount)
    .map(([k,v])=>`<span class="expense-chip">${cap(k.replace(/([A-Z])/g,' $1'))}: ${v.amount}${v.notes?`<span class="exp-note">— ${esc(v.notes)}</span>`:''}</span>`)
    .join('');

  const ports = (d.preferredPorts||[]).map(p=>`<span class="expense-chip">${esc(p)}</span>`).join('');

  $('#content').innerHTML = `
    <div class="section">
      <div class="section-title">Overview</div>
      <div class="meta-grid">
        ${metaTile('Tribunal', d.tribunal || '—')}
        ${metaTile('Founded', d.foundationYear ? `A.D. ${d.foundationYear}` : '—')}
        ${metaTile('Current Season', cap(d.season) || '—')}
        ${metaTile('Saga', d.saga || '—')}
        ${metaTile('Saga Type', d.sagaType || '—')}
        ${metaTile('Storyguide', d.narrator || '—')}
      </div>
      ${d.foundingNote ? `<p style="margin-top:16px">${esc(d.foundingNote)}</p>` : ''}
      ${ports ? `<p style="margin:10px 0 4px;font-size:13px;color:var(--ink-soft)"><em>Preferred ports:</em></p><div class="expense-list">${ports}</div>` : ''}
    </div>

    ${d.charter ? `
    <div class="section">
      <div class="section-title">Covenant Charter</div>
      <p class="lead" style="color:var(--ink-soft)">${esc(d.charter.note)}</p>
      <ol style="padding-left:22px;margin:0 0 18px">
        ${(d.charter.clauses||[]).map(c=>`<li style="margin-bottom:8px">${esc(c)}</li>`).join('')}
      </ol>
      <p style="font-size:13px;color:var(--ink-faint);margin:0 0 8px">${esc(d.charter.amendmentsNote)}</p>
      <ul style="padding-left:22px;margin:0">
        ${(d.charter.amendments||[]).map(a=>`<li style="margin-bottom:8px;color:var(--ink-soft);font-size:15px">${esc(a)}</li>`).join('')}
      </ul>
    </div>
    ` : ''}

    <div class="section">
      <div class="section-title">Aegis &amp; Regio</div>
      ${aegisNote}
      <div class="meta-grid">
        ${metaTile('Aegis Level', (d.aegis||{}).level ?? 0)}
        ${metaTile('Aegis Penetration', (d.aegis||{}).penetration ?? 0)}
        ${metaTile('Regio Levels', d.regioLevels ?? 0)}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Loyalty</div>
      <div class="meta-grid">
        ${metaTile('Prevailing', lp.prevailing ?? '—')}
        ${metaTile('Modifier', lp.modifier ?? '—')}
        ${metaTile('Equipment', cap(lm.equipment) || '—')}
        ${metaTile('Wages', cap(lm.wages) || '—')}
        ${metaTile('Familiarity', lm.familiarity ?? '—')}
        ${metaTile('Events', lm.events ?? '—')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">Finances (yearly)</div>
      <div class="fin-grid">
        ${finTile('Wealth', fin.wealth ?? 0)}
        ${finTile('Total Income', fin.totalIncome ?? 0)}
        ${finTile('Base Expenditure', fin.baseExpenditure ?? 0)}
        ${finTile('Cost Savings', fin.costSavings ?? 0)}
        ${finTile('Total Expenditure', fin.totalExpenditure ?? 0)}
      </div>
      <div class="fin-grid" style="margin-top:10px">
        ${finTile('Inhabitants Upkeep', fin.inhabitantsPoints ?? 0)}
        ${finTile('Laboratories Upkeep', fin.laboratoriesPoints ?? 0)}
        ${finTile('Weapons Upkeep', fin.weaponsPoints ?? 0)}
        ${finTile('Avg. Equip Maint.', fin.averageEquipMaintenance ?? 0)}
      </div>
      ${expChips ? `<div class="expense-list">${expChips}</div>` : ''}
    </div>

    <div class="section">
      <div class="section-title">Covenant Virtues &amp; Flaws</div>
      <div class="vf-grid">
        <div>
          <div class="vf-col-title">Virtues (${(d.virtues||[]).length})</div>
          ${vfListHtml(d.virtues, 'virtue')}
        </div>
        <div>
          <div class="vf-col-title">Flaws (${(d.flaws||[]).length})</div>
          ${vfListHtml(d.flaws, 'flaw')}
        </div>
      </div>
    </div>
  `;
}

load();
</script>
</body>
</html>
