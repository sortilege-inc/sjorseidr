<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sjórseiðr</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --purple:#5b3a8a; --green:#3e6b35;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply}

.topnav{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:2px;
  padding:9px 18px;background:rgba(56,38,18,.86);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  border-bottom:2px solid var(--line);box-shadow:0 2px 12px var(--shadow)}
.topnav .brand{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.06em;color:var(--gold-bright);
  margin-right:auto;font-size:15px;text-decoration:none}
.topnav .brand::before{content:"⚓";margin-right:.45em;color:var(--rust-bright);font-size:.85em}
.topnav a{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:.04em;color:#e9d8b2;text-decoration:none;
  padding:6px 11px;border-radius:6px;border-bottom:2px solid transparent;transition:.15s}
.topnav a:hover{color:#fff6df;background:rgba(255,255,255,.07)}
.topnav a.active{color:#fff6df;border-bottom-color:var(--gold-bright)}
.topnav a.gm{color:#e2a99c}
.topnav a.gm::before{content:"⚔ "}
.topnav a.gm:hover{color:#f2c1b6}
.topnav a.gm.active{color:#f2c1b6;border-bottom-color:var(--rust-bright)}

.wrap{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:30px 20px 80px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:6px}
.crumb a{color:var(--teal-bright);text-decoration:none}
h1.sec-title{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(24px,5vw,34px);color:var(--rust-bright);
  margin:2px 0 4px;display:flex;align-items:center;gap:12px}
h1.sec-title.gm{color:var(--rust)}
.sec-icon{font-size:.95em}
.sec-blurb{font-style:italic;color:var(--ink-soft);font-size:15px;margin:0 0 24px;max-width:680px;line-height:1.55}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:18px}
a.card{display:block;position:relative;text-decoration:none;color:inherit;
  background:linear-gradient(180deg,var(--parch) 0%,var(--parch-deep) 100%);
  border:1px solid var(--line);border-radius:6px;padding:20px 22px 18px;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 10px 24px -14px var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease}
a.card:hover{transform:translateY(-3px);border-color:var(--gold);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 16px 30px -14px var(--shadow)}
a.card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(106,84,54,.35);border-radius:3px;pointer-events:none}
.card-icon{font-size:26px;line-height:1;margin-bottom:9px;display:block}
.card-title{font-family:'Cinzel',serif;font-weight:600;font-size:17px;color:var(--rust-bright);margin:0 0 7px;letter-spacing:.3px}
.card-desc{font-size:14.5px;line-height:1.5;color:var(--ink-soft);margin:0}
.card-tag{display:inline-block;margin-top:11px;font-family:'Cinzel',serif;font-size:10.5px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:.85}
.empty{text-align:center;color:var(--ink-soft);font-style:italic;padding:50px 10px}
footer{text-align:center;margin-top:44px;padding-top:16px;border-top:1px solid rgba(120,90,40,.3);
  font-size:12.5px;color:var(--ink-soft);opacity:.85}
footer a{color:var(--teal-bright)}
</style>
</head>
<body>
<nav class="topnav" id="topnav"><a class="brand" href="index.html">Sjórseiðr</a></nav>
<div class="wrap">
  <div class="crumb"><a href="index.html">Sjórseiðr</a> · <span id="crumbSec">…</span></div>
  <h1 class="sec-title" id="secTitle">…</h1>
  <p class="sec-blurb" id="secBlurb"></p>
  <div class="grid" id="cardGrid"></div>
  <footer><a href="index.html">← Back to the archive</a></footer>
</div>

<script>
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wantId = new URLSearchParams(location.search).get('sec') || '';

fetch('./sitemap.json', {cache:'no-store'})
  .then(r => r.json())
  .then(map => {
    const secs = map.sections || [];
    // top nav (whole site), current section highlighted
    document.getElementById('topnav').insertAdjacentHTML('beforeend',
      secs.map(s => `<a class="${s.gm?'gm':''} ${s.id===wantId?'active':''}" href="section.html?sec=${encodeURIComponent(s.id)}">${esc(s.title)}</a>`).join(''));

    const sec = secs.find(s => s.id === wantId);
    if(!sec){
      document.title = 'Sjórseiðr — section not found';
      document.getElementById('crumbSec').textContent = 'Unknown section';
      document.getElementById('secTitle').textContent = 'Section not found';
      document.getElementById('cardGrid').innerHTML =
        `<div class="empty">No section “${esc(wantId)}”. <a href="index.html">Return to the archive.</a></div>`;
      return;
    }
    document.title = `Sjórseiðr — ${sec.title}`;
    document.getElementById('crumbSec').textContent = sec.title;
    const titleEl = document.getElementById('secTitle');
    titleEl.classList.toggle('gm', !!sec.gm);
    titleEl.innerHTML = `<span class="sec-icon">${esc(sec.icon||'')}</span> ${esc(sec.title)}`;
    document.getElementById('secBlurb').textContent = sec.blurb || '';
    document.getElementById('cardGrid').innerHTML = (sec.cards||[]).map(c =>
      `<a class="card" href="${esc(c.href)}"${c.download?' download':''}>
        <span class="card-icon">${esc(c.icon||'')}</span>
        <p class="card-title">${esc(c.title)}</p>
        <p class="card-desc">${esc(c.desc||'')}</p>
        ${c.tag?`<span class="card-tag">${esc(c.tag)}</span>`:''}
      </a>`).join('');
  })
  .catch(e => {
    document.getElementById('cardGrid').innerHTML =
      `<div class="empty">Could not load sitemap.json — serve this over http, not file://.<br>${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
