<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Session — Candidate Scenes</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap');
:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86;
  --green:#3e6b35; --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 30% 20%, rgba(120,80,30,.06) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(90,60,20,.05) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 85%, rgba(120,80,30,.05) 0 2px, transparent 3px);
  background-size:140px 140px,180px 180px,160px 160px;opacity:.6;mix-blend-mode:multiply}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 20px 80px}
a{color:var(--teal-bright)}

header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:18px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.subtitle{font-style:italic;color:var(--ink-soft);font-size:14px;margin:0;max-width:640px}
.status{font-family:'Cinzel',serif;font-size:11.5px;color:var(--ink-soft);text-align:right;white-space:nowrap}

.filterbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding:8px 10px;
  background:rgba(120,90,40,.08);border:1px solid rgba(120,90,40,.18);border-radius:8px}
.filterbar .label{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-right:2px;flex:none}
.fbtn{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.04em;cursor:pointer;
  border:1px solid rgba(120,90,40,.3);background:rgba(244,235,213,.6);color:var(--ink-soft);
  padding:4px 10px;border-radius:14px;transition:all .12s;display:inline-flex;align-items:center;gap:5px}
.fbtn:hover{background:rgba(244,235,213,.95);color:var(--ink)}
.fbtn.on{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#fff6df;border-color:#7a5318;font-weight:600}
.fbtn .dot{width:9px;height:9px;border-radius:50%;flex:none}
.fbtn .n{font-family:'EB Garamond',serif;font-style:italic;font-size:11px;opacity:.8}
.fbtn.on .n{opacity:.95}
.count{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin:4px 2px 18px}

.list{display:flex;flex-direction:column;gap:14px}
.scene{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);
  border:1.5px solid rgba(120,90,40,.45);border-left-width:5px;border-radius:10px;padding:15px 18px 16px;
  box-shadow:0 2px 6px var(--shadow);transition:border-color .12s}
.scene:hover{border-color:var(--gold)}
.scene.st-developed{border-left-color:var(--green)}
.scene.st-deferred{border-left-color:var(--gold)}
.scene.st-needsprep{border-left-color:var(--rust-bright)}
.scene-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:7px}
.scene h2{font-family:'Cinzel',serif;font-weight:600;font-size:17px;line-height:1.3;margin:0;color:var(--ink)}
.badge{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:9px;white-space:nowrap;flex:none;font-weight:600}
.badge.st-developed{background:rgba(62,107,53,.16);color:var(--green);border:1px solid rgba(62,107,53,.45)}
.badge.st-deferred{background:rgba(154,107,31,.2);color:var(--gold);border:1px solid rgba(154,107,31,.5)}
.badge.st-needsprep{background:rgba(181,74,50,.16);color:var(--rust-bright);border:1px solid rgba(181,74,50,.45)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.04em;padding:2px 9px;border-radius:9px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
.tag.season{background:rgba(120,90,40,.14);color:var(--ink-soft);border:1px solid rgba(120,90,40,.3)}
.tag.thread{background:rgba(44,107,102,.14);color:var(--teal);border:1px solid rgba(44,107,102,.32);font-style:italic;font-family:'EB Garamond',serif;text-transform:none;font-size:12px}
.tag.magus{color:#fff6ec;font-weight:600}
.tag.npc{background:rgba(120,90,40,.1);color:var(--ink-soft);border:1px dashed rgba(120,90,40,.4);font-family:'EB Garamond',serif;text-transform:none;font-size:12px}
.hook{font-size:15px;line-height:1.5;margin:0 0 8px;font-weight:600}
.detail{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 10px}
.refs{font-size:12px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.refs .rl{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.03em;color:var(--ink-soft);margin-right:2px;text-transform:uppercase}
.refs a{font-family:'Cinzel',serif;font-size:10.5px;text-decoration:none;background:rgba(120,90,40,.12);
  border:1px solid rgba(120,90,40,.3);color:var(--ink-soft);padding:2px 7px;border-radius:8px}
.refs a:hover{background:rgba(198,155,63,.3);color:var(--ink)}
.empty{text-align:center;color:var(--ink-soft);font-style:italic;padding:40px 10px}
footer{margin-top:30px;padding-top:14px;border-top:1px solid rgba(120,90,40,.3);font-size:12.5px;color:var(--ink-soft);font-style:italic}
@media(max-width:560px){.scene-top{flex-direction:column-reverse;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="crumb"><a href="index.html">Sjórseiðr</a> · <a href="open_questions.html">Storyteller</a> · Next-Session Scenes</div>
      <h1>Next Session — Candidate Scenes</h1>
      <p class="subtitle" id="subtitle">—</p>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>

  <div class="filterbar" id="seasonbar"></div>
  <div class="filterbar" id="magusbar"></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>

  <footer id="foot"></footer>
</div>

<script>
const $ = s=>document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAGUS_COLOR = {
  'Éogan':'#3e6b35', 'Dagmar':'#5b3a8a', 'Wilhelm':'#275f85',
  'Valdemar':'#2c6b66', 'Valerian':'#6d6a55', 'Dustin':'#8a5a2f'
};
const statusClass = s => 'st-' + (s||'').toLowerCase().replace(/[^a-z]/g,'');
let DATA=null;
let filter = {season:'all', magus:'all'};

async function load(){
  try{
    DATA = await (await fetch('./next_session_scenes.json', {cache:'no-store'})).json();
  }catch(e){
    $('#list').innerHTML = `<div class="empty">Could not load next_session_scenes.json — serve this page over http, not file://.<br>${esc(e.message)}</div>`;
    $('#status').textContent = 'Load failed'; return;
  }
  $('#subtitle').textContent = DATA.meta.subtitle || '';
  $('#foot').innerHTML = `As of <b>${esc(DATA.meta.as_of||'')}</b>. Source: ${esc(DATA.meta.source||'the Open Questions prep')}. `
    + `Legend — <b style="color:var(--green)">Developed</b> ready to stage · <b style="color:var(--gold)">Deferred</b> improvise at the table · <b style="color:var(--rust-bright)">Needs prep</b> flagged but undeveloped.`;
  renderFilters();
  render();
}

function seasonsInOrder(){
  const wanted = ['Spring 1224','Summer 1224','Fall 1224','Winter 1224'];
  const present = new Set(DATA.scenes.flatMap(s=>s.seasons));
  return wanted.filter(s=>present.has(s)).concat([...present].filter(s=>!wanted.includes(s)));
}

function renderFilters(){
  // season bar
  const seasons = seasonsInOrder();
  const sBtns = ['all', ...seasons].map(s=>{
    const n = s==='all' ? DATA.scenes.length : DATA.scenes.filter(x=>x.seasons.includes(s)).length;
    return `<button class="fbtn ${filter.season===s?'on':''}" data-season="${esc(s)}">${s==='all'?'All seasons':esc(s)} <span class="n">${n}</span></button>`;
  }).join('');
  $('#seasonbar').innerHTML = `<span class="label">Season</span>${sBtns}`;

  // magus bar — full roster so empty magi are visible as gaps
  const roster = DATA.meta.magi_roster || [...new Set(DATA.scenes.flatMap(s=>s.magi))];
  const mBtns = ['all', ...roster].map(m=>{
    const n = m==='all' ? DATA.scenes.length : DATA.scenes.filter(x=>x.magi.includes(m)).length;
    const dot = m==='all' ? '' : `<span class="dot" style="background:${MAGUS_COLOR[m]||'#888'}"></span>`;
    return `<button class="fbtn ${filter.magus===m?'on':''}" data-magus="${esc(m)}">${dot}${m==='all'?'All magi':esc(m)} <span class="n">${n}</span></button>`;
  }).join('');
  $('#magusbar').innerHTML = `<span class="label">Magus</span>${mBtns}`;

  $$all('#seasonbar .fbtn').forEach(b=>b.onclick=()=>{filter.season=b.dataset.season;renderFilters();render();});
  $$all('#magusbar .fbtn').forEach(b=>b.onclick=()=>{filter.magus=b.dataset.magus;renderFilters();render();});
}
const $$all = s=>Array.from(document.querySelectorAll(s));

function magusTags(magi){
  return magi.map(m=>`<span class="tag magus" style="background:${MAGUS_COLOR[m]||'#666'};border:1px solid rgba(0,0,0,.15)">${esc(m)}</span>`).join('');
}
function refLinks(refs){
  if(!refs||!refs.length) return '';
  return `<div class="refs"><span class="rl">Springs from</span>`
    + refs.map(r=>`<a href="open_questions.html" title="See ${esc(r)} in Open Questions">${esc(r)}</a>`).join('')
    + `</div>`;
}
function sceneCard(s){
  const sc = statusClass(s.status);
  return `<div class="scene ${sc}">
    <div class="scene-top">
      <h2>${esc(s.title)}</h2>
      <span class="badge ${sc}">${esc(s.status)}</span>
    </div>
    <div class="tags">
      ${s.seasons.map(se=>`<span class="tag season">🗓 ${esc(se)}</span>`).join('')}
      ${magusTags(s.magi)}
      ${(s.npcs||[]).map(n=>`<span class="tag npc">${esc(n)}</span>`).join('')}
      ${s.thread?`<span class="tag thread">${esc(s.thread)}</span>`:''}
    </div>
    <p class="hook">${esc(s.hook)}</p>
    <p class="detail">${esc(s.detail)}</p>
    ${refLinks(s.refs)}
  </div>`;
}

function render(){
  const list = DATA.scenes.filter(s=>
    (filter.season==='all' || s.seasons.includes(filter.season)) &&
    (filter.magus==='all'  || s.magi.includes(filter.magus))
  );
  const total = DATA.scenes.length;
  $('#status').textContent = `${total} candidate scenes`;
  const bits = [];
  if(filter.season!=='all') bits.push(filter.season);
  if(filter.magus!=='all')  bits.push(filter.magus);
  $('#count').textContent = bits.length
    ? `Showing ${list.length} of ${total} — ${bits.join(' · ')}`
    : `Showing all ${total} scenes`;
  $('#list').innerHTML = list.length
    ? list.map(sceneCard).join('')
    : `<div class="empty">No scene matches this filter yet — that's a gap worth prepping.</div>`;
}

load();
</script>
<script src="nav.js"></script>
</body>
</html>
