<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Covenant Ledger — Sjórseiðr</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap');
:root{
  --parch:#ede0c4; --parch-deep:#d8c39a;
  --ink:#221a12; --ink-soft:#4a3c2c;
  --gold:#9a6b1f; --gold-bright:#c69b3f;
  --rust:#8a3324; --rust-bright:#b54a32;
  --teal:#2c6b66; --teal-bright:#3f8f86; --green:#3e6b35; --purple:#5b3a8a;
  --line:#6b5436; --shadow:rgba(50,32,12,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);
  background:radial-gradient(120% 120% at 20% 0%, #f1e6cb 0%, #e6d6b3 55%, #d8c49b 100%) fixed;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px 70px}
a{color:var(--teal)}
header{border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.crumb{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.crumb a{text-decoration:none}
h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--rust-bright);margin:4px 0 2px}
.ident{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--ink-soft);margin-top:6px}
.ident b{color:var(--ink);font-weight:600}
.caveat{font-style:italic;color:var(--ink-soft);font-size:12.5px;margin:8px 0 0;padding:8px 12px;
  background:rgba(181,74,50,.08);border-left:3px solid var(--rust-bright);border-radius:0 6px 6px 0}

/* year-node timeline */
.nodebar{display:flex;justify-content:space-between;position:relative;margin:18px 6px 4px;padding-top:2px}
.nodebar::before{content:"";position:absolute;left:6%;right:6%;top:12px;height:2px;
  background:linear-gradient(90deg,transparent,var(--line) 6%,var(--line) 94%,transparent);opacity:.6}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;cursor:pointer;flex:1;gap:4px}
.node .pip{width:15px;height:15px;border-radius:50%;background:var(--parch-deep);border:2px solid var(--line);transition:.12s}
.node:hover .pip{border-color:var(--gold)}
.node.on .pip{background:var(--rust-bright);border-color:var(--rust);box-shadow:0 0 0 3px rgba(181,74,50,.22);transform:scale(1.15)}
.node.unpop .pip{background:var(--parch);border-style:dashed}
.node .lb{font-family:'Cinzel',serif;font-size:12.5px;color:var(--ink-soft)}
.node.on .lb{color:var(--rust-bright);font-weight:600}
.node .sb{font-size:9px;color:var(--ink-soft);font-style:italic;opacity:.7;text-align:center;line-height:1.1;max-width:88px}
.nodehint{font-style:italic;color:var(--ink-soft);font-size:12px;margin:2px 6px 0;text-align:right}
.notpop{text-align:center;color:var(--ink-soft);font-style:italic;padding:30px 12px;
  background:rgba(120,90,40,.05);border:1px dashed rgba(120,90,40,.4);border-radius:10px}
.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px}
.tab{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.02em;padding:8px 15px;cursor:pointer;color:var(--ink-soft);
  border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--rust-bright);border-color:var(--rust-bright);font-weight:600}
.tab .n{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-soft)}

.panel{display:none}
.panel.on{display:block}
.section-sub{font-style:italic;color:var(--ink-soft);font-size:13px;margin:0 0 14px}
h2.sh{font-family:'Cinzel',serif;font-weight:600;font-size:16px;color:var(--rust-bright);margin:20px 0 8px}

.card{background:linear-gradient(180deg,#f1e6c9,#e4d3a8);border:1.5px solid rgba(120,90,40,.4);border-radius:10px;
  padding:13px 16px;box-shadow:0 2px 6px var(--shadow);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px}
.ship .st{font-family:'Cinzel',serif;font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:9px;
  background:rgba(62,107,53,.16);color:var(--green);border:1px solid rgba(62,107,53,.4);float:right}
.ship .st.inactive{background:rgba(120,90,40,.14);color:var(--ink-soft);border-color:rgba(120,90,40,.4)}
.ship h3{font-family:'Cinzel',serif;font-size:15px;color:var(--ink);margin:0 0 2px}
.ship .meta{font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.ship .lab{margin-top:5px;font-size:12px;color:var(--teal)}
.ship .lab.none{color:var(--ink-soft);font-style:italic}

table{border-collapse:collapse;width:100%;font-size:13px;margin:4px 0 10px}
th,td{text-align:left;padding:5px 9px;border-bottom:1px solid rgba(120,90,40,.2)}
th{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft)}
tr:hover td{background:rgba(198,155,63,.08)}
.pill{display:inline-block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:.03em;padding:2px 8px;border-radius:9px;
  background:rgba(120,90,40,.14);color:var(--ink-soft);border:1px solid rgba(120,90,40,.3);margin:2px 3px 2px 0}
.catblock{margin-bottom:12px}
.catblock h3{font-family:'Cinzel',serif;font-size:13.5px;color:var(--rust-bright);margin:0 0 4px;text-transform:capitalize}
.catblock h3 .n{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-soft);font-weight:400}
.cols{columns:2;column-gap:24px}
.cols .row{break-inside:avoid;font-size:13px;padding:2px 0;color:var(--ink)}
.cols .row small{color:var(--ink-soft)}
.econ-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed rgba(120,90,40,.25);font-size:14px}
.econ-row b{font-family:'Cinzel',serif}
.econ-big{font-size:20px;font-family:'Cinzel',serif}
.pos{color:var(--green)} .neg{color:var(--rust-bright)}

.ledger .fbtn{font-family:'Cinzel',serif;font-size:11px;cursor:pointer;border:1px solid rgba(120,90,40,.3);
  background:rgba(244,235,213,.6);color:var(--ink-soft);padding:3px 10px;border-radius:13px;margin:0 4px 8px 0}
.ledger .fbtn.on{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#fff6df;border-color:#7a5318;font-weight:600}
.levent{border-left:4px solid var(--gold);padding:8px 12px;margin:0 0 9px;background:rgba(120,90,40,.05);border-radius:0 8px 8px 0}
.levent .lt{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.levent .season{font-family:'Cinzel',serif;font-size:11px;color:var(--rust-bright);letter-spacing:.03em;white-space:nowrap}
.levent .facet{font-family:'Cinzel',serif;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#fff6ec;padding:1px 7px;border-radius:8px}
.levent h4{margin:2px 0 3px;font-size:14.5px}
.levent p{margin:0;font-size:13px;color:var(--ink-soft);line-height:1.5}
.f-ships{background:var(--teal)} .f-economics{background:var(--gold)} .f-vis{background:var(--purple)}
.f-library{background:var(--green)} .f-inhabitants{background:var(--rust-bright)} .f-note{background:var(--ink-soft)}
/* vis — pawn rows */
.viewtoggle{display:flex;gap:4px;margin:2px 0 12px}
.viewtoggle .fbtn{font-family:'Cinzel',serif;font-size:11px;cursor:pointer;border:1px solid rgba(120,90,40,.3);
  background:rgba(244,235,213,.6);color:var(--ink-soft);padding:3px 12px;border-radius:13px}
.viewtoggle .fbtn.on{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#fff6df;border-color:#7a5318;font-weight:600}
.visrow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px dashed rgba(120,90,40,.22)}
.visrow:last-of-type{border-bottom:none}
.visrow .vislabel{flex:0 0 148px;font-family:'Cinzel',serif;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
.visrow .vislabel .sw{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.visrow .vislabel .q{font-family:'EB Garamond',serif;font-style:italic;font-size:12px;color:var(--ink-soft);font-weight:400}
.pawns{display:flex;flex-wrap:wrap;gap:0 1px;align-items:center;line-height:1}
.pawn{font-size:19px;line-height:1.15;filter:drop-shadow(0 1px 0 rgba(255,250,240,.5))}
.pawn.ghost{opacity:.26} .pawn.surplus{filter:drop-shadow(0 0 2px rgba(181,74,50,.7))}
.vis-none{color:var(--ink-soft);font-style:italic;font-size:12.5px;padding:4px 0}
.leg{display:flex;flex-wrap:wrap;gap:5px 11px;margin:11px 0 2px;font-size:11px;color:var(--ink-soft)}
.leg .chip{display:inline-flex;align-items:center;gap:3px}
.leg .pawn{font-size:15px}
.srcrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px dashed rgba(120,90,40,.22)}
.srcrow:last-child{border-bottom:none}
.srcrow .nm{flex:0 0 200px;font-size:13px;color:var(--ink)}
.srcrow .cmp{font-family:'Cinzel',serif;font-size:12px;color:var(--ink-soft);white-space:nowrap;margin-left:auto}
.srcrow .cmp .short{color:var(--rust-bright);font-weight:600} .srcrow .cmp .met{color:var(--green);font-weight:600}
/* library filter table */
.libfilters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:2px 0 12px}
.libfilters label{font-family:'Cinzel',serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
.libfilters select{font-family:'EB Garamond',serif;font-size:13px;color:var(--ink);background:rgba(244,235,213,.7);
  border:1px solid rgba(120,90,40,.4);border-radius:6px;padding:3px 6px}
.libfilters .clr{font-family:'Cinzel',serif;font-size:10.5px;cursor:pointer;color:var(--teal);background:none;border:none;text-decoration:underline}
table.libtbl th{cursor:pointer;user-select:none;white-space:nowrap}
table.libtbl th.sorted{color:var(--rust-bright)}
table.libtbl th .ar{font-size:9px;opacity:.8}
table.libtbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.libtbl td.dim{color:var(--ink-soft)}
.libtbl .kindico{opacity:.75;margin-right:3px}
.libcount{font-size:12px;color:var(--ink-soft);font-style:italic;margin:0 0 8px}
footer{margin-top:24px;padding-top:12px;border-top:1px solid rgba(120,90,40,.3);font-size:12px;color:var(--ink-soft);font-style:italic}
@media(max-width:640px){.cols{columns:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="index.html">Sjórseiðr</a> · Covenant · Ledger</div>
    <h1 id="cname">Covenant Ledger</h1>
    <div class="ident" id="ident"></div>
    <p class="caveat" id="caveat"></p>
  </header>

  <div class="nodebar" id="nodebar"></div>
  <div class="nodehint" id="nodehint"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>

  <footer id="foot"></footer>
</div>

<script src="nav.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D=null, tab='overview', ledgerFilter='all', node='current';
const TABS=[['overview','Overview'],['ships','Ships & Labs'],['inhabitants','Inhabitants'],
  ['library','Library'],['vis','Vis'],['trade','Trade'],['economics','Economics'],['ledger','Ledger']];
const nodeYear=()=>node==='current'?1224:+node;
const tradeTotal=y=>((D&&D.trade)||[]).filter(t=>t.year===y).reduce((a,t)=>a+(t.result||0),0);
let visStockView='type', libSort='title';
let libFilter={type:'all',location:'all',level:'all',quality:'all',topic:'all'};
let libTableSort={col:'title',dir:1};
// The Fifteen Arts, in canonical order, each a distinct rainbow hue tuned to sit on parchment.
const PAWN='♟︎';   // ♟ forced to text (not emoji) so `color` applies
const ART_ORDER=['cr','in','mu','pe','re','an','aq','au','co','he','ig','im','me','te','vi'];
const ART_NAME={cr:'Creo',in:'Intellego',mu:'Muto',pe:'Perdo',re:'Rego',an:'Animal',aq:'Aquam',au:'Auram',
  co:'Corpus',he:'Herbam',ig:'Ignem',im:'Imaginem',me:'Mentem',te:'Terram',vi:'Vim'};
const ART_ABBR={cr:'Cr',in:'In',mu:'Mu',pe:'Pe',re:'Re',an:'An',aq:'Aq',au:'Au',co:'Co',he:'He',ig:'Ig',im:'Im',me:'Me',te:'Te',vi:'Vi'};
const artColor=a=>{const i=ART_ORDER.indexOf(a);return i<0?'#6b5436':`hsl(${Math.round(i*360/15)} 54% 43%)`;};
const pawnSpan=(a,cls)=>`<span class="pawn${cls?' '+cls:''}" style="color:${artColor(a)}">${PAWN}</span>`;
const pawnRun=(a,n)=>pawnSpan(a).repeat(Math.max(0,n|0));
// library text helpers (a book/labText is a string legacy or an object with metadata)
const bt=b=>typeof b==='string'?b:(b.title||'');
const bl=b=>(typeof b==='object'&&b.location)?b.location:null;
const bTip=b=>{ if(typeof b!=='object') return '';
  const seg=[]; if(b.topic)seg.push(b.topic);
  const lq=[]; if(b.type)lq.push(b.type);
  if(b.level!=null&&b.level!==0)lq.push('L'+b.level);
  if(b.quality!=null)lq.push('Q'+b.quality);
  return seg.concat(lq.length?[lq.join(' ')]:[]).join(' — '); };

async function load(){
  try{ D=await (await fetch('./covenant_ledger.json',{cache:'no-store'})).json(); }
  catch(e){ $('#panels').innerHTML=`<p style="padding:24px">Could not load covenant_ledger.json (serve over http).<br>${esc(e.message)}</p>`; return; }
  $('#cname').textContent=`${esc(D.meta.identity.name)} — Covenant Ledger`;
  $('#caveat').textContent=D.meta.baseline;
  $('#foot').innerHTML=`Baseline from the Foundry covenant actor (~${esc(D.meta.asOf)}). Each node is the covenant at that year's end of Winter; <b>Current</b> is live. Year nodes fill in as we reconstruct them.`;
  if(!N().populated){ const pop=D.nodes.filter(n=>n.populated); if(pop.length) node=pop[pop.length-1].id; } // open on latest populated node
  buildNodebar(); render();
}
function buildNodebar(){
  $('#nodebar').innerHTML=D.nodes.map(n=>
    `<div class="node ${node===n.id?'on':''} ${n.populated?'':'unpop'}" data-node="${esc(n.id)}" title="${esc(n.sub||'')}">
      <span class="pip"></span><span class="lb">${esc(n.label)}</span><span class="sb">${esc(n.sub||'')}</span></div>`).join('');
  document.querySelectorAll('.node').forEach(el=>el.onclick=()=>{node=el.dataset.node;buildNodebar();render();});
}
const N=()=>D.nodes.find(n=>n.id===node);
const s=()=>N().state;
const ledgerUpTo=()=>{ const cut=N().cutoff||'9999'; return D.ledger.filter(l=>(l.sort_iso||'')<=cut); };
// A facet counts as reconstructed for a populated node when it holds data.
// Early nodes reconstruct ships + magi only; other facets gate until filled in.
function facetReady(t){
  const st=s();
  if(t==='overview'||t==='ledger') return true;
  if(t==='ships') return (st.ships||[]).length>0;
  if(t==='inhabitants') return (st.inhabitants||[]).length>0;
  if(t==='library') return ((st.library.books||[]).length+(st.library.labTexts||[]).length)>0;
  if(t==='vis') return ((st.vis.stock||[]).length+(st.vis.sources||[]).length)>0;
  if(t==='economics') return st.economics && Object.keys(st.economics).length>0;
  if(t==='trade') return true;
  return true;
}
const hasEcon=()=>{const e=s().economics;return e&&Object.keys(e).length>0;};
const SHIP_NAMES={'tide-of-memory':'Tide of Memory','brineborn':'The Brineborn','scholars-wake':"The Scholar's Wake",
 'maelstroms-maw':"The Maelstrom's Maw",'gloaming':'The Gloaming','storm-dragon':'Veðrdreki',
 'adamant':'Adamant','hound-of-cassel':'Hound of Cassel'};
const ABSENT=['twilight','sabbatical'];
// Inhabitants tab badge: contributing headcount for by-ship nodes, else raw total.
// Upkeep inhabitant count: crew of every hull EXCEPT sabbatical ones (prize crews count),
// plus contributing non-crew members (active magi, apprentices, companions, familiars — not absent magi or NPCs).
function inhabCount(){const st=s();const useShip=st.inhabitants.some(i=>i.ship||i.standing);
  if(!useShip) return st.inhabitants.length;
  const crew=(st.ships||[]).filter(sh=>!/sabbatical/i.test(sh.status||'')).reduce((a,sh)=>a+(sh.crew||0),0);
  const NONC=['magi','companions','familiars'];
  const members=st.inhabitants.filter(i=>NONC.includes(i.category)&&!ABSENT.includes(i.standing)).length;
  return crew+members;}

function render(){
  const n=N(), st=s(), id=D.meta.identity, dash=v=>(v==null?'—':v);
  $('#ident').innerHTML=`<span>Founded <b>${esc(id.founded)}</b></span><span><b>${esc(id.tribunal)}</b> Tribunal</span>`
    +`<span>Aegis <b>${dash(st.aegis)}</b> · Pen. <b>${dash(st.penetration)}</b></span><span>Regio <b>${dash(st.regio)}</b></span>`
    +`<span>Wealth <b>${dash(st.economics&&st.economics.wealth)}</b> £</span>`;
  $('#nodehint').textContent = n.populated ? `Showing ${n.label} — ${n.sub}` : `${n.label} — not yet reconstructed`;
  $('#tabs').innerHTML=TABS.map(([k,l])=>{
    let cnt='';
    if(n.populated && facetReady(k)) cnt = k==='ships'?st.ships.length : k==='inhabitants'?inhabCount()
      : k==='library'?(st.library.books.length+st.library.labTexts.length)
      : k==='vis'?st.vis.stock.reduce((a,x)=>a+(x.q||0),0)
      : k==='trade'?(tradeTotal(nodeYear())||'') : '';
    return `<div class="tab ${tab===k?'on':''}" data-tab="${k}">${l}${cnt!==''?` <span class="n">${cnt}</span>`:''}</div>`;}).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.tab;render();});
  let html;
  if(tab!=='ledger' && !n.populated){
    html=`<div class="notpop">The <b>${esc(n.label)}</b> snapshot (${esc(n.sub)}) hasn't been reconstructed yet.<br>`
      +`The actor's early data is unreliable, so these fill in as we sort them out. See <b>Current</b> for the live state, or open the <b>Ledger</b> for changes up to this point.</div>`;
  } else if(tab!=='ledger' && n.populated && !facetReady(tab)){
    const tl=(TABS.find(t=>t[0]===tab)||['',tab])[1];
    html=`<div class="notpop">The <b>${esc(tl)}</b> facet for <b>${esc(n.label)}</b> hasn't been reconstructed yet.<br>`
      +`Ships and magi are done for this node; the remaining facets fill in as we sort them out. See the <b>Ledger</b> for dated changes, or <b>Current</b> for the live state.</div>`;
  } else html=PANELS[tab]();
  $('#panels').innerHTML=`<div class="panel on">${html}</div>`;
  if(tab==='ledger') wireLedger();
  if(tab==='vis') wireVis();
  if(tab==='library') wireLib();
}
const PANELS={
  overview(){ const e=s().economics; const na='<span style="color:var(--ink-soft);font-style:italic">not yet reconstructed</span>';
    const libReady=facetReady('library'), visReady=facetReady('vis');
    return `<p class="section-sub">The covenant at a glance. Detailed facets are on the tabs above; changes over time are in the Ledger.</p>
     <div class="grid">
      <div class="card"><h2 class="sh" style="margin-top:0">Standing</h2>
        <div class="econ-row"><span>Ships</span><b>${s().ships.length}</b></div>
        <div class="econ-row"><span>Inhabitants</span><b>${s().inhabitants.length}</b></div>
        <div class="econ-row"><span>Library (books · lab texts)</span><b>${libReady?`${s().library.books.length} · ${s().library.labTexts.length}`:na}</b></div>
        <div class="econ-row"><span>Vis (stocks · sources)</span><b>${visReady?`${s().vis.stock.length} · ${s().vis.sources.length}`:na}</b></div>
        <div class="econ-row"><span>Income · Expenditure</span><b>${hasEcon()?`${e.totalIncome} · ${e.totalExpenditure} £`:na}</b></div>
      </div>
      <div class="card"><h2 class="sh" style="margin-top:0">Boons &amp; Hooks</h2>
        <div><b style="font-family:Cinzel">Virtues</b><br>${s().virtues.length?s().virtues.map(v=>`<span class="pill">${esc(v)}</span>`).join(''):na}</div>
        <div style="margin-top:8px"><b style="font-family:Cinzel">Flaws</b><br>${s().flaws.length?s().flaws.map(v=>`<span class="pill">${esc(v)}</span>`).join(''):na}</div>
      </div>
      <div class="card"><h2 class="sh" style="margin-top:0">Notable possessions</h2>
        ${s().possessions.length?s().possessions.map(p=>`<div>· ${esc(p)}</div>`).join(''):na}</div>
     </div>`;
  },
  ships(){
    return `<p class="section-sub">Each ship is a covenant asset; most carry a magus's laboratory. The Hound of Cassel is a plain merchantman (no lab).</p>
     <div class="grid">${s().ships.map(sh=>{
       const inactive=/no longer|sabbatical|route|left|depart|laid|prize/i.test(sh.status||'');
       return `<div class="card ship"><span class="st ${inactive?'inactive':''}">${esc(sh.status||'')}</span>
        <h3>${esc(sh.name)}${sh.aka?` <small style="color:var(--ink-soft)">(${esc(sh.aka)})</small>`:''}</h3>
        <div class="meta">${esc(sh.kind||'')} · owner <b>${esc(sh.owner||'—')}</b>${sh.captain?` · captain ${esc(sh.captain)}`:''}</div>
        <div class="lab ${sh.lab?'':'none'}">⚗ ${sh.lab?esc(sh.lab):'no laboratory'}</div></div>`;}).join('')}</div>`;
  },
  inhabitants(){
    const st=s();
    const chip=(t,cl)=>` <span style="font-family:Cinzel;font-size:9.5px;letter-spacing:.03em;padding:1px 6px;border-radius:8px;background:${cl}22;color:${cl};border:1px solid ${cl}66">${esc(t)}</span>`;
    const STAND={apprentice:['apprentice','#5b3a8a'],guest:['guest','#2c6b66'],
      twilight:['in Twilight','#8a3324'],sabbatical:['on sabbatical','#8a3324']};
    const CATTAG={companions:['companion','#3e6b35'],familiars:['familiar','#9a6b1f'],npc:['NPC','#6b5436']};
    const COUNT_CATS=['turbula','specialists','craftsmen','servants','crew','grog'];
    const tagOf=i=>{ if(i.standing&&STAND[i.standing])return chip(STAND[i.standing][0],STAND[i.standing][1]);
      if(CATTAG[i.category])return chip(CATTAG[i.category][0],CATTAG[i.category][1]); return ''; };
    const row=i=>`<div class="row">${esc(i.name)}${i.qty>1?` ×${i.qty}`:''}${i.job?` <small>— ${esc(i.job)}</small>`:''}${i.yearBorn?` <small>(b. ${esc(i.yearBorn)})</small>`:''}${tagOf(i)}</div>`;
    const useShip = st.inhabitants.some(i=>i.ship||i.standing);
    if(!useShip){
      const cats={}; st.inhabitants.forEach(i=>(cats[i.category]=cats[i.category]||[]).push(i));
      const order=['magi','companions','specialists','craftsmen','turbula','servants'];
      return `<p class="section-sub">The covenant's people as recorded in the actor (${st.inhabitants.length} total). Counts include grouped servants/turbula.</p>`
        + order.filter(c=>cats[c]).map(c=>{const list=cats[c];
          return `<div class="catblock"><h3>${esc(c)} <span class="n">(${list.reduce((a,i)=>a+(i.qty||1),0)})</span></h3>
            <div class="cols">${list.map(row).join('')}</div></div>`;}).join('');
    }
    const shipName=id=>{const sh=(st.ships||[]).find(x=>x.id===id);return sh?sh.name:(SHIP_NAMES[id]||id);};
    const shipMeta=id=>{const sh=(st.ships||[]).find(x=>x.id===id);return sh?`${esc(sh.kind||'')}${sh.owner?`${sh.kind?' · ':''}${esc(sh.owner)}`:''}`:'';};
    const present=st.inhabitants.filter(i=>!ABSENT.includes(i.standing));
    const absent=st.inhabitants.filter(i=>ABSENT.includes(i.standing));
    const groups={}; present.forEach(i=>{const k=i.ship||'__none__';(groups[k]=groups[k]||[]).push(i);});
    const shipOrder=(st.ships||[]).map(sh=>sh.id).filter(k=>groups[k]);
    const otherKeys=Object.keys(groups).filter(k=>k!=='__none__'&&!shipOrder.includes(k));
    const keys=[...shipOrder,...otherKeys,...(groups['__none__']?['__none__']:[])];
    let html=`<p class="section-sub">Grouped by ship. Each hull carries a pool of 14 crew — named grogs fill slots, the rest shows as “additional crew”. Magi, apprentices, companions, familiars and guests don't count against a ship's crew. Sabbatical crews are tracked but excluded from upkeep; prize crews count.${absent.length?` ${absent.length} member${absent.length===1?'':'s'} in the covenant but not contributing, below.`:''}</p>`;
    html+=keys.map(k=>{
      const list=groups[k]; const sh=(st.ships||[]).find(x=>x.id===k);
      const title=k==='__none__'?'Covenant household':shipName(k);
      const meta=k==='__none__'?'':shipMeta(k);
      const sabbatical=sh&&/sabbatical/i.test(sh.status||'');
      const counting=list.filter(i=>COUNT_CATS.includes(i.category)).reduce((a,i)=>a+(i.qty||1),0);
      const pool=sh?(sh.crew||0):0; const add=Math.max(0,pool-counting);
      const named=list.reduce((a,i)=>a+(i.qty||1),0); const head=k==='__none__'?named:named+add;
      const statusTag= sh&&/sabbatical|prize|route|no longer|left|depart|laid/i.test(sh.status||'') ? chip(sh.status,'#8a3324') : '';
      const addRow=(k!=='__none__'&&add>0)?`<div class="row" style="color:var(--ink-soft);font-style:italic">＋${add} additional crew${sabbatical?' — not counted toward upkeep':''}</div>`:'';
      return `<div class="catblock"><h3 style="text-transform:none">${k==='__none__'?'⚑ ':'⛵ '}${esc(title)} <span class="n">(${head})</span>${meta?` <span class="n">— ${meta}</span>`:''}${statusTag}</h3>
        <div class="cols">${list.map(row).join('')}${addRow}</div></div>`;
    }).join('');
    if(absent.length){
      html+=`<div class="catblock" style="margin-top:14px;border-top:1px dashed rgba(120,90,40,.4);padding-top:10px">
        <h3 style="color:var(--ink-soft);text-transform:none">⧗ In the covenant, not contributing <span class="n">(${absent.length})</span></h3>
        <p class="section-sub" style="margin:0 0 6px">Still of the covenant, but absent — no upkeep, no vote, no seasonal service.</p>
        <div class="cols">${absent.map(row).join('')}</div></div>`;
    }
    return html;
  },
  library(){
    const L=s().library;
    const hdr=`<h2 class="sh" style="margin-top:0">Library <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">— ${L.books.length} books, ${L.labTexts.length} lab texts</span></h2>`;
    return hdr+libTable(L);
  },
  vis(){
    const V=s().vis, stock=V.stock||[], sources=V.sources||[];
    const totalPawns=stock.reduce((a,x)=>a+(x.q||0),0);
    const view=visStockView;
    let stockHtml;
    if(!stock.length) stockHtml='<p class="vis-none">No vis in stock at this node.</p>';
    else if(view==='type'){
      const byArt={}; stock.forEach(x=>{const a=x.art||'?';(byArt[a]=byArt[a]||[]).push(x);});
      const arts=ART_ORDER.filter(a=>byArt[a]).concat(Object.keys(byArt).filter(a=>!ART_ORDER.includes(a)))
        .filter(a=>byArt[a].reduce((t,x)=>t+(x.q||0),0)>0);
      stockHtml=arts.map(a=>{
        const items=byArt[a]; const q=items.reduce((t,x)=>t+(x.q||0),0);
        const tip=items.map(x=>`${x.name} ×${x.q||0}`).join(', ');
        return `<div class="visrow"><span class="vislabel"><span class="sw" style="background:${artColor(a)}"></span>${esc(ART_NAME[a]||a)} <span class="q">${q}</span></span><span class="pawns" title="${esc(tip)}">${pawnRun(a,q)}</span></div>`;
      }).join('');
    } else {
      // By source = the raw-vis form / harvest label the pawns are held as (the lot name,
      // or an explicit `location` override).
      const keyer=x=>x.location||x.name||'__un';
      const grp={}; stock.forEach(x=>{const k=keyer(x);(grp[k]=grp[k]||[]).push(x);});
      const keys=Object.keys(grp).filter(k=>grp[k].reduce((t,x)=>t+(x.q||0),0)>0)
        .sort((a,b)=>a==='__un'?1:b==='__un'?-1:a.localeCompare(b));
      stockHtml=keys.map(k=>{
        const items=grp[k]; const q=items.reduce((t,x)=>t+(x.q||0),0);
        const pawns=items.map(x=>pawnRun(x.art,x.q||0)).join('');
        const arts=[...new Set(items.map(x=>ART_NAME[x.art]||x.art||'?'))].join(', ');
        const tip=items.map(x=>`${x.name} — ${ART_NAME[x.art]||x.art||'?'} ×${x.q||0}`).join(', ');
        const nm=k==='__un'?'Unassigned':k;
        return `<div class="visrow"><span class="vislabel">${esc(nm)} <span class="q">${q} <span style="opacity:.7">${esc(arts)}</span></span></span><span class="pawns" title="${esc(tip)}">${pawns}</span></div>`;
      }).join('');
    }
    const legend=`<div class="leg">${ART_ORDER.map(a=>`<span class="chip">${pawnSpan(a)}${ART_ABBR[a]}</span>`).join('')}</div>`;
    let srcHtml;
    if(!sources.length) srcHtml='<p class="vis-none">No vis sources recorded at this node.</p>';
    else srcHtml=sources.map(src=>{
      const art=src.art, exp=src.expected, rec=src.received;
      const hasNums = exp!=null || rec!=null;
      let pawns='', cmp;
      if(hasNums){
        const r=rec==null?0:rec;
        const base=exp==null?r:Math.min(r,exp);
        const surplus=(exp!=null&&r>exp)?pawnSpan(art,'surplus').repeat(r-exp):'';
        const ghosts=(exp!=null&&r<exp)?pawnSpan(art,'ghost').repeat(exp-r):'';
        pawns=pawnRun(art,base)+surplus+ghosts;
        const cls=exp==null?'':(r>=exp?'met':'short');
        cmp=`<span class="cmp"><span class="${cls}">${rec==null?'—':r}</span> / ${exp==null?'—':exp}${art?` · ${ART_ABBR[art]||art}`:''}</span>`;
      } else {
        cmp=`<span class="cmp">received — / expected — <em>(not recorded)</em></span>`;
      }
      return `<div class="srcrow"><span class="nm">${esc(src.name)}</span><span class="pawns">${pawns}</span>${cmp}</div>`;
    }).join('');
    return `<p class="section-sub">The covenant's raw vis — what's in the vaults, and what each source yielded this year against expectation.</p>
      <h2 class="sh" style="margin-top:4px">Stock <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">— ${totalPawns} pawn${totalPawns===1?'':'s'} in ${stock.length} lot${stock.length===1?'':'s'}</span></h2>
      <div class="viewtoggle"><button class="fbtn ${view==='type'?'on':''}" data-view="type">By type</button><button class="fbtn ${view!=='type'?'on':''}" data-view="source">By source</button></div>
      ${stockHtml}
      ${stock.length?legend:''}
      <h2 class="sh">Sources <span style="font-weight:400;font-size:13px;color:var(--ink-soft)">— pawns received this year vs. expected</span></h2>
      ${srcHtml}`;
  },
  trade(){
    const yr=nodeYear();
    const yv=((D.trade)||[]).filter(t=>t.year===yr);
    const total=yv.reduce((a,t)=>a+(t.result||0),0);
    const shipName=id=>SHIP_NAMES[id]||id;
    const cards=yv.length?yv.map(t=>{
      const bits=[]; if(t.kind)bits.push(t.kind); if(t.risk)bits.push(t.risk+' risk'); if(t.target)bits.push('EF '+t.target);
      const meta=bits.length?` <span style="font-family:Cinzel;font-size:10px;color:var(--ink-soft)">(${esc(bits.join(' · '))})</span>`:'';
      const who=[t.ship?shipName(t.ship):null,t.by].filter(Boolean).join(' — ')||'Trade venture';
      return `<div class="levent"><div class="lt"><span class="season">${esc(t.season)} ${yr}</span><b class="${t.result<0?'neg':'pos'}">${t.result>0?'+':''}${t.result} £</b></div>
        <h4>${esc(who)}${meta}</h4><p>${esc(t.detail||'')}</p></div>`;
    }).join(''):`<div class="notpop">No documented trade ventures for ${yr}. Any standing trade income is on the <b>Economics</b> tab.</div>`;
    return `<p class="section-sub">Seasonal trade — one roll per ship, per season, under the covenant’s <a href="reference.html">homebrew trade rule</a> (Reference → Homebrew). Each trade includes the <b>£9 net-neutral base</b> (a break-even voyage still nets +9); piracy and theft don’t. Only ventures with a recorded result are shown; totals feed the Economics tab.</p>
      <div class="ledger">${cards}${yv.length?`<div class="econ-row" style="margin-top:8px;border-top:1px solid rgba(120,90,40,.4)"><span><b style="font-family:Cinzel">Documented trade, ${yr}</b></span><b class="pos econ-big">${total} £</b></div>`:''}</div>`;
  },
  economics(){
    const e=s().economics;
    const exp=e.yearlyExpenses||{};
    const expRows=Object.entries(exp).map(([k,v])=>`<div class="econ-row"><span style="text-transform:capitalize">${esc(k)}</span><b>${v&&v.amount!=null?v.amount:(typeof v==='object'?'':v)} £</b></div>`).join('');
    const na='<span style="color:var(--ink-soft);font-style:italic">not yet reconstructed</span>';
    const incReady=e.totalIncome!=null;
    return `<div class="grid">
      <div class="card"><h2 class="sh" style="margin-top:0">Balance</h2>
        <div class="econ-row"><span>Total expenditure</span><b class="neg">${e.totalExpenditure} £</b></div>
        <div class="econ-row"><span>Total income</span><b class="pos">${incReady?e.totalIncome+' £':na}</b></div>
        <div class="econ-row"><span>Wealth</span><b class="econ-big ${e.wealth<0?'neg':(e.wealth>0?'pos':'')}">${e.wealth!=null?e.wealth+' £':na}</b></div>
        <div style="margin-top:6px;font-size:12px;color:var(--ink-soft)">Points — inhabitants ${e.inhabitantsPoints}, laboratories ${e.laboratoriesPoints}, weapons ${e.weaponsPoints}</div>
      </div>
      <div class="card"><h2 class="sh" style="margin-top:0">Income sources</h2>
        ${incReady?(e.incomeSources||[]).map(x=>`<div class="econ-row"><span>${esc(x.name)} <small>(${esc(x.type||'')})</small></span><b class="${x.incoming<0?'neg':'pos'}">${x.incoming} £</b></div>`).join('')||na:na}</div>
      <div class="card"><h2 class="sh" style="margin-top:0">Yearly expenses</h2>${expRows||'—'}</div>
     </div>
     ${(e.debts&&e.debts.length)?`<div class="card" style="margin-top:10px"><h2 class="sh" style="margin-top:0">Debts owed</h2>
        ${e.debts.map(x=>`<div class="econ-row"><span>${esc(x.name)}${x.notes?` <small>(${esc(x.notes)})</small>`:''}</span><b class="neg">${x.amount} £</b></div>`).join('')}
        <div class="econ-row" style="border-top:1px solid rgba(120,90,40,.4)"><span><b style="font-family:Cinzel">Total owed</b></span><b class="neg econ-big">${e.debts.reduce((a,x)=>a+(x.amount||0),0)} £</b></div>
        <div style="margin-top:4px;font-size:12px;color:var(--ink-soft);font-style:italic">The Bruges credit is available as cash (adding to wealth) but repayable — a liability, not income.</div></div>`:''}
     <p class="section-sub" style="margin-top:12px">${(e.incomeSources||[]).some(x=>/bruges|credit/i.test((x.name||'')+(x.type||'')))
        ? 'Note: these are the actor’s baseline figures; the Bruges credit line (275 £) inflates income, and Foxglove’s unsanctioned dragon-gold is <em>not</em> covenant wealth (see Ledger).'
        : 'Expenditure reconstructed from the <em>Covenants</em> RAW (inhabitant/laboratory/weapon points → category costs), with fleet hull-maintenance in place of the landed “Buildings” line.'+(incReady?'':' Income is pending.')}</p>`;
  },
  ledger(){
    const upto=ledgerUpTo();
    const facets=['all',...[...new Set(upto.map(l=>l.facet))]];
    const btns=facets.map(f=>`<button class="fbtn ${ledgerFilter===f?'on':''}" data-f="${esc(f)}">${f==='all'?'All':esc(f)}</button>`).join('');
    const items=upto.filter(l=>ledgerFilter==='all'||l.facet===ledgerFilter)
      .slice().sort((a,b)=>(b.sort_iso||'').localeCompare(a.sort_iso||''));
    const scope = node==='current' ? 'through the present' : `through the end of Winter ${esc(N().label)}`;
    return `<p class="section-sub">Dated changes ${scope}, newest first. This is the covenant's true running history; the state tabs show where it stood at the selected node.</p>
      <div class="ledger">${btns}
      ${items.map(l=>`<div class="levent">
        <div class="lt"><span class="facet f-${esc(l.facet)}">${esc(l.facet)}</span><span class="season">${esc(l.season)}</span></div>
        <h4>${esc(l.summary)}</h4><p>${esc(l.detail)}</p></div>`).join('') || '<p>No entries for this facet.</p>'}</div>`;
  }
};
function wireLedger(){ document.querySelectorAll('.ledger .fbtn').forEach(b=>b.onclick=()=>{ledgerFilter=b.dataset.f;render();}); }
function wireVis(){ document.querySelectorAll('.viewtoggle .fbtn[data-view]').forEach(b=>b.onclick=()=>{visStockView=b.dataset.view;render();}); }
function wireLib(){ wireLibTable(); }
function libRows(L){
  const mk=(b,icon)=>({icon,title:bt(b),
    type:(typeof b==='object'&&b.type)?b.type:null,
    location:(typeof b==='object'&&b.location)?b.location:null,
    level:(typeof b==='object'&&b.level!=null)?b.level:null,
    quality:(typeof b==='object'&&b.quality!=null)?b.quality:null,
    topic:(typeof b==='object'&&b.topic)?b.topic:null});
  return [...(L.books||[]).map(b=>mk(b,'📖')),...(L.labTexts||[]).map(b=>mk(b,'📜'))];
}
function libTable(L){
  const rows=libRows(L);
  const cols=[['title','Title'],['type','Type'],['location','Location'],['level','Level'],['quality','Quality'],['topic','Topic']];
  const distinct=k=>[...new Set(rows.map(r=>r[k]).filter(v=>v!=null))].sort((a,b)=>typeof a==='number'?a-b:String(a).localeCompare(String(b)));
  const fkeys=['type','location','level','quality','topic'];
  const fr=rows.filter(r=>fkeys.every(k=>{const f=libFilter[k]; if(f==='all')return true; if(f==='__none')return r[k]==null; return String(r[k])===String(f);}));
  const {col,dir}=libTableSort;
  fr.sort((a,b)=>{let x=a[col],y=b[col]; const xn=x==null,yn=y==null;
    if(xn&&yn)return 0; if(xn)return 1; if(yn)return -1;
    return (typeof x==='number'&&typeof y==='number'?(x-y):String(x).localeCompare(String(y)))*dir;});
  const sel=(k,label,none)=>{const opts=['<option value="all">All</option>']
      .concat(none?['<option value="__none"'+(libFilter[k]==='__none'?' selected':'')+'>— none —</option>']:[])
      .concat(distinct(k).map(v=>`<option value="${esc(String(v))}"${String(libFilter[k])===String(v)?' selected':''}>${esc(String(v))}</option>`));
    return `<label>${label}<select data-filter="${k}">${opts.join('')}</select></label>`;};
  const filters=`<div class="libfilters">${sel('type','Type')}${sel('location','Location',true)}${sel('level','Level',true)}${sel('quality','Quality',true)}${sel('topic','Topic',true)}<button class="clr" data-clear="1">Reset</button></div>`;
  const arrow=k=>col===k?` <span class="ar">${dir>0?'▲':'▼'}</span>`:'';
  const head=`<tr>${cols.map(([k,l])=>`<th data-col="${k}" class="${col===k?'sorted':''}">${l}${arrow(k)}</th>`).join('')}</tr>`;
  const dim='<span class="dim">—</span>';
  const body=fr.map(r=>`<tr>
     <td><span class="kindico">${r.icon}</span>${esc(r.title)}</td>
     <td class="dim">${esc(r.type||'—')}</td>
     <td>${r.location?esc(r.location):dim}</td>
     <td class="num">${r.level==null?dim:r.level}</td>
     <td class="num">${r.quality==null?dim:r.quality}</td>
     <td>${r.topic?esc(r.topic):dim}</td></tr>`).join('');
  return filters+`<p class="libcount">${fr.length} of ${rows.length} texts</p>`
    +`<table class="libtbl"><thead>${head}</thead><tbody>${body||'<tr><td colspan="6" class="dim" style="text-align:center;padding:16px">No texts match these filters.</td></tr>'}</tbody></table>`;
}
function wireLibTable(){
  document.querySelectorAll('.libfilters select').forEach(el=>el.onchange=()=>{libFilter[el.dataset.filter]=el.value;render();});
  const clr=document.querySelector('.libfilters .clr'); if(clr)clr.onclick=()=>{libFilter={type:'all',location:'all',level:'all',quality:'all',topic:'all'};render();};
  document.querySelectorAll('table.libtbl th[data-col]').forEach(th=>th.onclick=()=>{const c=th.dataset.col;
    if(libTableSort.col===c)libTableSort.dir*=-1; else libTableSort={col:c,dir:1}; render();});
}
load();
</script>
</body>
</html>
